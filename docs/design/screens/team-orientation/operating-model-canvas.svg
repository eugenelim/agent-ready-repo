<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="omc-title omc-desc">
  <title id="omc-title">How a team takes this on</title>
  <desc id="omc-desc">A route with five evenly spaced stations left to right: Evaluate, Prove it on real work, Win buy-in, Roll out a cohort, Make it the default. Position shows order, not duration. Hanging below the second station is an enclosure containing a separate vertical sequence of eight steps — what happens to one piece of work. Five of those eight steps are marked with a diamond as points where a person decides, and some carry more than one decision. The first three steps are grouped as travelling with you across repositories; the remaining five are grouped as living in this repository, and a gap in the track separates the two groups. A dashed arrow leaves the enclosure and points one way to your tracker, which gets a report; the line ends at a buffer stop past it, because nothing comes back from the tracker into the work.</desc>

  <!-- REFERENCE COMPOSITION — not the shipped asset.
       Colour literals are resolved from web/src/styles/tokens.css at 047bf0192 and
       MUST be regenerated from the token source at build time. See
       docs/design/direction/token-verification.md finding 1.

       Ground: the DARK hero carrier, because IA zone 1 places this element in the
       dark band and the base aesthetic direction pins the hero to that carrier.
       An earlier draft was composed on the light ground, which voided every
       contrast measurement taken against it. Cold review caught it.

       Survives GitHub's Markdown sanitiser: no <style>, no class, no style
       attribute, no script, no foreignObject, no @import, no var(), no animation.
       <defs> and <marker> survive. The two ids carry the accessible name and
       description for the inline rendering; GitHub strips them, which is harmless
       because an <img>-embedded SVG exposes no internals and the alt text carries
       the name there instead. -->

  <defs>
    <marker id="omc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9d9fa0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#0b0e12"/>

  <text x="70" y="46" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">How a team takes this on</text>
  <text x="70" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cecfd0">The common route, in order. Teams skip stations and revisit them, and the spacing shows sequence rather than time.</text>

  <!-- ── PRIMARY: the team's arc. Horizontal, first in the scan path, and carrying
         the heaviest type after the title, so position and weight both give it
         primacy over the larger enclosure below. Stations are evenly spaced; an
         earlier draft's uneven intervals read as unequal duration. ───────────── -->
  <g font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="150" y="112">Evaluate</text>
    <text x="390" y="112">Prove it on real work</text>
    <text x="630" y="112">Win buy-in</text>
    <text x="870" y="112">Roll out a cohort</text>
    <text x="1085" y="112">Make it the default</text>
  </g>

  <line x1="70" y1="148" x2="1130" y2="148" stroke="#9d9fa0" stroke-width="2"/>

  <circle cx="150" cy="148" r="13" fill="#372917" stroke="#e8952b" stroke-width="3"/>
  <circle cx="390" cy="148" r="13" fill="#372917" stroke="#e8952b" stroke-width="3"/>
  <circle cx="630" cy="148" r="13" fill="#372917" stroke="#e8952b" stroke-width="3"/>
  <circle cx="870" cy="148" r="13" fill="#372917" stroke="#e8952b" stroke-width="3"/>
  <circle cx="1085" cy="148" r="13" fill="#372917" stroke="#e8952b" stroke-width="3"/>

  <!-- ── SECONDARY: station two opened up. The change of axis — horizontal arc,
         vertical sequence — is what tells the reader which lifecycle they are in,
         with no legend. ───────────────────────────────────────────────────────── -->
  <line x1="390" y1="161" x2="390" y2="190" stroke="#e8952b" stroke-width="2"/>
  <rect x="160" y="190" width="440" height="400" rx="14" fill="#111520" stroke="#e8952b" stroke-width="2"/>

  <text x="180" y="222" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Prove it on real work</text>
  <text x="180" y="241" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9d9fa0">what happens to one piece of work</text>

  <!-- Scope groups: a gap in the track carries the boundary, and each group is
       labelled horizontally. An earlier draft used rotated 11px margin labels,
       which were the first thing to become illegible at README width. -->
  <text x="180" y="270" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#9d9fa0">TRAVELS WITH YOU, ACROSS REPOSITORIES</text>
  <line x1="196" y1="288" x2="196" y2="356" stroke="#9d9fa0" stroke-width="2"/>

  <text x="180" y="392" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#9d9fa0">LIVES IN THIS REPOSITORY</text>
  <line x1="196" y1="412" x2="196" y2="548" stroke="#9d9fa0" stroke-width="2"/>

  <!-- Ordinary steps — circles. -->
  <circle cx="196" cy="288" r="5" fill="#0b0e12" stroke="#e8952b" stroke-width="2"/>
  <circle cx="196" cy="446" r="5" fill="#0b0e12" stroke="#e8952b" stroke-width="2"/>
  <circle cx="196" cy="514" r="5" fill="#0b0e12" stroke="#e8952b" stroke-width="2"/>

  <!-- Human-decision steps — a different SHAPE, not merely a different colour.
       Five of the eight, not three: an earlier draft omitted the two shaping
       decisions, which told a reader that shaping is unsupervised. -->
  <rect x="189" y="315" width="14" height="14" transform="rotate(45 196 322)" fill="#e8952b" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="189" y="349" width="14" height="14" transform="rotate(45 196 356)" fill="#e8952b" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="189" y="405" width="14" height="14" transform="rotate(45 196 412)" fill="#e8952b" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="189" y="473" width="14" height="14" transform="rotate(45 196 480)" fill="#e8952b" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="189" y="541" width="14" height="14" transform="rotate(45 196 548)" fill="#e8952b" stroke="#ffffff" stroke-width="1.5"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cecfd0">
    <text x="216" y="292">A signal arrives</text>
    <text x="216" y="326" font-weight="600" fill="#ffffff">An outcome you ratified</text>
    <text x="216" y="360" font-weight="600" fill="#ffffff">A brief you agreed to build from</text>
    <text x="216" y="416" font-weight="600" fill="#ffffff">A spec and plan you approved</text>
    <text x="216" y="450">Code past the gates and three cold reviews</text>
    <text x="216" y="484" font-weight="600" fill="#ffffff">A pull request you merge</text>
    <text x="216" y="518">A deployment validated off production</text>
    <text x="216" y="552" font-weight="600" fill="#ffffff">You ratify the production ship</text>
  </g>

  <!-- ── The tracker: one-way, and the direction is DRAWN rather than captioned.
         The arrow points out; the buffer stop sits past the tracker, where the
         line ends. It leaves the enclosure's edge, not any single step's
         baseline — an earlier draft attached it at the merge step and so implied
         the report is emitted at merge. -->
  <line x1="600" y1="390" x2="738" y2="390" stroke="#9d9fa0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#omc-arrow)"/>
  <text x="756" y="386" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ffffff">Your tracker</text>
  <text x="756" y="404" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9d9fa0">gets a report</text>
  <line x1="898" y1="374" x2="898" y2="406" stroke="#ffffff" stroke-width="3"/>
  <line x1="906" y1="380" x2="906" y2="400" stroke="#ffffff" stroke-width="2"/>
  <text x="920" y="394" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9d9fa0">nothing comes back</text>

  <!-- Legend, outside the enclosure so it cannot read as a ninth step. -->
  <rect x="73" y="611" width="10" height="10" transform="rotate(45 78 616)" fill="#e8952b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="94" y="620" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9d9fa0">a person decides — some steps carry more than one decision</text>
</svg>
