<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout — payment</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin: 0; background: var(--color-surface-default); color: var(--color-text-default); }
    .checkout { display: grid; gap: var(--space-6); padding: var(--space-5); }
    .field { display: grid; gap: var(--space-2); margin-block-end: var(--space-3); }
    .group + .group { border-block-start: 1px solid var(--color-border-divider); padding-block-start: var(--space-4); }
    .hint { color: var(--color-text-muted); }
    .pay { background: var(--color-accent-action); color: var(--color-text-on-action); padding: var(--space-1) var(--space-4); margin-block-start: var(--space-5); }
    @media (min-width: 1152px) { .checkout { grid-template-columns: 3fr 2fr; } }
  </style>
</head>
<body>
  <main class="checkout">
    <form class="payment" aria-labelledby="payment-title">
      <h1 id="payment-title">Payment</h1>
      <div class="group">
        <div class="field">
          <label for="card">Card number</label>
          <input id="card" name="card" inputmode="numeric" autocomplete="cc-number">
          <p class="hint">Charged only when you confirm the order.</p>
        </div>
      </div>
      <button class="pay" type="submit">Pay now</button>
    </form>
    <aside class="summary" aria-label="Order summary">
      <h2>Order summary</h2>
    </aside>
  </main>
</body>
</html>
