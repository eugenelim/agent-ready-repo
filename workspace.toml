  # is a human-review control whose reasons are checked for presence, not
  # truth, so it wants a deliberate decision rather than a merge-time guess.
  # Unblocks when: someone decides which check should gate CSS tokens, and
  # writes the matching disposition.


  # tools/lint-guide-titles.py (added by spec/tech-site-polish-batch) found 9
  # guides whose frontmatter title and body H1 disagreed. The H1s were
  # RECONCILED to match `title:` — not deleted. Deletion was considered and
  # rejected: guides/_shared/** ships verbatim into adopter catalogues and
  # bundles where frontmatter never renders, so a deleted H1 leaves those files
  # opening with no heading at all. Reconciling means the frontmatter title is
  # what publishes, and in most cases that is the WEAKER of the two strings:
  # "Scaffold a Component" beat "Tutorial: Scaffold a component from a screen
  # brief"; "Run an Audit" beat "How-to: Run a frontend-engineering audit";
  # "Frontend Engineering Pack" beat "`frontend-engineering` — the skills and
  # the reviewer"; "IaC (Terraform) guides" beat "`iac-terraform` — guides".
  # Two of the nine went the other way (the longer string won). No content is
  # lost — the old H1s are in git history at the batch's commit.
  # Fix: pick the better wording for those 9 and put it in `title:`. Files: the
  # 9 guides listed in that commit. Watch: guide-nav-baseline.toml resolves
  # sidebar labels from a frozen baseline before falling back to the page title,
  # so a title change may not move the sidebar label — check both.
  # Unblocks when: ready now.
