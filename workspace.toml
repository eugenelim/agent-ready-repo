  # This sequence is adaptive: at each completed slice, compare measured behavior and
  # repository evidence with the remaining entries. Update, split, combine, reorder, or
  # retire later entries through normal review when their assumed shape has changed;
  # queue comments are a roadmap, while each approved spec is the implementation truth.

  # Slices 1 and 2 are shipped in the work list above. Their measured behavior is
  # the adaptive starting point for every remaining slice; do not preserve an
  # assumed integration shape when evidence supports splitting, combining,
  # reordering, or retiring it.

  # Slice 3 — review and research integrations. Extend the proven handoff to selected
  # architecture, adversarial, security, quality, and research workflows at stable meaning
  # boundaries. Capture conclusions and reusable method residue, never transcripts, raw
  # source corpora, or recalled secrets. Retrieval stays explicit, scoped to declared
  # competency questions, and cannot amplify authority. Reassess the catalogue selection,
  # gate timing, and whether review and research remain one spec after Slice 2 evidence.
