# Repo-level backlog — open work not scoped to any active initiative.
# Populated by the m3-backlog-absorption migration (docs/specs/m3-backlog-absorption/).
# Entries are inline objects: {slug, needs?, source?} where:
#   slug   — unique identifier; matches any (deferred: <slug>) marker in specs
#   source — deferred-AC provenance, e.g. "spec/foo AC3"
#   needs  — same prefix notation as queue entries ("backlog:<slug>", "work:spec/...")
# Per-entry TOML comments must be cold-start-sufficient: problem, fix, file/skill, unblock.
# When the unblock condition is another tracked item (a hard AND dependency), also
# add a `needs` edge — not prose alone. Disjunctive/untracked/external unblocks stay prose.
# Distinct from [ini-NNN.shaping_queue].backlog (per-initiative non-active tier).
[backlog]
open = [
  # lint-traceability.py classifies any `<dir>/<file>.md` producer pointer as a
  # cross-repository reference, so now that a spec's `Brief:` back-link is the
  # canonical path form it reports a brief that lives in THIS repo as "unknown /
  # not-yet-catalogued (cross-repo, unresolvable)" and drops the brief↔spec edge
  # it exists to generalize. Informational, exit 0, so no gate catches it. A
  # mistyped path is also only informational, where a mistyped bare slug has
  # always been a fatal dangling pointer — so path-form typos are detected less
  # strictly than slug-form ones. Fix: resolve a canonical local brief path to
  # its brief node before endpoint classification
  # (packs/core/.apm/skills/work-loop/scripts/lint-traceability.py). Attempted
  # and withdrawn during the brief-path provenance fix: the shipped
  # docs/specs/traceability-lint/spec.md makes this Ask-first ("changing a
  # producer-pointer field") and its Never-do list forbids identifying a node by
  # file path, hardcoding an artifact path, and treating a well-formed cross-repo
  # reference as dangling — and a naive alias hard-failed on brief files that
  # exist under a `[traceability].briefs` override. Unblocked by a reviewed
  # amendment to that spec carrying the Ask-first sign-off; no `needs` edge.
  {slug = "traceability-brief-path-backlink-unresolved", source = "spec-less brief-path provenance fix (review rounds 1 and 4)"},
  # lint-brief-coverage.py and lint-traceability.py both still match a bare-slug
  # `Brief:` back-link, so a slug-form spec passes every early gate and only
  # fails later at workspace-status reconciliation, where it blocks dispatch.
  # The docstrings now say the slug is backward-compatible only, but nothing
  # tells an author at lint time. Fix: have the coverage lint emit a non-fatal
  # note naming any spec whose back-link matched by slug rather than by path
  # (lint-brief-coverage.py, receive-brief skill). Deferred because it adds
  # output to a lint many repositories run in CI. Unblocked once the note is
  # agreed to be non-fatal and that lint's output contract is versioned; no
  # tracked dependency, so no `needs` edge.
  {slug = "brief-backlink-slug-form-needs-lint-note", source = "spec-less brief-path provenance fix (review concern 5)"},
  # The publish job's environment gate asks a human to release executable plugin
  # code adopters install, but GitHub's approval UI shows only the environment
  # name and a comment box — nothing about what is being published. A summary
  # step cannot fix it: `environment:` is job-level, so the whole job blocks on
  # approval and nothing in it runs first. AC35 clause 3 also pins build and
  # publish to one job, and constrains any cross-job artifact handoff to verify a
  # producer-recorded digest before the token-bearing push. Fix: a SEPARATE
  # non-gated workflow on the same push that posts a preview to the run summary —
  # packs changed vs the current claude-plugins-dist, added/removed plugins, and
  # any hook entries being registered. It feeds nothing into the publish job, so
  # clause 3 is untouched; it only gives the approver something to read. Needs a
  # spec note, since it changes what AC35's approval step means in practice.
  {slug = "publish-approval-preview-summary", source = "spec/claude-plugin-hook-parity AC35"},
  # catalogue-tooling-ci-gates.yml Gate B builds a synthetic external catalogue
  # with `agentbundle catalogue build`, so an engine change can redden it while
  # every `make` target stays green — it did, on spec/claude-plugin-route-scope,
  # and no local command would have caught it. Fix: a `make` target that extracts
  # the fixture heredoc and runs the same command, chained into `make ci`.
  {slug = "catalogue-gate-b-no-local-target", source = "spec/claude-plugin-route-scope"},
  # agentbundle-install-marker-importable-path — the wheel ships
  # agentbundle/_data/install-marker.py at a path that is not importable, which
  # `check-wheel-contents` reports as W004. Surfaced while measuring artifacts for
  # RFC-0082 and deliberately excluded from its scope: it is a packaging defect,
  # not a test-ownership one, and folding it into a release-blocking spec would
  # muddy that spec's diff. Recorded here so it survives RFC-0082's follow-ons
  # stalling. Fix: move the file to an importable path, or declare it data rather
  # than a module.
  {slug = "agentbundle-install-marker-importable-path", source = "spec/engine-export-boundary (out of scope)"},
  # The publish job triggers on `push: main` with `contents: write` and declares
  # no `needs:` on the build-check job, so it runs regardless of that job's
  # result. `main` requires no PR review and has no CODEOWNERS, so the real trust
  # boundary for publishing to a public marketplace is push access to `main`.
  # The in-code half shipped (publish_claude_plugins.py re-derives the predicate
  # and refuses on desync); this is the actor half. Fix: gate the publish job on
  # `workflow_run` + `conclusion == success` rather than a GitHub Environment
  # reviewer, which is a non-control in a single-maintainer repo.
  {slug = "plugin-publish-required-reviewer", source = "spec/claude-plugin-route-scope"},

  # The publication-control evidence has no upper bound on age.
  # compare_evidence checks observed_at is a non-empty string and nothing more,
  # so the committed artifact (observed_at 2026-08-12) keeps the gate green
  # forever no matter what changes in GitHub settings afterwards: the ruleset
  # flipped to `evaluate`, a second bypass actor added, the App re-installed
  # org-wide. Pre-existing, but spec/publish-control-evidence-repo-binding
  # strengthened the artifact's SUBJECT claim, which makes the unbounded TIME
  # claim the weaker half of the pair. Surfaced by security review there.
  # Fix: a max-age check in compare_evidence, with the number declared in
  # .github/claude-plugin-publish-control.json so it is reviewable rather than
  # buried in the linter. The hard part is not the check: expiry blocks every
  # merge until an operator with the App private key re-runs the capture, so
  # decide the operational answer (how long, who is paged, what the escape
  # hatch is) before writing it. That is why it is not a ride-along.
  {slug = "publish-control-evidence-max-age", summary = "Bound the age of the publish-control evidence -- observed_at is checked for being a non-empty string and nothing else, so a stale artifact certifies settings that may have changed", source = "spec/publish-control-evidence-repo-binding security review"},
  # `_aggregate_marketplace` runs on an adopter's `run_self_host`, and
  # `[pack.adapter-contract]` is optional in `contracts/pack.schema.json` — so a
