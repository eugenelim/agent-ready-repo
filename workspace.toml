  {slug = "credbroker-socket-budget-float-tolerance", source = "docs/product/intents/credbroker-socket-budget-float-tolerance.md", summary = "Closed 2026-09-01 by PR #1206 (merged). The assertion compared the derived per-hop socket timeout against its 1.0s budget exactly, so Windows' 1.0000000000000142 reddened pytest credbroker (windows) and through it make build-check (windows) on a diff touching no credbroker path. The bound now carries a 1e-9 tolerance whose value has an origin rather than being tuned until green: the ULP of 1.0 is 2.22e-16 so the artifact is ~63 ULPs, a genuine overrun is a scheduling event with a millisecond floor, and 1e-9 sits ~70,000x above the artifact and ~1,000,000x below the smallest real overrun. Measured on the dev host the value is 0.9999804999679327, already 1.95e-5 under budget from elapsed time, so the assertion already carried four orders of magnitude more natural slack than the tolerance adds. An earlier draft used 2e-14, only 1.43x a single observation, and was rejected as too thin to survive a different timer. Mutation-proven: deleting the budget clamp in _sso.py reds that exact line with assert 5.0 <= (1.0 + 1e-09), and the neighbouring 0 < seen[-1] <= _DERIVE_SOCKET_TIMEOUT_S bound is untouched."},

  {slug = "pre-existing-duplicate-pack-test-basenames", source = "pre-flight/2026-08-30", summary = "Closed 2026-09-01 as refuted. The measurement stands: pytest packs/<pack>/tests/skills --collect-only across every pack has 26 collection aborts, not the one the entry named (core 1, governance-extras 2, atlassian 13, converters 4, desk-research 6, agent-skill-engineering 0). But ADR-0101 (Accepted) names this exact import file mismatch on duplicate test_render.py as a known, measured failure and decides one process per skill directory as the answer, treating its loudness as a virtue against the silent subject-module collision; guides/_shared/reference/catalogue-authoring-standards.md § 4, which ships to adopters, tells pack authors two skills may reasonably both ship test_render.py. Renaming contradicts both. Atlassian's 13 are unfixable regardless: packages/agentbundle/agentbundle/catalogue_tooling/self_host_windows.py hardcodes the four jira and three confluence-crawler SSO filenames and that tree needs an Engine-Change-RFC: trailer. --import-mode=importlib was tested and is not a free fix: it clears governance-extras and desk-research but takes core from 1 error to 17, because those suites depend on prepend-mode sys.path insertion. Reopening this means an RFC amending ADR-0101 and the adopter standard, not another sweep."},

  {slug = "reviewer-agent-vacuous-assertion-coverage", source = "docs/product/intents/reviewer-agent-vacuous-assertion-coverage.md", summary = "Closed 2026-09-01 in core 2.20.1, delivered narrower than drafted. quality-engineer.md gains the four shapes as items 4-7 of Test design (empty-set without a positive control; a negative case green from an unstubbed collaborator; a source-substring control pin; prose standing in for a captured baseline), renumbering that list to 34. The intent's second half was dropped and the intent amended to match: docs/CONVENTIONS.md's reviewer-model table, amended by 9b9d470ef (core 2.20.0), gives quality-engineer exclusive ownership of test strength, whether an assertion can fail, and the proposed security-reviewer obligation is exactly that lens; shape 3 carries the security substance in the agent that owns the lens and no compensating pointer was added to security-reviewer.md, by owner decision. The intent's line-count assumption was also stale: quality-engineer.md was 492 lines not 464, and the 500-line warn threshold it cited applies to SKILL.md under .apm/skills/, never to .apm/agents/."},

  {slug = "lint-spec-status-scope-to-changed-specs", source = "spec/sso-store-transition-serialization pre-flight", summary = "Closed 2026-08-31 by PR #1188 in core 2.17.3. Measured on this repo at 423 specs, load ~12: the exhaustive sweep (now --all, byte-identical work to the old default) runs 30.8-32.5s and the scoped default runs 2.0-2.1s. An earlier 46s/42s baseline was taken at load 44-124 and is not comparable; --all at matched load is the honest before-number. The entry's 2m16s was a different machine and was not reproduced. Its soundness claim was WRONG in both directions. It predicted only the repo-wide warn-only pass would narrow; in fact invariant (iii) does not narrow at all (182 warnings in both modes), and invariant (iv) MUST NOT be scoped -- its second input is workspace.toml, so closing a [backlog].open entry invalidates the marker in every spec citing it, none of which need have changed. (iv) is HARD, 76 markers are live, and closing an entry is the routine close-work operation, so (iv) now runs repo-wide beside (iii) in one shared pass. What narrows is the per-spec warn-only output for unchanged specs: 34 (v) and 18 (i) warnings, all of which --all still reports. Four fail-open defects were found by running the code, three of them by independent review: git diff reported tracked changes only so a NEW uncommitted spec was skipped (12 tests catch the fix); git diff reported repo-root-relative paths so a subdirectory --root dropped every spec and gated nothing (--relative); neither git call used -z so a path needing quoting was dropped; and both summary lines printed a bare clean verdict while having selected zero specs. The scope-report and the None-means-full-sweep contract were themselves unasserted -- mutating either left all 82 tests green -- and now have named controls. Three tests whose subject is an UNCHANGED spec pass all_specs=True with the reason recorded; their assertions are unchanged"},


  {slug = "project-knowledge-capture-times-out", source = "spec/ci-gate-parallelization Capture learnings", summary = "Closed 2026-08-31 by PR #1186 in core 2.17.2, both halves now evidenced. TIMING (the entry's own reproduction, which the first draft of this closure only inferred): the coherence check it measured at 22-31s of a 30s budget over 65 topics now runs in 0.68s over 76 committed topic files, because batching the per-topic git ls-tree into one ls-tree -r -z had already shipped -- _read_committed_topic_map calls the batched _committed_blob_ids and the only single-object caller left is _committed_blob_size. DIAGNOSTICS landed here: an elapsed deadline refused as journal_capacity with recovery_action fix_request and retryable false, all three wrong. deadline_exceeded now carries retryable=true so _diagnostic derives retry. THREE of the four subprocess.TimeoutExpired catch sites report it (_git_read, _git_read_bounded, _committed_blobs_by_id); the fourth is deliberate and pinned by a named test -- resolve_worktree_root IS the confinement proof, so an unfinished check stays a non-retryable confinement refusal rather than inviting a loop against an unbounded boundary check. Review also caught that the first revision made capture WORSE: _committed_path_exists, _committed_v1_map_is_coherent and _git_object_algorithm each converted the new refusal into False or a sha1 default, so _assert_v1_writer_allowed -- the gate on all four writer paths including capture -- re-refused as staged_dual_writer. A _reraise_deadline helper closes all three, mutation-proven. Preserved: byte-limit refusals stay journal_capacity, genuine incoherence stays map_mismatch, and no other refusal's retryability changed. RESIDUAL, not blocking this closure: no consumer reads the retryable field yet -- work-loop SKILL.md gives no retry instruction -- so the field is honest metadata rather than an automatic retry"},

  {slug = "catalogue-tooling-workflow-hardening", source = "spec/ci-gate-parallelization AC12", summary = "Closed 2026-08-31 by PR #1184. catalogue-tooling-ci-gates.yml was the only workflow with no top-level permissions block; the entry's \"one of three\" was already stale. All eight jobs reviewed before applying: no step references GITHUB_TOKEN, github.token or any secret, none writes to git, and the artifact actions authenticate with ACTIONS_RUNTIME_TOKEN while download-artifact's optional github-token input is unset -- so the entry's \"very likely safe\" is now measured. Gate G keeps fetch-depth: 0 because check_release_impact.py shells out to git diff alone. zizmor --min-severity low on the file went from 17 medium findings (8 artipacked plus excessive-permissions) to none; the broad gate runs at high, so this was never a red gate and its threshold is unchanged. Security review then found the new posture unasserted, so the workflow joins check-zizmor-excessive-permissions.py's WORKFLOWS tuple -- mutation-proven, deleting the block exits 1. The persist-credentials half stays uncovered because artipacked is a separate ident below the broad gate's floor; that gap is recorded against workflow-posture-guard-coverage-gaps rather than left implied"},

  {slug = "tdd-stub-replaces-prose", source = "docs/product/intents/tdd-stub-replaces-prose.md", summary = "Closed 2026-08-30 as delivered in core 2.16.3. The accepted semantic rule stands: exact executable test code replaces behavior-restating prose. PLAN now owns bounded, no-network, timeout-limited, filesystem-confined validation from disposable scratch and writes no repository test; failed compile or intended-red proof blocks approval unless the closed implementation-discovered exception applies. Code-mode EXECUTE materializes the approved payload only after CODE-IMPLEMENTATION, using an explicit one-terminal-newline byte contract, then completes red-green-refactor. RFC-0028 errata, conventions, architecture, adopter guides, evals, projections, and regression tests carry the durable result"},

  {slug = "contract-amendment-pre-wave-window", source = "docs/product/intents/contract-amendment-pre-wave-window.md", summary = "Closed 2026-08-29 as a bug fix in core 2.15.5. contract-amendment refused until a task had completed, so the pre-wave window — baseline sealed, current_wave_index 0, review finding a defect before wave 1 — had no legal correction route. RFC-0099 section 7 (Accepted 2026-08-27) declares that route legal from implementation, verification, or review with no completed-work precondition; the guard landed 2026-08-26 in be51a9847, one day earlier, and was never re-checked when the decision landed. Four guards, not the three the intent named: the fourth was parse_completed_task_evidence_entries rejecting an empty tuple. missing_evidence remains the sole enforcer and is mutation-proven — neutering it fails exactly one test. Two deliberately written assertions had to be removed, contradicting the intent's assumption that no test asserted the refusal"},

  {slug = "core-seed-placeholder-shapes", source = "docs/product/intents/core-seed-placeholder-shapes.md", summary = "Closed 2026-08-29 as refuted; no change made. All three named seeds already declare their shapes at lint.py:378-380, added by fd59e28c6 — the same commit the intent says introduced them. catalogue lint and catalogue verify are both clean on a tree at 27e7430e9. The three CAT-V-002 errors reproduce only under the bare agentbundle console script, which resolves to a stale 0.40.0 site-packages wheel whose lint.py lacks all three keys; the intent's detached-origin/main verification was invalid because the module never came from the worktree. Expected under ADR-0094, which accepts this skew as normal rather than a defect"},

  {slug = "build-site-fence-info-string-opens-a-comment", source = "auto-mechanical-chores-run-16", summary = "Closed 2026-08-29 by PR #1153. parse_changelog_releases now commits comment state only AFTER the fence-opener match, so a `<!--` in an opener's info string is sample text rather than a cross-line comment. Three mutation-verified cases, including one that is the sole catcher of the plausible wrong fix (suppressing comment state on any line containing a fence marker)"},

  {slug = "loop-cohort-resolve-spec-dir-confinement", source = "auto-mechanical-chores-run-16", summary = "Closed 2026-08-29 by PR #1156. loop-cohort's _resolve_spec_dir is now at parity with loop-engine's: reject `..`, resolve, read the repo root with the git relocation variables stripped, then relative_to(repo_root). The entry's named helper (append-knowledge.py's confine()) does not exist; parity was the fix. _get_repo_root stays duplicated because _loop_guards.py contracts that no public function spawns a process and assigns confinement to each caller's own resolver"},

  {slug = "lint-spec-status-git-unbounded", source = "auto-mechanical-chores-run-16", summary = "Closed 2026-08-29 by PR #1156. All five git calls carry timeout=GIT_TIMEOUT_S (20.0, the local-git figure loop-engine and loop-cohort already agree on) and each catches TimeoutExpired, degrading to that site's pre-existing fallback. A timed-out `git show` returns a typed sentinel rather than None, so it is not read as 'spec is new' -- the false-hard-violation mode base_ref_resolves' docstring already records"},

  {slug = "publish-control-evidence-max-age", source = "auto-mechanical-chores-run-16", summary = "Closed 2026-08-29 by PR #1162. observed_at is now bounded two-tier: warn past 30 days, hard-fail past 90. Two tiers rather than one because recapture needs a maintainer-only GitHub App key with no automated refresh, so a single 30-day hard bound would have reddened build-check and the publish workflow within two weeks. Non-ISO, naive and future-dated values are errors at any age"},

  {slug = "site-test-source-substring-assertions", source = "auto-mechanical-chores-run-16", summary = "Closed 2026-08-29 by PR #1163. pages.yml is parsed with PyYAML and asserted within jobs.build.steps with per-trigger path counts; the Astro surfaces use an anchored import pattern that resolves the import to the canonical file on disk. Measured old-vs-new on four mutations, including a real gate hole the old whole-file count could not see: a path duplicated under push and removed from pull_request"},

