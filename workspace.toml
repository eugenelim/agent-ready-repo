  #       step's `run:` body alongside its disposition, so any edit to the body
  #       invalidates the disposition and forces a re-read. Cheap to implement,
  #       but noisy: every whitespace change to a `run:` block demands a re-sign.
  #   (b) execute or fully parse each command. Correct and far too expensive.
  #   (c) accept it, which is today's position — the linter's § What it does not
  #       prove states it and the suite asserts it
