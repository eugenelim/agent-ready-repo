  # sites is sans, so adopting it would make one token carry two meanings),
  # 0.9375rem, and 1.0625rem. The gate is deliberately left RED on these rather
  # than forced green; 6 sibling findings that were unambiguous token
  # substitutions were fixed and verified computed-identical.
  # Unblocks when: someone decides whether the type scale gains an 11px step and
  # whether --ds-type-mono-sm may be used on a sans element.

  # MINOR x3, route-level, found in the 80-capture matrix.
  # (a) 7 of 22 /packs/* pages emit `...above.<a>Browse the catalogue</a>` with
  #     no space, so readers see "above.Browse". It is in the markup, not a wrap
