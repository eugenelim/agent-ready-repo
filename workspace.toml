  # Work-loop runtime: one transition, one Python process. `loop-engine.py
  # transition` shelled out to `loop-cohort.py` and `check-spec-status.py` for
  # its read-only guards, so a single transition started up to three extra
  # interpreters (measured 2026-08-17 over nine representative paths). The guard
  # decisions move to a shared, callable, silent, non-mutating sibling module
  # that the engine and the existing CLIs both call, so the two surfaces cannot
  # drift. Read-only guard surface only: no FSM, state-schema, or mutation-verb
  # change, and no MCP, daemon, or new dependency.

  # Project knowledge lifecycle roadmap — RFC-0077 / ADR-0081 / ADR-0082.
  # This sequence is adaptive: at each completed slice, compare measured behavior and
  # repository evidence with the remaining entries. Update, split, combine, reorder, or
  # retire later entries through normal review when their assumed shape has changed;
  # queue comments are a roadmap, while each approved spec is the implementation truth.

  # Slices 1 through 4 are shipped in the work list above. Their measured behavior is
  # the adaptive starting point for every remaining slice; do not preserve an
  # assumed integration shape when evidence supports splitting, combining,
  # reordering, or retiring it.

  # Slice 5 — engineering and operational integrations. Introduce explicit enquiry and
  # semantic-gate capture where demonstrated useful in work-loop execution, diagnosis,
  # contract acquisition, verification, and operational workflows. Route recurring
  # hard-to-discover paths toward scoped agent instructions and repeated verification gaps
  # toward normal work intake; never edit instructions or tooling automatically. Reassess
  # the skill set and split boundaries after Slice 4 rather than treating this list as fixed.
  {path = "docs/specs/project-knowledge-engineering-operational-integrations/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Integrate project knowledge with engineering and operational workflows", needs = [{type = "local", kind = "spec", path = "docs/specs/project-knowledge-research-integrations/spec.md"}]},

  # Slice 6 — portable-lifecycle adoption closeout. Audit the catalogue to document which
  # workflows should and should not integrate, evaluate capture precision, disposition
  # completeness, retrieval usefulness/abstention, privacy refusals, latency, corpus growth,
  # and instruction/tool-routing outcomes, then close residual docs and eval gaps. Its
  # evidence is the gate for retention, richer local indexes, any external capture backend,
  # and a separately governed multi-project bank. Reassess whether this remains one closeout
  # spec after Slice 5; it must not implement those conditional follow-ons itself.
  {path = "docs/specs/project-knowledge-adoption-closeout/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Evaluate and close out the portable project knowledge lifecycle", needs = [{type = "local", kind = "spec", path = "docs/specs/project-knowledge-engineering-operational-integrations/spec.md"}]},

  # Tech-site completion programme — approved 2026-08-17 from the canonical brief.
  # These entries are independently shippable. `needs` records only hard delivery
  # ordering; the brief retains the broader wave and evidence sequence.
  # CI throughput. Independent of the project-knowledge chain above — it touches
  # only .github/workflows/, the Makefile's gate_verdict banner, and docs/adr/.
  # The critical path is set by one serial job, so the fix is job layout, not
  # making any gate faster; the export-boundary gate's own cost is deferred.
  # Follow-on to the spec above, under the same ADR-0086 decision: move the 27s
  # credbroker suite out of gate-main into its own job. Deliberately the CHEAPEST
  # extraction that reaches the current ceiling (gate-sast, mean 160s) — extracting
  # more buys nothing until that job shrinks. The RFC-0082 carve-out step is an
  # explicit non-goal; its coupling graph defeated four revisions of the spec above.
]

