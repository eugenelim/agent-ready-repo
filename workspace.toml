  {slug = "credential-brokers-description-rewrite", source = "spec/pack-description-quality AC4"},
  # Codex renders skill descriptions into a ~2% context budget and truncates to
  # fit, warning "Skill descriptions were shortened to fit the 2% skills context
  # budget" (observed on Codex CLI 0.146.0). The catalogue ships 122 skills whose
  # descriptions total ~72,000 chars (~18k tokens), roughly 3x that budget, so the
  # longest descriptions — long precisely to drive activation — are cut hardest,
