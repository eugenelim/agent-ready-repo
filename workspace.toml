queue   = [
  # Project knowledge lifecycle roadmap — RFC-0077 / ADR-0081 / ADR-0082.
  # This sequence is adaptive: at each completed slice, compare measured behavior and
  # repository evidence with the remaining entries. Update, split, combine, reorder, or
  # retire later entries through normal review when their assumed shape has changed;
  # queue comments are a roadmap, while each approved spec is the implementation truth.

  # Slice 1 is shipped in the work list above. Its measured behavior is the adaptive
  # starting point for every remaining slice; do not preserve an assumed integration
  # shape when foundation evidence supports splitting, combining, reordering, or retiring it.

  # Slice 2 — authoring semantic-gate integrations. Add explicit scratch triage and shared
  # project-knowledge handoffs to brief, RFC, ADR, spec, and plan authoring workflows.
  # Normative decisions stay in their owning artifacts; only reusable supporting practice
  # residue is captured. Each workflow owns gate timing and free-form scratch, never locates
  # the private writer, and may distill only its capture receipts. Enquiry requires a
  # separately declared competency question/read boundary. Start by reassessing this and
  # every later slice against foundation evidence; reshape the roadmap before speccing if
  # the foundation changes the integration seam.
  {path = "docs/specs/project-knowledge-authoring-integrations/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Integrate project knowledge at authoring semantic gates", needs = [{type = "local", kind = "spec", path = "docs/specs/project-knowledge-foundation/spec.md"}]},

  # Slice 3 — review and research integrations. Extend the proven handoff to selected
  # architecture, adversarial, security, quality, and research workflows at stable meaning
  # boundaries. Capture conclusions and reusable method residue, never transcripts, raw
  # source corpora, or recalled secrets. Retrieval stays explicit, scoped to declared
  # competency questions, and cannot amplify authority. Reassess the catalogue selection,
  # gate timing, and whether review and research remain one spec after Slice 2 evidence.
  {path = "docs/specs/project-knowledge-review-research-integrations/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Integrate bounded project knowledge with review and research workflows", needs = [{type = "local", kind = "spec", path = "docs/specs/project-knowledge-authoring-integrations/spec.md"}]},

  # Slice 4 — engineering and operational integrations. Introduce explicit enquiry and
  # semantic-gate capture where demonstrated useful in work-loop execution, diagnosis,
  # contract acquisition, verification, and operational workflows. Route recurring
  # hard-to-discover paths toward scoped agent instructions and repeated verification gaps
  # toward normal work intake; never edit instructions or tooling automatically. Reassess
  # the skill set and split boundaries after Slice 3 rather than treating this list as fixed.
  {path = "docs/specs/project-knowledge-engineering-operational-integrations/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Integrate project knowledge with engineering and operational workflows", needs = [{type = "local", kind = "spec", path = "docs/specs/project-knowledge-review-research-integrations/spec.md"}]},

  # Slice 5 — portable-lifecycle adoption closeout. Audit the catalogue to document which
  # workflows should and should not integrate, evaluate capture precision, disposition
  # completeness, retrieval usefulness/abstention, privacy refusals, latency, corpus growth,
  # and instruction/tool-routing outcomes, then close residual docs and eval gaps. Its
  # evidence is the gate for retention, richer local indexes, any external capture backend,
  # and a separately governed multi-project bank. Reassess whether this remains one closeout
  # spec after Slice 4; it must not implement those conditional follow-ons itself.
  {path = "docs/specs/project-knowledge-adoption-closeout/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Evaluate and close out the portable project knowledge lifecycle", needs = [{type = "local", kind = "spec", path = "docs/specs/project-knowledge-engineering-operational-integrations/spec.md"}]},

  # P5 · Adopt — gated on adopter-persona research (evidence base)
  {path = "spec/m6-astro-project-index",         needs = "research:adopter-persona"},  # Astro site: PM-facing project index from docs/product/projects/
  {path = "spec/m6-enterprise-rollout-playbook", needs = "research:adopter-persona"},  # champion→CTO→platform→engineers; staged rollout + retro template
]

