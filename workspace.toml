  # was measured, not assumed: appending a `D=tools; N=x; python3 "$D/$N".py` line
  # to an already-dispositioned step leaves the gate green.
  # No per-step scheme closes it. The options, none cheap:
  #   (a) disposition per *command* rather than per step — a content hash of each
  #       step's `run:` body alongside its disposition, so any edit to the body
  #       invalidates the disposition and forces a re-read. Cheap to implement,
  #       but noisy: every whitespace change to a `run:` block demands a re-sign.
  #   (b) execute or fully parse each command. Correct and far too expensive.
  #   (c) accept it, which is today's position — the linter's § What it does not
  #       prove states it and the suite asserts it
  #       (`roster-residual-hidden-gate-in-known-step`).
  # Recommend (a) if this ever bites; the hash-per-step form is ~20 lines and the
  # noise is tolerable because `run:` bodies change rarely.
  # Unblocks when: picked up — no dependency.
  {slug = "ci-parity-hidden-gate-in-dispositioned-step", source = "spec/local-gate-ci-parity round-4 review"},

