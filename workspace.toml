  # own rationale and a second instance reading "buys the transition, not the
  # run" -- found by the adjudicator, which also confirmed the pre-existence
  # independently of a revision read, via the frozen Shipped
  # `work-loop-in-process-guards` contract that pins both `check_identity`'s
  # refusal on `schema_version != 1` and the `_run_id_preflight` call onto it.
  # Fix both or neither; one reworded and one left is how this class survives. Recorded rather than amended: the obligation is
  # met and a third amendment cycle to reword one explanatory clause would be
  # disproportionate. Correct the wording the next time the spec is legitimately
  # open. Do NOT close this by loosening the preflight, which the reviewer
  # proposed -- that widens what every transition accepts.
  # Unblocks now; no dependency.
  { path = "docs/specs/wave-complete-dispatch-receipts/spec.md", kind = "defect", source = { mode = "repo-origin", ref = "docs/specs/wave-complete-dispatch-receipts/notes/verification-ledger.md" }, summary = "Reword the unsupported-schema verdict row's rationale: it claims to preserve the wave-complete transition's verdict, but the run-id preflight refuses that state class before any event guard runs, so the row only ever decides the direct check invocation", needs = [] },

  # A wave exit that passes with no receipts container, or with every task
  # declined, leaves no record an after-the-fact reader can find: the read-only
  # guard cannot write, and a durable side effect on a transition is ADR-0061
  # Option B, which needs the absent pending_transition schema. loop-cohort
  # status also refuses when schema_version is unsupported, so for the oldest
  # state class the guard tolerates, only the stdout notice remains.
  # Unblocks now; no dependency.
  { path = "docs/adr/0061-loop-infrastructure-phase-1.md", kind = "defect", source = { mode = "repo-origin", ref = "docs/specs/wave-complete-dispatch-receipts/spec.md" }, summary = "Leave a durable trace when a wave exit passes with dispatch receipts unenforced or with every task declined, since both signals today are ephemeral and read by the party the guard constrains", needs = [] },
  # The repository work-graph family's eight registered Draft intents: five feature
  # children of docs/product/intents/CAP-0001-repository-work-graph.md, and three
  # sibling capabilities under docs/product/intents/STRAT-0001-graph-powered-sdlc.md.
  # Both parents are Accepted and deliberately unregistered, because backlog.open
  # admits only a Draft artifact and an Accepted intent is no longer open backlog
  # work; CAP-0001 also holds the family's surviving de-risk record. Each entry
