  # Substrate: Wave 4 delivers contracts/catalogue-index.schema.json and
  # `agentbundle catalogue index`. That index IS what a search verb reads.
  # Building search first means inventing a second index and then migrating off
  # it, so this cannot start earlier regardless of who wants it.
  # Scope: the LOCAL read surface only — query the neutral index that is already
  # on disk. Hosted search (a service, a remote indexer, a registry API) stays a
  # non-goal, per RFC-0031's non-goals and ini-007's own boundary. RFC-0031 named
  # the gap in its diagnosis ("nothing to search or browse by") but made no
  # decision, so nothing owns this today — which is why it is queued rather than
  # specced.
  # Open question for whoever picks it up: whether this lands as a new ini-007
  # wave or as an RFC-0031 follow-on. Decide that before writing the spec; it
  # changes whether the verb needs its own RFC.
  {path = "spec/catalogue-search-verb", needs = "work:spec/catalogue-wave4-semantic-contracts-index"},

  # Wave 5 — Release integrity. Gated on Wave 4.
  # Deliver: pack/profile content digests; same-version mutation refusal; human+JSON
  # release comparison; release evidence in catalogue-manifest.json; regression tests.
  {path = "spec/catalogue-wave5-release-integrity", needs = "work:spec/catalogue-wave4-semantic-contracts-index"},

  # Wave 6 — Index-backed technical catalogue reference. Gated on Wave 4 and
  # the current-route editorial/navigation foundation. The foundation already
  # delivers outcome/role routing and "Use" vs "Build" home paths without
  # changing the refreshed visual system. Do not repeat that work here.
  # Remaining deliverable: a top-level "Build a Catalogue" sidebar/reference
  # section; generated field references; neutral catalogue-index consumption;
  # and deep sidebar links verified against the generated inventory. No restyling.
  {path = "spec/catalogue-wave6-technical-docs-ia", needs = ["work:spec/catalogue-wave4-semantic-contracts-index", "work:spec/documentation-entry-navigation", "ini-002:work:spec/docs-site-design-refresh"]},

  # Wave 7 — Index-backed marketing evaluator surfaces. Gated on Wave 6.
  # The current-route foundation already delivers outcome/role discovery,
  # catalogue breadth, and the self-host story. Do not repeat those sections.
  # Remaining deliverable: /evaluate/; catalogue and pack pages consuming
  # neutral-index facts; and the optional-integration relationship view. No
  # visual system redesign.
  {path = "spec/catalogue-wave7-marketing-evaluator", needs = "work:spec/catalogue-wave6-technical-docs-ia"},

  # Wave 9 — First-party migration and closeout. Gated on Waves 2, 5, 7 and
  # the Wave 8 replacement.
  # Deliver: all packs+profiles migrated; drift fixes; strict-resolution policy;
  # complete site projection; old external catalogues verified valid; security+
  # quality reviews clean; workspace.toml closed out.
  {path = "spec/catalogue-wave9-migration-closeout", needs = ["work:spec/catalogue-wave2-pack-integrations", "work:spec/catalogue-wave5-release-integrity", "work:spec/catalogue-wave7-marketing-evaluator", "work:spec/documentation-entry-navigation"]},
]

# ─────────────────────────────────────────────────────────────────────────────
# ini-008 · Work Intake and Artifact Routing
# Authority: RFC-0083, ADR-0077, ADR-0078
# Cross-spec execution is intentionally serial. Parallelism belongs only inside
# each approved plan and is not represented as separate workspace entries.
# ────────────────────────────────────────────────────────────────────────────
["ini-008"]
name      = "Work Intake and Artifact Routing"
status    = "complete"
milestone = "Wave 7 · Migration and documentation (complete)"

["ini-008".work]
# Entries are canonical target records (RFC-0083 delivery groups). Each carries its
# own path, kind, source, summary and typed `needs`, so it is dispatchable without
# reading a neighbouring comment. Legacy `spec/<slug>` strings are NOT valid here:
# `workspace-routing-invariants` (Group 3, shipped) made canonical routing the
# enforced contract, and a legacy path yields `invalid_artifact_path` and refuses
# dispatch. Needs are typed objects — the canonical parser rejects bare strings.
shipped = [
  {path = "docs/specs/tracker-refresh-writeback/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Review tracker deltas and constrain lifecycle-aware write-back", needs = [{type = "local", kind = "spec", path = "docs/specs/normalized-intake-workspace-contracts/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/workspace-routing-invariants/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/work-intake-surface/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/tracker-intake-adapters/spec.md"}]},
  # Group 2 — transient normalized-intake contract + structured workspace entry
  # schema (provenance, authority, summary, dependencies, lifecycle, validation).
  {path = "docs/specs/normalized-intake-workspace-contracts/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Normalize intake and workspace contracts", needs = []},
  # Group 3 — parsing, reconciliation, status and dispatch enforce the target
  # rules: a missing spec or plan fails closed; comments cannot change routing.
  {path = "docs/specs/workspace-routing-invariants/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Make lifecycle, reconciliation, and dispatch routing deterministic", needs = [{type = "local", kind = "spec", path = "docs/specs/normalized-intake-workspace-contracts/spec.md"}]},
  # Group 4 — standalone work-intake front door and compatibility alias.
  {path = "docs/specs/work-intake-surface/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Provide one core entry point for work intake and routing", needs = [{type = "local", kind = "spec", path = "docs/specs/normalized-intake-workspace-contracts/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/workspace-routing-invariants/spec.md"}]},
  # Group 5 — Jira, Jira Align, Linear and GitHub adapters converge on the shared
  # contract. Acquisition and normalization stay adapter-specific.
  {path = "docs/specs/tracker-intake-adapters/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Normalize tracker work through shared intake contracts", needs = [{type = "local", kind = "spec", path = "docs/specs/normalized-intake-workspace-contracts/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/work-intake-surface/spec.md"}]},
  # Group 7 — reconcile legacy workspaces, publish the alias window and removal
  # criteria, finish cross-links, run the full evaluation matrix.
  {path = "docs/specs/work-intake-migration-docs/spec.md", kind = "spec", source = {mode = "repo-origin"}, summary = "Migrate legacy entries and document intake compatibility", needs = [{type = "local", kind = "spec", path = "docs/specs/normalized-intake-workspace-contracts/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/workspace-routing-invariants/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/work-intake-surface/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/tracker-intake-adapters/spec.md"}, {type = "local", kind = "spec", path = "docs/specs/tracker-refresh-writeback/spec.md"}]},
  # RFC-0096 Wave 1 — shared read-only semantic-surface resolution.
  {path = "docs/specs/semantic-surface-resolver/spec.md", kind = "spec", source = {mode = "repo-origin", ref = "docs/rfc/0096-portable-delivery-artifact-lifecycle.md", revision = "6e984d67b583b36798efddbb2717ce5784572a49"}, summary = "Resolve semantic roles to repository-owned or external destinations without lifecycle changes", needs = []},
]
active = []
queue = [
  # Group 6 — origin-aware refresh, conflict resolution, execution locks and
