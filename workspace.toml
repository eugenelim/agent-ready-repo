  # Semgrep's signal for a target it could not parse depends on HOW it failed.
  # A PARTIAL failure (unbalanced bracket, stray token) does surface as a
  # path-attributed PartialParsing entry in `errors`, and --strict escalates it
  # to exit 3 -- gateable today. A whole-file or whole-construct failure
  # (`def broken(:`, `3 = x`) yields empty `errors`, empty `skipped`, empty
  # stderr and exit 0 even under --strict -- not gateable. Both were probed
  # directly; an earlier revision of this entry claimed no signal existed at all,
  # generalising from the whole-file shape, and security review corrected it.
  # PRE-EXISTING: the per-target version of the self-test read only paths.scanned
  # and results, so it had the identical hole.
  # ADR-0084 is the precedent -- it promoted a scanner diagnostic that does not
  # move its own exit code into a gate signal, for bandit, and names this very
  # self-test as one of the two it modelled itself on. So adopting --strict here
  # is an ADR-shaped decision, not a detail.
  # Fix: add --strict to the invocation and fail any target appearing in
  # payload["errors"] as a named FAIL (measured free -- the real five-target run
  # exits 0 with empty errors under --strict today). Then close the whole-file
  # residue independently: compile each ratcheted target with ast.parse before
  # trusting its silence. Cheap and offline. Re-probe on a semgrep major bump
  # (pinned semgrep>=1.174,<2 since 2026-08-25; was >=1.166,<2 when this was written).
  {slug = "sast-semgrep-unparseable-target-reads-clean", summary = "A whole-file parse failure is reported as scanned with zero findings and no signal even under --strict, so a ratcheted script that stops parsing reads as clean; partial failures ARE gateable via --strict and are not yet gated", source = "spec/semgrep-selftest-batching security review"},
