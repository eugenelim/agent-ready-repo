  {slug = "direct-lifecycle-uninstall-skill", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "RFC-0098 D4/D6 mandate uninstall --skill <name> for a direct row, routed to the pack-keyed file-ownership removal path and mutually exclusive with --pack. The CLI has no --skill and requires --pack, so that form does not exist; removal works only via uninstall --pack <identity> --yes. No removed criterion carried this. It also owns the removal completeness direct-skill-lifecycle F8 measures: a file a later revision drops stays on disk unowned, and ownership-keyed removal alone cannot reach it.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {path = "docs/product/intents/direct-skill-lifecycle.md", kind = "intent", source = {mode = "repo-origin", ref = "docs/specs/direct-skill-repository-installation/spec.md"}, summary = "Keep a directly installed skill current, and know what changed before it lands", needs = []},
  {slug = "direct-lifecycle-capability-inspection", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Re-read what an installed direct skill declares: allowed-tools, metadata.boundaries, metadata.credentialed, the SKILL.md digest, and every payload digest, per skill. Probed 2026-09-01: show, list-installed --format json, and the state file each carry none of them, so an adopter who consented at install has no route back to what they agreed to. The show contract sets additionalProperties false over a closed key set docs/specs/okf-catalogue-discovery owns, so that spec needs amending alongside.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-receipts", needs = "work:spec/direct-skill-lifecycle", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Receipts for direct commands report kind, name, source, resolved revision, digest, scope, adapter, and the matching update and uninstall commands. Delivered for install and shipped, but its criterion (AC22) left the direct-skill-repository-installation final list, so the guarantee is unowned; the upgrade route this narrowing builds adds a second receipt surface.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-cli-grammar-stability", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Install, validate, and list-installed grammar clauses that left with AC7 and AC9: list-installed adds no new flag and --no-check, --offline, and --check-drift keep their meanings; a catalogue row whose drift was never computed renders an em dash rather than a 0; and the exit-2 set for bare upgrade, bare primitive upgrade, bare uninstall, bare install, conflicting pack/profile, pack/profile with a direct source, and upgrade --pack P --scope local. AC7/AC9 at c794be99c are the authority.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-display", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Manifestless list-installed rows: KIND column, INSTALLED/LATEST as an em dash, numeric DRIFT, the JSON schema-version increment, --updates-only exclusion, and the sentinel reaching no surface. Also AC22's shipped guarantees: no outbound request, STATUS always unknown, no ahead state, no source-digest comparison in footprint drift. AC22 at c794be99c is the authority; it and AC26 stayed on direct-skill-repository-installation's final list, the narrowed follow-on owning identity and upgrade only.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-local-scope", needs = "work:spec/direct-skill-lifecycle", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Local scope across the direct lifecycle: projection, .agentbundle-local-state.toml, the git exclude, the tracked-path refusal, and rollback. RFC-0098 D6 admits it for standalone skill upgrade while the shipped route refuses --scope local; the parent spec withdrew its AC24 local-scope clause as unsatisfiable.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-normalization-fixtures", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Hand-authored canonical-equivalent and expected-normalized fixtures for every direct shape and sub-form, including the collection category level whose flattening to skills/<leaf>/ is the behaviour parity exists to pin, AC24's rule that no canonical, direct, or expected-normalized fixture is generated with code under test, and the assertion the fixtures feed: repo and user projections and per-file plans are byte-identical through both renderers. AC24 at c794be99c is the authority.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-author-documentation", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "The author-facing documentation RFC-0098 D8 names: the skill-repository format reference with its stable raw schema URL, the make-a-skill-repository-installable how-to, install-routes and reference page updates, docs-site navigation, the --help surfaces install, validate, upgrade, uninstall, and list-installed, and a local-path-only coding-agent prompt. Left the final list with AC23.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  {slug = "direct-lifecycle-capability-reconsent", needs = "work:spec/direct-skill-lifecycle", source = "direct-skill-lifecycle spec narrowing (2026-09-01)", summary = "Capability re-consent on upgrade: the difference rendering including old/new digest, revision, added and removed skill names, the full payload delta, and executable-mode omission for old data; the refusal axes, --accept-new-capabilities bound to the recomputed digest, unknown drift refusing even with the flag, and upgrade --all applying it to every row before any write. Left the final list with AC30 and AC9.", intent = "docs/product/intents/direct-skill-lifecycle.md"},
  # NOT migrated to a `path` entry, and not an oversight: AC16 of the Shipped
  # spec/agent-skill-engineering-consumer-integrations is discharged by this
  # exact `slug`/`source` pair, and tests/roster's
  # test_ac16_provider_absence_follow_on_is_registered pins it. Repointing the
  # record at an intent document would orphan a ticked AC on a frozen spec.
  # The three sibling controls from that security review closed 2026-09-08; see
  # docs/specs/agent-skill-engineering-consumer-integrations/notes/consumer-security-review-closures.md.
  # RFC-0097:189's behavioural half -- "tested without this pack installed" --
  # is not discharged by the consumer-integrations slice. For a prose consumer
  # there is no runtime to exercise, and verify_catalogue over a provider-less
  # catalogue runs a strict subset of the provider-present checks. RFC-0097:575
  # offers a cheaper mode than an executable harness -- a fixture versioned with
  # its expected result before the implementation runs, judged by an independent
  # reviewer -- which that slice did not evaluate.
  {slug = "agent-skill-engineering-provider-absence-behaviour", source = "docs/specs/agent-skill-engineering-consumer-integrations/spec.md#follow-ons", summary = "Discharge the behavioural half of the provider-absence obligation: evaluate a pre-registered fixture-and-expected-result mode, judged by an independent reviewer, against an executable absence harness"},
  # Product-strategy parent of the three capability briefs below it, framed
  # 2026-09-02. Re-gates them: the policy validator is the activation
  # measurement's compliance test, so enforcement precedes measurement.
  # Load-bearing unknown: no host is known to admit a blocking hook verdict.
  {path = "docs/product/intents/cross-adapter-behavior-enforcement.md", kind = "intent", source = {mode = "repo-origin"}, summary = "Make a published behavior control run regardless of model or host by putting it on the pre-execution path rather than in prose: a structured policy primitive an adopter can extend, a blocking control whose per-host contract is established first, and a multi-adapter runner so a non-Claude model can be measured at all", needs = []},
  {path = "docs/specs/cooling-scope-closure/notes/review-findings.md", kind = "defect", source = {mode = "repo-origin"}, summary = "Two of nine adjudicated findings on the withdrawn cooling-scope-closure amendment remain open; the file records each closure with its evidence. Open: a plan whose Done-when requires editing a hash-frozen plan.md, which nothing detects at approval time; and AC31 being unable to fail when the release surfaces agree at a version whose published code differs from what ships. Both need an owner decision rather than a repair", needs = []},
  {path = "docs/specs/dependency-scoped-completion-receipts/notes/follow-ons.md", kind = "defect", source = {mode = "repo-origin"}, summary = "Two of three RFC-0096 receipt follow-ons stay open. Entry-removal precondition: reassigned to rfc0096-wave7c-pruning -- stranding harm refuted by measurement, but nothing makes the file and entry removals atomic and a record field cannot supply that. Cooled cross-repo deferral slug: still Wave 7b's. Reclassified schema gap: closed by docs/specs/reclassified-lifecycle-result/. Both settled in rfc0096-wave7c-lifecycle-record-decisions.md; the linked notes file is frozen, so status lives here", needs = []},
  {path = "docs/specs/loop-cohort-state-lock/notes/reclaim-residual.md", kind = "defect", source = {mode = "repo-origin"}, summary = "A state-lock reclaim's identity check and its rename are two operations, so a holder acquiring between them is displaced and reports StateLockLost having done nothing wrong. Not closable by checking harder -- POSIX has no rename-if-unchanged. Atomic takeover is disproved and recorded: rename replaces unconditionally, so every contender with the same stale snapshot wins in turn, measured at three to five holders. The note carries the forced-interleaving reproduction", needs = []},
  {path = "docs/specs/reclassified-lifecycle-result/notes/follow-ons.md", kind = "defect", source = {mode = "repo-origin", ref = "docs/rfc/0096-portable-delivery-artifact-lifecycle.md"}, summary = "Two RFC-0096 Wave 7c follow-ons. (1) rfc0096-wave7c-pruning: a pruning session must prove its own precondition -- an artifact's file and its workspace entry must be removed together -- and nothing makes the two removals atomic. (2) Moving AC23-pinned files falsifies cooling-scope-closure's AC23 TITLE and its Durable Outputs line \"neither may change\"; the AC body still holds, so the repair is a retitle. Caused by this delivery and Wave 7b; its owner restates it. RFC-0096:380 names the slice", needs = []},
  {path = "docs/specs/cooling-brief-child-scope-closure/notes/follow-ons.md", kind = "defect", source = {mode = "repo-origin", ref = "docs/rfc/0096-portable-delivery-artifact-lifecycle.md"}, summary = "Three open RFC-0096 Wave 7b follow-ons. A declared-empty source.parent on a cooled entry is trusted not verified, needing a closeout-time writer in close-work. Two test names AC17 pins now contradict their bodies; the repair is a rename plus an amendment. An interrupted run of the shared-test dedup guard strands collectable test files in the repository root, which gitignore hides but does not prevent. A fourth entry, the pack-script citation conflict, is closed", needs = []},
