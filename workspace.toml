["ini-002".shaping_queue]
active  = []
backlog = [
  # RFC-0088 · consumer-shaped design questions raised by reading round 11's
  # amended requirements against a real adopter pack in a separate catalogue
  # (read-only context; this repo writes nothing to it).
  # Shape: how should a broker accommodate a consumer that must replay a scoped API
  # token? The RFC's credential posture assumes the session stays in the browser;
  # a realistic consumer intercepts a scoped token and replays it. RFC open
  # question 5 carried the recommended candidate (keep the token page-resident). ANSWERED:
  # round 12 showed it holds only when the issuing response is `no-store`, and round 14
  # measured a real destination that sends no cache directive AND persists the token to
  # page-readable storage, so the token reaches disk regardless. Question 5 was RULED on
  # 2026-08-22 -- the pattern is supported and the exposure is DECLARED per destination.
  # What remains for this shaping item is narrower than when it was written: not whether to
  # accommodate replay, but what the declaration looks like in the broker contract. The
  # obligation is already carried into Spec 1's contract list, so this item shapes the
  # wording, not the decision.
  {slug = "rfc0088-token-replay-consumer-contract", type = "shape"},
  # Shape: destination-scoped constraint as a single axis. Decision C constrains egress by
  # destination; worker policy needed the same scoping because real surfaces have opposite
  # needs. PARTLY ANSWERED: question 4 was ruled on 2026-08-21 -- worker policy is decided by
  # destination GROUP, realised as a separate browser context, and the session-wide reading is
  # withdrawn. So the axis exists, but its unit is the group, not the destination, because
  # contexts isolate sessions and destinations sharing a sign-in must share a context.
  # What this item still shapes: whether egress and worker policy should collapse onto that one
  # group axis together, and what else belongs on it. Note the two constraints do not obviously
  # share a unit -- egress can scope per destination, worker policy cannot.
  {slug = "rfc0088-destination-scoped-policy-axis", type = "shape"},
  # Signal items — hand-authored by strategist; ongoing, non-graduating
  {slug = "ai-native-regulatory-watch", type = "signal"},
  # Research items — any user with the desk-research pack can pick these up
  # Research (RFC-0064 M3 AC): should rfc-candidates.md graduate into the
  # shaping_queue (as research/strategy entries) rather than remain a separate
  # findings register? Assess the whole intake taxonomy — findings registers
  # (rfc-candidates, roadmap-intents) vs the new repo-level [backlog] vs the
  # shaping_queue. Owner intuition: rfc-candidates are "things we should work
  # through" and belong in shaping. Deliverable: a recommendation (keep separate
  # / fold / hybrid) feeding a possible RFC-0064 follow-on. Requires desk-research.
  {slug = "intake-taxonomy-rfc-candidates-to-shaping", type = "research"},
  # Shaping items — PE picks up when upstream research is done
  "ini-002-initiative-brief",
  {slug = "opp-assessment-pe-pack",  needs = "work:spec/m2-frame-situation"},
  {slug = "capability-map-ini-002",  needs = "work:spec/m2-map-capabilities"},
  # Post-pilot rollout shaping — RFC-0064 Amendment #4 cross-pack overlay.
  # Deliverable after shaping: one appetite-bounded formal brief whose independently
  # shippable slices cover the remaining ratified Level B packs (beyond the three
  # pilots). Each pack slice includes its guide, surface evidence, safety boundary,
  # recovery, eval, and only necessary skill change. Must audit P2/P3/P4 guides and
  # existing tutorials before proposing work. Blocked until all three pilot work
  # items complete (evidence base for shaping).
  {slug = "nontechnical-pack-first-value-rollout", type = "shape", needs = ["work:spec/portfolio-first-run-pilot-architect", "work:spec/portfolio-first-run-pilot-figma", "work:spec/portfolio-first-run-pilot-governance-extras"]},
  # Portfolio outcome entry-surfaces — design (RFC-0064 Amendment #4). Deliverable
  # after shaping: a surface/flow brief for homepage, catalogue, pack pages, READMEs,
  # journeys, and docs routing that consumes the contract and routes by plain-language
  # outcome. Explicitly excludes site-social-proof-band, site-mobile-responsiveness,
  # site-design-system-spec, and P5's Astro project index; reference those owners.
  # Blocked until the contract is ratified and all three pilots complete.
  {slug = "portfolio-outcome-entry-surfaces", type = "design", needs = ["work:spec/portfolio-pack-first-value-contract", "work:spec/portfolio-first-run-pilot-architect", "work:spec/portfolio-first-run-pilot-figma", "work:spec/portfolio-first-run-pilot-governance-extras"]},

  # Project knowledge measured-scale follow-on. Slice 1 deliberately retains closed
  # classification/month journals unchanged; deleting individual observations would
  # break the append-only evidence model and Git would retain the history anyway.
  # Shape a whole-partition retention/compaction policy only after the adoption
  # closeout measures repository growth and confirms that every capture in an eligible
  # partition has one terminal disposition. Affected surface: docs/knowledge/
  # observation journals, project-knowledge --distill, and its lifecycle contracts.
  {slug = "project-knowledge-observation-retention-policy", type = "shape", needs = "work:docs/specs/project-knowledge-adoption-closeout/spec.md"},
  # Project knowledge measured-scale follow-on. The committed body-free topic map and
  # bounded lexical routing are the portable baseline; richer indexes add invalidation,
  # privacy, and platform costs without current evidence. Shape derived local indexing
  # only if adoption-closeout measurements show corpus size or enquiry latency exceeds
  # published budgets. Any index must be rebuildable, disposable, gitignored, and never
  # authoritative or committed. Affected surface: project-knowledge --enquire and local
  # cache/index tooling; no database or embedding dependency is presumed.
  {slug = "project-knowledge-derived-index-scaling", type = "shape", needs = "work:docs/specs/project-knowledge-adoption-closeout/spec.md"},
  # Optional durability follow-on, not part of the portable core. Repo journals cannot
  # save pre-gate scratch or an uncommitted capture when a worktree is discarded, but
  # core cannot assume a writable user directory or service. After adoption-closeout
  # measures material loss and identifies a supported storage capability, shape a
  # separate RFC governing project identity, privacy, deletion, availability, and
  # reconciliation with the repository journal. No implicit probing or fallback store.
  {slug = "project-knowledge-external-capture-backend", type = "shape", needs = "work:docs/specs/project-knowledge-adoption-closeout/spec.md"},
  # Eventual cross-project capability requiring its own RFC and governance. Only
  # reviewed, sanitized topics may be explicitly exported; observations and scratch
  # never cross the boundary. The receiving project must treat imported material as
  # untrusted evidence and adopt it through its own distillation boundary. Shape only
  # after the portable lifecycle's adoption closeout supplies real tenancy, audience,
  # privacy, ownership, and deletion requirements; do not assume an external backend.
  {slug = "multi-project-knowledge-bank", type = "shape", needs = "work:docs/specs/project-knowledge-adoption-closeout/spec.md"},
]

