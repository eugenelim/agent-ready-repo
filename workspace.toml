  # AC3 of spec/ci-gate-parallelization makes the aggregator job wear the sole
  # required status check. `pull_request` evaluates build-check.yml AND its posture
  # test (tools/test-build-check-workflow.py) from the PR's own ref, so a single
  # coordinated PR that edits the workflow's needs:, the aggregator's env: block,
  # its != "success" comparisons, and the posture test together can present a green
  # required check with gates that did not run. Recorded as CLOSABLE, not inherent —
  # writing "inherent" into an ADR's accepted consequences is how a fixable gap
  # becomes permanent. Two mechanisms bound it, neither in that spec's scope
  # (branch-protection changes are a stated non-goal there): a repository ruleset
  # requiring workflows resolved from a PINNED ref, so a PR cannot define the check
  # that gates it; and a CODEOWNERS entry for .github/workflows/** plus the posture
  # test, making the bypass need a second human. This repo has no CODEOWNERS today.
