  # (c) /journeys/* at 320 wraps the hero meta line after a plain-text
  #     separator, leaving it dangling. Channel 1 only.
  # Unblocks when: ready now.

  # HAZARD, NOT A TASK. web/AGENTS.md now sits EXACTLY on its 80-line cap. The
  # next line added there fails tools/lint-agents-md.py. Anyone documenting the
  # next dependency or command in that file must remove a line to add one.

  # A GATE THAT NEVER FIRES. `npm run lint:css --prefix web` (stylelint with
  # stylelint-declaration-strict-value, added 2026-09-18) is wired into NOTHING
  # — not the Makefile, not any workflow. It works, it is mutation-proven, and
  # it currently reports 11 real findings; it will never run in CI, so those
  # findings cannot red a pull request and new hardcoded values cannot either.
  # Deliberately NOT wired at merge time: adding a line to the Makefile's
  # `run-test-suite` define obliges a SUITE_DISPOSITION entry in
  # tools/lint-ci-parity.py naming the PR check that gates the suite, and the
  # honest answer is probably NO_PR_GATE or PR_GATED_IF — `make test` runs via
