  # Found 2026-09-15 by the quality-engineer pass on the unknown-dependency
  # refusal (core 2.26.8). Four functions in `loop-cohort.py` run the same
  # `TASK_HEADING_RE.finditer` / `matches[i+1].start()` / `DEPENDS_LINE_RE.search`
  # section-boundary walk: `detect_unknown_deps` (new in 2.26.8), `parse_plan`,
  # `_task_sections`, and `parse_touches_by_task`. Three predate that change.
  # The narrow risk, confirmed by adjudication: the heading and depends-line
  # grammars are already single-homed as module constants, so a grammar change
  # cannot desynchronise the copies -- what can drift is the two-line boundary
  # idiom itself. That matters because the refusal's whole point is that it
  # agrees with the graph `parse_plan` builds; if the two ever disagree about
  # which task owns a `Depends on:` line, the scheduler refuses a plan it would
  # then schedule differently. NOT folded into 2.26.8: the repair edits three
  # pre-existing functions, which the root AGENTS.md "Cut before adding" and
  # "keep unrelated discoveries out of the current change" rules place outside
  # that change's accepted scope, and the extraction shape is not determined.
  # Found 2026-09-17 by the agreement property written to close the
  # boundary-walk consolidation above (core 2.26.11). Not a regression from that
  # change: the property was run against all 423 `docs/specs/*/plan.md` files
  # and the before/after comparison on the same corpus showed zero behavioural
  # differences, so this predates the consolidation and the consolidation simply
  # made it visible. `parse_plan` keys its dependency map by task ID, so when a
  # plan heads two sections with the same ID the later section overwrites the
  # earlier one's edges. In `local-gate-ci-parity/plan.md` a `## T6 evidence
  # (observed output)` section collides with `### T6`, which declares
  # `T1, T2, T3`; T6 therefore schedules with no dependencies at all, in wave 0
  # beside the T1 and T2 it needs and ahead of T3. Two of 423 plans carry a
  # duplicate heading (`local-gate-ci-parity` T6, `sequential-implementer-dispatch`
  # T0). Nothing refuses it on a fresh `schedule`: `_task_sections` does raise
  # `duplicate task section`, but only `validate_completed_task_sections` calls
  # it and that returns early unless the run already carries completed-task
  # pins, so the refusal exists and is unreachable in the case that needs it.
  # Today's behaviour is pinned by
  # `test_duplicate_task_heading_drops_the_earlier_sections_edges`, so a change
  # is deliberate rather than silent. NOT folded into the consolidation: adding
  # a refusal widens a published guard's refusal set, which is a behaviour
  # change owing its own specification and acceptance criterion, and the root
  # AGENTS.md rule on keeping unrelated discoveries out of the current change
  # places it outside a consolidation chore. Unblocks now; no dependency.
  { path = "packs/core/.apm/skills/work-loop/scripts/loop-cohort.py", kind = "defect", source = { mode = "repo-origin", ref = "docs/specs/loop-cohort-unknown-dependency-refusal/spec.md" }, summary = "Refuse or disambiguate a duplicate plan task heading: parse_plan keys deps by task ID so a second section with the same ID silently drops the first section's declared edges and the task schedules as if it depended on nothing, and the duplicate-section refusal that would catch it is only reachable once completed-task pins exist", needs = [] },
  # The 22-of-67 convention-obligation cost measured by the review-economics
  # spike has no owner. Of 67 findings sustained across its six paired cases, 22
  # were unmet repository obligations rather than defects in the logic the change
  # set out to alter, split 11 baseline / 11 candidate: projection drift (8,
  # affecting five of six cases), a register or backlog record left contradicting
  # the tree (7), an unpaired version bump and changelog entry (3), an unrecorded
  # sealed-plan or frozen-spec deviation (2), the eval-harness obligation (1),
  # and a control that cannot fail (1). The even split is what makes it
  # actionable: the cost is symmetric across both review policies, so no change
  # to review scheduling removes it -- the implementer not knowing the rule
  # produces it, and both arms then pay the same repair cost. The strongest form
  # is that the repairs themselves breached the same rules: C3's baseline repair
  # introduced projection drift while fixing projection drift.
  #
  # Two candidate remedies, and they are NOT equally available right now.
  # (a) Inline the touched-path obligations into the implementer brief, the way
  # the orchestrator already inlines security-checklists for security-reviewer
  # and operational-safety for quality-engineer. The spike names this as a
  # sibling intent under work-loop-delivery-efficiency. Do not open it yet: that
  # parent records an owner priority decision of 2026-09-10 ranking the
  # deterministic repair provability audit ahead of any further review-policy or
  # repair-packet reshaping, after all three of its children were killed on
  # safety clauses. Read that audit's own Status line in
  # docs/product/research/repair-provability-audit-design.md before acting on
  # this ranking -- it is not restated here, because a copy reads as current
  # once the audit moves and nothing re-checks it.
  # (b) Deterministic pre-review checks -- the other half of the spike's own
  # next-step column. Whether the ranking covers (b) is NOT settled by the
  # decision: it names "review-policy or repair-packet reshaping" and draws no
  # carve-out, and a check that suppresses findings before dispatch is arguably
  # review-policy reshaping. The reading that (b) sits outside it, because it
  # changes neither review scope nor repair inputs, is this entry's author's,
  # not the owner's -- which is part of what the owner is being asked to
  # decide. Every class listed above is mechanically checkable and nothing
  # gates a change on them before a reviewer is dispatched.
  #
  # Measured 2026-09-17 while landing core 2.26.12, as one worked example of
  # (b). A twenty-line check comparing every docs/knowledge topic's recorded
  # source digest against the file's live bytes reports 35 of 69 pinned
  # sources stale and one pointing at docs/CONVENTIONS.md, deleted by #1345.
  # The knowledge store validates a digest's shape rather than its currency,
  # so its 212-case suite is green over all of them, and an enquiry returns
  # those topics as fresh. That is the register-contradicting-the-tree class,
  # it is mechanically checkable, and nothing runs the check -- which is the
  # whole shape of (b). This session hit the same defect twice from the
  # inside: a topic promoted in one commit was made false by the next, and
  # the retirement that repaired it recorded digests taken before three
  # further repairs landed. Not repaired here: 35 stale pins across 24 topics
  # is its own change, and deciding whether the fix is a gate, a refresh, or
  # a weaker freshness contract belongs with (b).
  #
  # Next step: run (b) on its own, or hold both until the provability audit
  # reports and then choose between them. Deciding this needs the owner, because
  # (a) is ranked and (b) is not. Evidence:
  # docs/product/research/work-loop-review-economics-spike.md (the class table
  # and the 11/11 split), docs/product/intents/work-loop-delivery-efficiency.md
  # (the priority decision and the three killed children), and the distilled
  # topic deterministic-repository-obligations-are-not-review-work.
  #
  { slug = "convention-obligation-cost-has-no-owner", source = "knowledge-distill/2026-09-17", summary = "22 of 67 sustained findings in the review-economics spike were unmet repository obligations, split 11/11 across both review arms, and no intent owns that cost; the implementer-brief remedy is ranked behind the repair provability audit while the deterministic pre-review-check half is unranked, and choosing between them needs the owner" },

  # The knowledge base's freshness contract pins bytes, and the pins do not
  # hold. Measured 2026-09-17 over docs/knowledge: of 98 topics, 63 pin no
  # source digest at all, 35 pin one, and 24 of those 35 are stale -- a 69%
  # failure rate among the topics that use the mechanism. One pin names
  # docs/CONVENTIONS.md, deleted by #1345. The store validates a digest's
  # shape rather than its currency (knowledge_store.py `_validate_source`), so
  # the 212-case project-knowledge suite is green over every one of them and
  # enquiry returns the stale topics as fresh.
  #
  # 35 stale pins is not 35 wrong lessons. Dispositioned into four classes:
  #
  # A. No action -- 6 pins across 3 retired topics. Their freshness.state is
  #    already `retired` so enquiry excludes them; the digest is a historical
  #    anchor, which is what it should be.
  # B. Drop the dead source -- 1 pin. The `docs/CONVENTIONS.md` supporting
  #    source on a-pack-version-bump-is-three-files-build-self-syncs-none-of-them.
  #    That topic's OWNING source is already packs/AGENTS.md, which is where
  #    #1345 re-homed the version-bump rule, so the dead path carries nothing.
  #    Mechanical and unambiguous.
  # C. Drop the pin, do not refresh it -- ~27 pins across 16 topics whose
  #    lesson is about how Python, git, semgrep or a review technique behaves,
  #    not about a defect living in those bytes. Four were read in full to
  #    confirm the classification: semgrep-strict (semgrep's per-file budget),
  #    batching-n-subprocess-calls (`git check-ignore --stdin` exiting 128),
  #    a-negative-path-assertion and a-case-count-is-not-coverage (both pure
  #    test-design principles). Refreshing these re-stales immediately --
  #    loop-engine.py grew 15,910 bytes and workspace.toml 18,735 -- and the
  #    pin was never load-bearing for the claim.
  # D. Re-verify before deciding -- 5 topics asserting something about THIS
  #    repository's current behaviour, where drift is a real prompt to
  #    re-check: build-site-rewrites-an-unresolvable-in-tree-link (does it
  #    still rewrite to a blob URL outside the audit's scope), 
  #    a-safety-cap-enforced-only-by-shell-punctuation (is the cap still
  #    punctuation-only), loop-cohort-schedule-parses-task-headings-by-pattern,
  #    a-document-wide-href-scan-cannot-prove-a-link-sits-in-a-starlight-section,
  #    and a-pack-version-bump-is-three-files. These are the only ones where
  #    staleness might mean the knowledge base is wrong rather than unpinned.
  #
  # Recommended contract change: record the revision a lesson was learned at
  # rather than a byte digest. It ages gracefully, still answers "what has
  # moved since", and does not fail on an unrelated edit to a large file. Two
  # alternatives, both weaker: durable lessons carry no pin at all (matches the
  # 63 that already do, but loses the re-check signal), or keep byte pins and
  # add a currency gate -- which is actively harmful, because the pinned set
  # includes Makefile, workspace.toml and work-loop/SKILL.md, so the gate would
  # fire on most pull requests.
  #
  # Owner disposition 2026-09-17: B drop, C drop the pin, D re-verify.
  # Executed: B is done -- no topic references the deleted path any more. D's
  # five claims were all re-verified against live code: D1 (build-site blob
  # rewrite) and D4 (Starlight wrapper walk) still hold verbatim; D3's parser
  # and pinning order hold but it quoted a paraphrase of the refusal rather
  # than the emitted string and the pattern has gained an optional letter
  # suffix; D5's eight-pack list is still exact but its denominator drifted
  # 22 -> 24 and it cited the deleted docs/CONVENTIONS.md; D2's instance is
  # REPAIRED -- loop-cohort.py now carries the retry cap in the verb and its
  # comment records the `&&` history -- while its audit question generalises.
  # D2, D3 and D5 were rewritten accordingly. Two Class C topics whose only
  # stale pin was a supporting one had it dropped.
  #
  # BLOCKED, and this is the finding: the sanctioned write path cannot drop an
  # owning pin. `validate_topic` accepts `owning_source: null` and 63 topics
  # carry it, but `_validate_mutation_proposal` and `complete_mutation_proposal`
  # both call `_validate_source(..., digest_required=True)`, so every proposal
  # must name an owning source WITH a digest. Verified by executing both routes
  # against a real topic: `owning_source: null` and omitting the key are each
  # refused `strict_parse`. The store can therefore represent a state its only
  # sanctioned writer cannot produce, and the 63 topics in that state are all
  # legacy imports that never went through the writer.
  #
  # A second consequence follows from the same constraint: any mutation
  # refreshes the owning digest as a side effect, so on a topic whose owning
  # AND supporting pins are both stale, dropping the supporting pin silently
  # refreshes the owning one -- the opposite of the disposition. That is why
  # only the two topics with an already-exact owning pin were touched.
  #
  # Remaining: 28 stale pins across 19 topics -- 3 retired (Class A, correctly
  # no action) and 16 active, every one carrying a stale OWNING pin. All 16 are
  # blocked until the writer can express a null owning source. That change is
  # two small edits mirroring validate_topic's own `is not None` guard, plus
  # tests, on a published skill's public seam -- so it is its own change with
  # its own review, not a ride-along here.
  { slug = "knowledge-freshness-pins-bytes-and-the-pins-do-not-hold", source = "knowledge-distill/2026-09-17", summary = "Of 98 knowledge topics, 35 pin a source byte digest and 24 of those are stale, one naming a file deleted by #1345, while the store validates digest shape rather than currency so no gate reds and enquiry returns them as fresh; dispositioned into no-action, drop-dead-source, drop-the-pin and re-verify classes, with a revision-based pin recommended over a byte digest" },

  # Found 2026-09-17 by the pre-EXECUTE review of
  # docs/specs/wave-complete-dispatch-receipts. The entries below are limits
  # that spec discloses and deliberately does not close, each recorded there
  # under Follow-ons with the reasoning. They are registered here so the spec's
  # references resolve to real entries rather than to an intention. A fourth
  # limit -- the uncoupled `wave advance` -- was folded into the spec instead
  # and sits in `closed`.
  #
  # gates-failed, findings-remain and blocker-applied all re-enter
  # CODE-IMPLEMENTATION without moving current_wave_index, so the first pass's
  # records satisfy every later exit for that wave -- and a repair round is
  # where the controller most often works alone. Not closed in the receipts
  # spec because scoping a record to a round needs a counter advancing on all
  # three edges, and implementation_retry_count advances on one, so building on
  # it would look like a control without being one. Unblocks now; no dependency.
  { path = "packs/core/.apm/skills/work-loop/scripts/_loop_guards.py", kind = "defect", source = { mode = "repo-origin", ref = "docs/specs/wave-complete-dispatch-receipts/spec.md" }, summary = "Require a repair round to carry its own dispatch assertion: three transition edges re-enter code implementation without moving the wave pointer, so a wave's exit is discharged a second time by the first pass's records", needs = [] },

  # Found 2026-09-18 by the post-gates security review of
  # docs/specs/wave-complete-dispatch-receipts. The wave-exit guard reads
  # `state.json` while the engine holds only `engine-state.json.lock`, and
  # `loop-cohort wave advance` mutates `current_wave_index` while holding
  # `state.json.lock`. The two locks are distinct files, so nothing serialises
  # the guard's read against a cohort mutation. In a two-wave run a
  # `wave-complete` whose guard approved accounted wave 0 can commit
  # CODE-VERIFICATION after a concurrent advance moved the pointer to
  # unaccounted wave 1, and `gates-clean` then sees wave 1 as final -- so wave 1
  # exits with no record, using only sanctioned verbs and no `state.json` write.
  # This is introduced by the receipts change: before it the guard was a stub
  # with no accounting to race. It is NOT one of the four off-switches the spec
  # discloses, all of which need a direct state write. Not closed in this
  # delivery because a guard verdict that must stay valid until another layer
  # commits is an atomicity property, which ADR-0061 assigns to Option B and its
  # absent `pending_transition` schema; the reviewer's remedy -- the engine
  # taking the cohort lock across its transition -- crosses the ownership split
  # that ADR draws and would need its own design and deadlock analysis.
  #
  # Adjudicated 2026-09-18 by finding-adjudicator: sustained at ADVISORY tier,
  # and the author's deferral held. Two facts from that adjudication bound this
  # entry. It needs two concurrent processes on one spec directory and is NOT
  # reachable from the sequential single-controller flow -- `_statelock.py`'s own
  # docstring names concurrent verbs on one spec directory as the class the lock
  # exists to close, and this is that shape across two lock domains. And the
  # reviewer's prescribed remedy is NOT SAFE as written: holding the cohort lock
  # across the engine's whole transition commit nests a two-lock hold spanning
  # the FSM lookup, plan-hash pre-guard, event guard and outbox finalisation,
  # which `_statelock.py:88-93` requires be provably inside
  # `timeout < maximum hold < stale_after`, and it asserts a fixed lock order
  # without establishing no other site takes the pair in the opposite order. Do
  # not adopt it; it trades a narrow window for an unanalysed deadlock and
  # lock-expiry surface.
  #
  # Required outcome: a `wave-complete` verdict about wave `n` cannot discharge a
  # commit once cohort state no longer names wave `n`. Constraints: no engine
  # write to cohort state (ADR-0061 D3); no `pending_transition`, idempotency key
  # or crash-safe replay (the spec's Never do); any added lock hold provably
  # inside `_statelock`'s budget with a globally fixed acquisition order; and a
  # regression test that forces the interleaving. At least four defensible
  # mechanisms exist -- engine-held cohort lock, post-guard re-validation under
  # the cohort lock, a pointer-generation compare-and-swap token, or disclosure
  # as a fifth Boundaries residual -- and nothing external chooses among them,
  # which is why the tier is advisory rather than blocker.
  # Unblocks now; no dependency.
  { path = "packs/core/.apm/skills/work-loop/scripts/loop-engine.py", kind = "defect", source = { mode = "repo-origin", ref = "docs/specs/wave-complete-dispatch-receipts/spec.md" }, summary = "Serialise the wave-exit verdict against the cohort mutation that can invalidate it: the guard reads state.json under the engine lock while wave advance moves current_wave_index under the cohort lock, so a concurrent advance lets a wave exit with no dispatch receipt through sanctioned verbs alone", needs = [] },

  # Found 2026-09-18 by the post-gates adversarial review of the same spec. The
  # unsupported-schema verdict row is worded as preserving the `wave-complete`
  # transition's verdict for that state class. It does not, and cannot:
  # `_run_id_preflight` runs on every transition and its identity guard refuses
