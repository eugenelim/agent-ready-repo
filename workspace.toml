  # cannot change") -- yet every adapter PR amends it: each one's Constrained-by
  # says "Amends docs/specs/distribution-adapters/spec.md (v0.N -> v0.N+1
  # Changelog entry)", and its per-adapter projection table has demonstrably been
  # edited since it shipped (its Copilot skill cell moved from
  # .github/instructions/ to .github/skills/ long after ship). So the repo treats
  # it as Living while its Status says Frozen.
  # spec/frozen-doc-supersession-annotations annotated it under the frozen rule
  # rather than reopening this, and said so in its Honest scope.
  # This is the same shape as frozen-spec-supersession Decision 2, which resolved
  # the identical ambiguity for plan.md by scoping the licence to a phase. Decide
