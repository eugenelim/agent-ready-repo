  # `tools/lint-catalogue-curation-guard.py`'s path-gate layer exits 0 with only a
  # stderr note when git or the `--base` ref is unavailable. It is now wired into
  # the local `build-check` chain, so that silent skip is the same class of defect
  # spec/local-gate-ci-parity fixed for SKIP_SAST: a run that gated nothing reads
  # identically to a run that gated everything, and the new terminal verdict
  # banner says "complete" either way.
  # Two directions, and the second is worse than the first:
  #   (a) absent base — the path-gate does not run at all. The presence and
  #       dup-sync layers still do, so the miss is partial.
  #   (b) STALE base — a FALSE PASS, not merely a widening. `git diff
  #       {base}...HEAD` widens to the older merge-base, and because the
  #       exemption is changeset-scoped (`has_exemption` reads the whole
  #       `git log {base}..HEAD` message blob), an already-merged commit
  #       carrying `Engine-Change-RFC:` inside that widened range exempts the
  #       CURRENT changeset. Untrailered engine change: green locally, red in
  #       CI — exactly the divergence this spec exists to end.
  # CI is unaffected: build-check.yml uses fetch-depth: 0 and an explicit
  # `--base origin/main`, so both directions are local-only today.
  # Fix: scope `has_exemption` to commits reachable only from HEAD (closes (b)),
  #   and have the guard report base absence/staleness loudly — deciding whether
  #   the local invocation fails closed while CI's stays fail-open. Touches a gate
  #   CI shares, so it is a deliberate CI-behaviour change, not a ride-along.
  # Unblocks when: picked up — no dependency.
  {slug = "curation-guard-silent-base-skip", source = "spec/local-gate-ci-parity review"},

