  # owner decision rather than an open item.
  # Unblocks when: n/a — reopen only if the owner revisits the docs palette.

  # ---------------------------------------------------------------------------
  # Found BY the closing verification pass, 2026-09-18. These are not retrofit
  # regressions — they are defects the newly-exercised states and the new CSS
  # gate revealed. Every one is a design or copy decision, which is why the
  # verification pass recorded them rather than resolving them.
  # ---------------------------------------------------------------------------

  # MAJOR ON PAPER, INVISIBLE ON SCREEN. There is no print stylesheet anywhere
  # in web/ — zero `@media print`, zero `@page`. Printed at A4 the home page is
  # 9 sheets and: the dark footer is 0.82 of a sheet in solid ink, and with
  # background graphics off (the print dialog's default) it near-vanishes at
  # 1.42:1 brand-on-white; 64 links print with no `attr(href)` exposure, so a
  # printed page loses every destination; the nav prints as a hamburger because
  # A4 at 717px is below the 768 breakpoint; the copy button prints; 3 of the 4
  # install variants are display:none on paper; and 7 of 8 page breaks cut
  # through a block, splitting the adapter table mid-row and orphaning a heading
  # from its body. Nothing here is caught by any screen gate.
  # Unblocks when: ready now.

  # MINOR. 0 of 28 interactive classes distinguish `:active` from `:hover`, so a
  # press produces no feedback distinct from a pointer resting. All 28 do have a
  # focus style, and all 12 hover changes are colour-only with nothing disclosed
  # on hover alone — so this is a polish gap, not an accessibility one.
  # Unblocks when: ready now.

  # MINOR, NEEDS A SCALE DECISION. 11 off-scale font sizes survive the new
  # stylelint gate, all in src/pages/direction-preview.astro: 11px x5 (no token
