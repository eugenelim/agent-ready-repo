  # ---------------------------------------------------------------------------
  # Tech-site design review 2026-08-14 — deferred findings + implementation
  # surfacings.
  #
  # Source: an in-session design review of both site surfaces (`web/` marketing
  # at `/`, `docs-site/` Starlight docs at `/docs/`) rendered at 1440x900 and
  # 360/375/390/414 phone widths in light and dark, benchmarked against an
  # external reference docs site (supplied in-session; deliberately not named
  # in-tree). The review produced 2 blockers, 7 majors, 8 minors. The mechanical
  # subset shipped as spec/tech-site-polish-batch; these are the rest, plus
  # three items that only surfaced while implementing it.
  #
  # The completed wayfinding cluster has left this open queue. The remaining
  # entries are deferred review findings, implementation surfacings, and design
  # work that must be shaped before specification.
  # ---------------------------------------------------------------------------

  # 142 of 189 guides carry no frontmatter at all, so they have no `summary:`
  # and therefore no page-specific meta description — Starlight falls back to
  # the site-level description on every one of them, which means no distinct
  # social-preview text, no search-engine snippet, and no Pagefind result
  # snippet. spec/tech-site-polish-batch built the plumbing (build-site.py maps
  # `summary:` -> Starlight `description`, and the PageTitle override renders it
  # as a visible deck), and 47 guides already benefit; this item is the content
  # backfill for the remaining 142. Deliberately NOT auto-generated from first
  # paragraphs — that was declined during the batch because it would ship 142
  # unreviewed strings into meta tags and social previews. Each needs a human
  # one-liner. Consider batching by pack. Files: guides/**/*.md frontmatter.
  # Unblocks when: ready now.
  # Merged 2026-08-17 into spec/guide-metadata-completion.

  # The marketing site and the docs site are two visually disconnected products.
  # At /docs/ the Starlight chrome replaces everything: the header loses the
  # marketing nav (leaving title + search + GitHub icon) and the footer loses
  # every link. The reference keeps one header and one footer across both
  # surfaces, so a docs reader is one click from every top-level destination.
  # Also: the marketing nav renders "Docs ↗" with an external-link arrow and a
  # dimmer colour than its siblings, which reads as leaving the product. Fix:
  # a shared header band and shared footer across both surfaces; drop the ↗ and
  # match sibling colour. HAZARD: docs-site/AGENTS.md explicitly forbids aligning
  # docs colour to web/'s amber system without a new spec, and the two palettes
  # are deliberately separate (see spec/docs-site-design-refresh). Shared chrome
  # must either stay palette-neutral or amend that rule through an RFC — do not
  # quietly work around it.
  # Unblocks when: ready now, but confirm the palette question first.
  # Merged 2026-08-17 into spec/site-shared-chrome after RFC-0089 and ADR-0085.

  # tools/lint-guide-titles.py (added by spec/tech-site-polish-batch) found 9
  # guides whose frontmatter title and body H1 disagreed. The H1s were
  # RECONCILED to match `title:` — not deleted. Deletion was considered and
  # rejected: guides/_shared/** ships verbatim into adopter catalogues and
  # bundles where frontmatter never renders, so a deleted H1 leaves those files
  # opening with no heading at all. Reconciling means the frontmatter title is
  # what publishes, and in most cases that is the WEAKER of the two strings:
  # "Scaffold a Component" beat "Tutorial: Scaffold a component from a screen
  # brief"; "Run an Audit" beat "How-to: Run a frontend-engineering audit";
  # "Frontend Engineering Pack" beat "`frontend-engineering` — the skills and
  # the reviewer"; "IaC (Terraform) guides" beat "`iac-terraform` — guides".
  # Two of the nine went the other way (the longer string won). No content is
  # lost — the old H1s are in git history at the batch's commit.
  # Fix: pick the better wording for those 9 and put it in `title:`. Files: the
  # 9 guides listed in that commit. Watch: guide-nav-baseline.toml resolves
  # sidebar labels from a frozen baseline before falling back to the page title,
  # so a title change may not move the sidebar label — check both.
  # Unblocks when: ready now.
  # Merged 2026-08-17 into spec/guide-title-clarity.

  # Test coverage landed for tools/lint-guide-titles.py and build-site.py's
  # leading_h1 / _strip_leading_h1 / _strip_guide_metadata transforms
  # (tools/test_lint_guide_titles.py, 33 assertions, wired into the docs
  # workflow). What is still uncovered: the rehype table-wrapper in
  # docs-site/src/plugins/rehype-scrollable-tables.ts has no unit test — its
  # only coverage is the built-output assertion in
  # web/src/test/rendered-output.test.ts, which proves the emitted HTML but not
  # the hast-level edge cases (already-wrapped table, table inside an aside or
  # blockquote, root-level table). A unit test needs a test runner in
  # docs-site/, which is a new dependency and therefore an AGENTS.md
  # dependency-table entry — hence deferred rather than bundled.
  # Unblocks when: ready now; decide whether docs-site earns a test runner.
  # Merged 2026-08-17 into spec/docs-site-build-contract-hardening.

  # Docs pages carry a large number of interactive elements under the WCAG 2.2
  # 24x24 target-size minimum — 40-47 on the docs landing, 12-26 on content
  # pages at 360-414px. Many are inline links in prose (exempt under the
  # inline-in-text carve-out) and several are Starlight-owned (`.sl-anchor-link`
  # heading anchors measure 24x35). Needs a design pass to separate the genuine
  # failures from the exempt and the framework-owned before any fix is specced —
  # which is why this is shaping, not build. Note the marketing surface was
  # already fixed in spec/tech-site-polish-batch (drawer links went from 17px to
  # 44px full-width rows).
  # Unblocks when: ready now.
  # Merged 2026-08-17 into spec/site-browser-quality-gate; the canonical audit
  # scaffold is that spec's notes/docs-tap-target-audit.md.

  # There is no docs/design/principles/ artefact for either site surface, so the
  # in-session design review could trace none of its findings to a project
  # principle — every finding had to map to the accessibility quality floor, a
  # recognized usability heuristic, or a genre rubric, and pure aesthetic calls
  # had to be quarantined as unarbitrable "director's notes". Without this, taste
  # arguments about the two surfaces have no arbiter and every future review
  # re-litigates them. Known open questions it should settle: whether the two
  # palettes stay deliberately divergent (amber/dark-hero marketing vs cobalt/
  # cool-neutral docs — currently mandated by docs-site/AGENTS.md); whether the
  # docs surface should use display serif at H1/H2 scale at all; and whether the
  # product wants an illustrative register (it currently has none).
  # Unblocks when: ready now.
  # Closed 2026-08-17 to docs/design/principles/tech-site.md.
  {path = "docs/product/intents/selftest-untracked-plant-window.md", kind = "intent", source = {mode = "repo-origin", ref = "docs/specs/lint-performance-p0/spec.md", revision = "sha256-bytes-v1:9bf95e7308260b96ba5456eb61aab8d5ab45b9fe32091c3092571ef02c724a0e"}, summary = "Remove the live-worktree plant window without losing end-to-end catalogue boundary proof", needs = []},

