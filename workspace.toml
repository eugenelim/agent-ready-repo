  # ---------------------------------------------------------------------------
  # Tech-site design review 2026-08-14 — deferred findings + implementation
  # surfacings.
  #
  # Source: an in-session design review of both site surfaces (`web/` marketing
  # at `/`, `docs-site/` Starlight docs at `/docs/`) rendered at 1440x900 and
  # 360/375/390/414 phone widths in light and dark, benchmarked against an
  # external reference docs site (supplied in-session; deliberately not named
  # in-tree). The review produced 2 blockers, 7 majors, 8 minors. The mechanical
  # subset shipped as spec/tech-site-polish-batch; these are the rest, plus
  # three items that only surfaced while implementing it.
  #
  # The completed wayfinding cluster has left this open queue. The remaining
  # entries are deferred review findings, implementation surfacings, and design
  # work that must be shaped before specification.
  # ---------------------------------------------------------------------------

  # 142 of 189 guides carry no frontmatter at all, so they have no `summary:`
  # and therefore no page-specific meta description — Starlight falls back to
  # the site-level description on every one of them, which means no distinct
  # social-preview text, no search-engine snippet, and no Pagefind result
  # snippet. spec/tech-site-polish-batch built the plumbing (build-site.py maps
  # `summary:` -> Starlight `description`, and the PageTitle override renders it
  # as a visible deck), and 47 guides already benefit; this item is the content
  # backfill for the remaining 142. Deliberately NOT auto-generated from first
  # paragraphs — that was declined during the batch because it would ship 142
  # unreviewed strings into meta tags and social previews. Each needs a human
  # one-liner. Consider batching by pack. Files: guides/**/*.md frontmatter.
  # Unblocks when: ready now.
  # Merged 2026-08-17 into spec/guide-metadata-completion.

  # The marketing site and the docs site are two visually disconnected products.
  # At /docs/ the Starlight chrome replaces everything: the header loses the
  # marketing nav (leaving title + search + GitHub icon) and the footer loses
  # every link. The reference keeps one header and one footer across both
  # surfaces, so a docs reader is one click from every top-level destination.
  # Also: the marketing nav renders "Docs ↗" with an external-link arrow and a
  # dimmer colour than its siblings, which reads as leaving the product. Fix:
  # a shared header band and shared footer across both surfaces; drop the ↗ and
  # match sibling colour. HAZARD: docs-site/AGENTS.md explicitly forbids aligning
  # docs colour to web/'s amber system without a new spec, and the two palettes
  # are deliberately separate (see spec/docs-site-design-refresh). Shared chrome
  # must either stay palette-neutral or amend that rule through an RFC — do not
  # quietly work around it.
  # Unblocks when: ready now, but confirm the palette question first.
  # Merged 2026-08-17 into spec/site-shared-chrome after RFC-0089 and ADR-0085.
  # STALE 2026-09-18 — the HAZARD above was accurate when written and no longer
  # is, on both halves. (1) The rule it cites is gone: docs-site/AGENTS.md
  # carried "Styling: the docs palette deliberately diverges from `web/`" with
  # `do not "align" docs colors to web/'s amber system without a...` from commit
  # 8238167a2 until db5a4ed08 ("simplify every AGENTS.md surface into a map")
  # removed it. That file now holds no palette, colour or token rule, so there
  # is no rule left to amend through an RFC. (2) web/ no longer has an amber
  # system to align to — it moved to the register palette per
  # docs/design/direction/tech-site-amendment-palette.md. The two palettes are
  # still deliberately separate and docs-site/ is confirmed out of scope by the
  # owner, so the boundary the HAZARD protected still stands; only its stated
  # mechanism and its named colour are stale. Verified with `git log -S` against
  # the file rather than inherited. This entry is closed, so the correction is a
  # note rather than a rewrite — and it exists because this comment was cited as
  # live authority in a design document before anyone re-read the file.

  # ---------------------------------------------------------------------------
  # Marketing-home editorial retrofit 2026-09-18 — deferred findings.
  #
  # Source: the paper-first editorial retrofit of web/ (direction
  # docs/design/direction/marketing-site.md; evidence manifest
  # docs/design/evidence/marketing-home-retrofit.md). Everything below was found
  # with evidence attached and deliberately NOT fixed in that change. The
  # manifest is the record; these are the items that outlived it.
  # ---------------------------------------------------------------------------

  # RESOLVED 2026-09-18. /catalogue/ was built out of cards — .outcome-card,
  # .role-grid and .cat-card carried a tinted fill, a border and a radius,
  # against a direction sheet whose Containment row reads "rules divide and
  # rank; no cards, no tinted panels, no shadows, no overlap". (This entry
  # said .role-card. No such class ever existed on the route: `git log -S` over
  # catalogue/index.astro returns no commit for it. The name came from a
  # transcription slip in the manifest this entry was written from, which
  # recorded .role-grid as .role-card. Corrected in place.) This was the
  # THIRD instance of one settled decision: the same contradiction was
  # adjudicated and repaired on the homepage outcome band and again on /now/.
  # Rated Major not Blocker because nothing was clipped and axe was clean at
  # both widths; Major not Minor because it was the whole route's primary
  # treatment. The fix was the one named here — three card grids converted to
  # ruled record lists reusing the PackCatalogue.astro and WhatYouInstall.astro
  # pattern — and it took the separate review this entry said it would earn.
  # Evidence: docs/design/evidence/catalogue-records-retrofit.md. Kept as a
  # closed note rather than deleted, so the third-instance count stays legible
  # if the same contradiction appears a fourth time.

  # MODERATE. /now/ renders 122 unpaginated releases and is tens of viewport
  # heights long. Information architecture, not styling: no pagination, no
  # in-page contents, no return-to-top. The retrofit made the page lighter per
  # release and therefore longer, so this got worse, not better.
  # THE LENGTH FIGURE IS CONTESTED AND NEITHER IS CARRIED FORWARD. Two passes
  # measured it and disagree: 61,638 CSS px / 402 KB at 390, and 75,240 CSS px /
  # 160 KB at 320. Different viewport widths explain part of the height gap but
  # not a 2.5x swing in transferred bytes, so at least one measurement is wrong
  # about what it measured. Re-measure before quoting either; do not reconcile
  # them by averaging or by preferring the later one.
  # Unblocks when: ready now; decide pagination vs. progressive disclosure first.

  # BLOCKED ON INSTRUMENT. The <ul role="list"> Safari/VoiceOver workaround is
  # justified by documented behaviour and has never been verified in Safari.
  # Playwright 1.63 removed page.accessibility, and ariaSnapshot is Playwright's
  # own DOM computation — it returns the same answer in every engine, so it
  # cannot see the difference this workaround exists for. WebKit-via-Playwright
  # is NOT Safari for this purpose. Needs real Safari with VoiceOver, which is a
  # manual check on a physical machine.
  # Unblocks when: someone runs it on a Mac with VoiceOver.

  # DEFERRED, TRIGGERED. Core Web Vitals are unmeasured. No field data exists
  # and localhost timings are not a CWV measurement, so the manifest reports
  # payload and request counts instead and says LCP/INP/CLS are unmeasured.
  # Unblocks when: 28 days of field data after the retrofit deploys.

  # OPEN. JSON-LD covers the homepage only (SoftwareApplication). /packs/* and
  # /journeys/* are 44 further pages wanting per-page types — SoftwareApplication
  # and HowTo respectively. Template-level work with its own schema decisions;
  # scoped out of the retrofit deliberately rather than half-done.
  # Unblocks when: ready now.

  # OPEN, OWNER-ROUTED. The evidence manifest's two production fields record a
  # handoff, not a review: security/privacy to security-reviewer and
  # reliability/recovery to quality-engineer. The surface takes no user input,
  # stores nothing and makes no third-party calls, so both are expected to close
  # quickly — but neither has been performed, and the manifest says so rather
  # than implying coverage.
  # Unblocks when: the two reviewers are run.

  # RECORDED EXCEPTION, NOT A DEFECT. The frontend-engineering multi-surface
  # shell contract requires every surface of a product to draw from one token
  # contract. docs-site/ is owner-scoped-out (decision 2026-09-18) and keeps its
  # cobalt palette while web/ is now paper-first editorial. The two are one nav
  # click apart via the Docs entry, so every "consistent across the product"
  # claim dies at that click, and each independent change to either side widens
  # the gap with nothing detecting it. Logged so the divergence is visible to
