# When the unblock condition is another tracked item (a hard AND dependency), also
# add a `needs` edge — not prose alone. Disjunctive/untracked/external unblocks stay prose.
# Distinct from [ini-NNN.shaping_queue].backlog (per-initiative non-active tier).
[backlog]
open = [
  {path = "docs/product/intents/architect-design-conditional-overlays.md", kind = "intent", source = {mode = "repo-origin", ref = "docs/adr/0118-architect-design-scope-routed-model-first-templates.md", revision = "c4b2f5912bad080f095ffb32d354b54c31d6c54f"}, summary = "Route the system-shape and workload-class lenses a design turns on, and show a layered subsystem's internal boundaries when the boundary is the decision", needs = [{type = "local", kind = "intent", path = "docs/product/intents/architect-design-gate-calibration.md"}]},
  # Discovered while shaping docs/specs/conventions-retirement. The core pack's
  # seeds impose obligations and links that only other packs -- or no pack --
  # can satisfy, and core declares no dependency on any of them. Verified
  # 2026-09-14: seeded `docs/CHARTER.md` orders an RFC for charter revisions and
  # seeded `docs/product/roadmap.md` orders one for substantive roadmap changes,
  # while `docs/rfc/` is seeded by governance-extras and appears in no core
  # install path. Seeded `docs/architecture/README.md` and
  # `docs/product/README.md` link to `./adr/`, `./rfc/` and `./guides/`;
  # governance-extras seeds the first two as auto-generated indexes and no pack
  # seeds the third, nor `docs/GOVERNANCE.md`, `docs/product/personas.md` or
  # `docs/product/release-checklist.md`. An adopter installing core alone
  # receives a charter mandating a process it cannot learn and READMEs pointing
  # at directories it never gets. The fix is to uncouple: core states only what
  # it installs, and a pack that owns a process carries its own mandate. Owner
  # declined to absorb this into the retirement spec so that change stays scoped
  # to the document it retires; the retirement instead narrows its scaffold-link
  # criteria to the links it touches, which leaves these untouched and visible.
  {slug = "core-seeds-mandate-other-packs-content", source = "spec/conventions-retirement (round-5 adopter-boundary review)"},
  {slug = "pre-existing-local-ci-shared-test-dedup-drift", source = "pre-flight/2026-09-16"},  # 2 cases in tools/test_local_ci_shared_test_deduplication.py fail on a clean tree: test_real_make_root_tool_groups_match_the_approved_profiles (4 errors - standalone/composed process-count and membership drift; needs a decision on which of FIRST_TOOL_BATCH / RETAINED_TOOL_SINGLETONS / FINAL_TOOL_BATCH owns the two pytest commands 2b1574e19 added) and test_effective_make_recipes_apply_exact_composition_and_fail_on_mutation (APPROVED_STANDALONE_PLAN_DIGEST / APPROVED_COMPOSED_PLAN_DIGEST; the 133 reported items are a printout of the computed plan, not 133 defects). Both trace to 2b1574e19 adding packages/jsonl-otlp-exporter to the Makefile. The third case, the sast-unleased byte pin, was re-pinned 2026-09-16. Proven pre-existing by differential: they fail with this branch's new tools/ files removed, and the Makefile is unmodified in the diff. NOTE: this file is in make test (Makefile:643), so make test is red on main until these land.
  # The sender cannot explain its own effective configuration. `resolve_telemetry`
  # returns a merged mapping, so once resolution SUCCEEDS nothing records which
  # scope supplied an admitted value, whether either file existed at all, or which
  # value was overridden. The refusal messages name their scope; the success path
  # names nothing. So when telemetry stops, or goes somewhere unexpected, an
  # adopter has no way to ask the command what it resolved -- they must reason
  # about two files and four sources by hand. Found by the quality review of
  # docs/specs/telemetry-sender-owns-its-configuration. Not built there: a
  # diagnostic mode is new public CLI surface on a published capability, which that
  # change deliberately declined to add (a `--print-settings` flag was considered
  # and dropped at planning for the same reason). Nothing is blocked. Fix: return
  # structured resolution provenance and expose it through a non-sending
  # `--explain-config`, which needs its own criteria for what it may print --
  # an endpoint can carry user-info that the existing diagnostics redact.
  { slug = "sender-cannot-explain-its-effective-configuration", source = "pre-flight/2026-09-16" },
  # Three documentation-versus-code defects around the governance index, all found
  # while measuring whether an ADR `Area` field would duplicate the index's `domains:`
  # key. (1) `packs/governance-extras/.apm/skills/new-adr/references/infra-decisions.md:4-5`
  # claims its seven infra-mode topics "correspond to" the `generate-iac` governance-index
  # domains; the manifest carries eight. The seven/eight split is deliberate -- seven
  # authoring topics, eight index domains, both shipped in 8d6688d36 -- so the fix is the
  # correspondence sentence, not either list. (2) The manifest says `generate-iac` "reads
  # this manifest at Stage 0 and adds any missing domain rows"; it does not. That skill
  # only bootstraps the whole file when no index exists, and never names the eight domains.
  # The same unimplemented claim is repeated in `guides/governance-extras/how-to/
  # governance-index.md` and in accepted RFC-0065, so nothing in the repository ever writes
  # a domain row. Fix is to delete the claim or implement it -- an owner call, because
  # RFC-0065 is accepted and the manifest is adopter-owned. (3) `reconcile-iac`'s
  # resource-type-to-domain map covers six of the eight domains, so `remediation` and
  # `observability` can never be resolved, and it emits a seventh token `policy` that is
  # not a domain at all; the skill labels the map "heuristic". Nothing is blocked: the
