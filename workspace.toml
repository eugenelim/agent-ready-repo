  # DECISION, recorded so it is not re-proposed: a GitHub merge queue was evaluated
  # as the fix for branch protection's strict:true rebase-and-rerun thrash and was
  # REJECTED. Two reasons, in order. (1) It does not address the complaint that
  # motivated spec/ci-gate-parallelization — a merge queue leaves per-PR feedback
  # latency exactly as it is; only job parallelism reduces the wait between pushing
  # and seeing green. These are separate problems and conflating them cost a round of
  # bad advice. (2) Requiring a queue makes GitHub's direct merge API
  # (PUT /repos/{owner}/{repo}/pulls/{n}/merge) fail, so tool harnesses with a
  # raise-PR / merge button break rather than degrade; integrating means moving them
  # to the enqueuePullRequest GraphQL mutation. If that integration cost is ever paid,
  # the setup is: add a `merge_group:` trigger to build-check.yml (without it the
  # queue never sees a green required check and every PR is ejected on timeout), set
  # strict=false since the queue supersedes it, and set the queue's status-check
  # timeout well above the slowest required check.
  {slug = "merge-queue-rejected-tooling-integration", source = "spec/ci-gate-parallelization Objective"},
  # project-knowledge --capture TIMES OUT on this repo, and reports the timeout as a
  # capacity/request problem. Reproduced: a well-formed 2.5KB observation (well under
  # the 16KB capture_event_bytes budget) takes 33.4s against script_seconds=30 and
  # returns {"reason_code":"journal_capacity","recovery_action":"fix_request",
  # "retryable":false}. Both fields are wrong and actively misleading: nothing about
  # the request needs fixing, it is not a capacity breach, and a deadline breach IS
  # retryable. The refusal comes from _remaining_timeout() in knowledge_store.py,
  # which reuses the journal_capacity code for an elapsed deadline. Git is not the
  # cause — `git ls-files` and `git status` are ~0.2-0.4s here, and the process burns
  # only ~2.4s of system time across 33s wall, so it is waiting on something.
  # Consequence: the work-loop's Capture learnings gate cannot complete on this repo,
  # so lessons are silently not captured by anyone who does not read the exit code.
  # To close: (1) give a deadline breach its own reason_code with retryable=true and a
  # recovery_action that is not fix_request; (2) find what consumes the 30s (suspect a
  # lock acquire or a filesystem walk, not git) and either speed it up or raise
  # script_seconds for capture.
  {slug = "project-knowledge-capture-times-out", source = "spec/ci-gate-parallelization Capture learnings"},

