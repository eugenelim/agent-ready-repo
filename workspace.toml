# Current declared intent. Structured fields are authoritative; durable rationale
# belongs in the cited artifact or Git history. Comments state only current facts
# that the schema cannot express.
#
# HOW TO WRITE AN ENTRY -- read this before adding one.
#
# Target entries are inline tables with exactly:
#   path, kind, source, summary, needs
#
# Example:
#   { path = "docs/specs/<slug>/spec.md", kind = "spec", source = { mode = "repo-origin" }, summary = "Example spec", needs = [] }
#
# DO NOT INFER THE SHAPE FROM NEIGHBOURING ENTRIES. Most records in this file
# are legacy compatibility forms -- bare "spec/<slug>" strings and {slug = ...}
# tables. They are retained deliberately, they reconcile as `unsupported_legacy`
# or `legacy_entry`, and they are never dispatchable. Copying one writes a
# non-dispatchable record. `workspace-status` reports every such record; run it
# after editing this file.
#
# `[backlog].open` takes the canonical shape like every other collection.
# `lint-spec-status.py` invariant (iv) resolves a spec's `(deferred: <slug>)`
# anchor from either shape -- a legacy record's `slug`, or a canonical record's
# `path` via `canonical_entry_anchor` -- so a deferring spec is not obliged to
# write a legacy record. This comment previously claimed the `slug` key was
# still required; that stopped being true when canonical anchoring shipped.
#
# A canonical entry's `path` must name an artifact that exists, or it reconciles
# as `missing_artifact`. For a deferral with no artifact of its own, point the
# entry at the document that records it.
#
# Comments, summaries, list order, tracker labels, and profile hints are
# non-semantic. They must not determine routing, dependency satisfaction,
# processor selection, or dispatch.
#
# Paths are repository-relative POSIX paths. Consumers must reject absolute
# paths, backslashes, ".." segments, and any symlink-resolved target outside the
# repository root.

