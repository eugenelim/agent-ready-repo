  # (tools/test_lint_guide_titles.py, 33 assertions, wired into the docs
  # workflow). What is still uncovered: the rehype table-wrapper in
  # docs-site/src/plugins/rehype-scrollable-tables.ts has no unit test — its
  # only coverage is the built-output assertion in
  # web/src/test/rendered-output.test.ts, which proves the emitted HTML but not
  # the hast-level edge cases (already-wrapped table, table inside an aside or
  # blockquote, root-level table). A unit test needs a test runner in
  # docs-site/, which is a new dependency and therefore an AGENTS.md
  # dependency-table entry — hence deferred rather than bundled.
  # Unblocks when: ready now; decide whether docs-site earns a test runner.
  { slug = "rehype-plugin-unit-tests" },

  # Docs pages carry a large number of interactive elements under the WCAG 2.2
  # 24x24 target-size minimum — 40-47 on the docs landing, 12-26 on content
  # pages at 360-414px. Many are inline links in prose (exempt under the
  # inline-in-text carve-out) and several are Starlight-owned (`.sl-anchor-link`
  # heading anchors measure 24x35). Needs a design pass to separate the genuine
  # failures from the exempt and the framework-owned before any fix is specced —
  # which is why this is shaping, not build. Note the marketing surface was
  # already fixed in spec/tech-site-polish-batch (drawer links went from 17px to
  # 44px full-width rows).
  # Unblocks when: ready now.
  { slug = "docs-tap-target-audit", type = "design" },

  # There is no docs/design/principles/ artefact for either site surface, so the
  # in-session design review could trace none of its findings to a project
  # principle — every finding had to map to the accessibility quality floor, a
  # recognized usability heuristic, or a genre rubric, and pure aesthetic calls
  # had to be quarantined as unarbitrable "director's notes". Without this, taste
  # arguments about the two surfaces have no arbiter and every future review
