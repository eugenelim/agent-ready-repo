# Pack profile: full-ceremony (RFC-0034)
#
# A repo's full governance setup in one command — the "full ceremony" bundle
# RFC-0001 blesses as prose, promoted to an executable unit. Single-scope
# (repo); deps-first ordered (core first — it is required by some of the other three and recommended for repo-governance):
#   agentbundle install --profile full-ceremony <catalogue>
#
# Lint invariants (tools/lint-profiles.py): scope-homogeneous (every pack is
# repo-scope), dependency-complete (core satisfies every addon's core ^3.0 dependency, required or recommended),
# deps-first ordered (core before its dependents).

scope = "repo"
description = "A repo's full governance setup: the core workflow plus RFC/ADR ceremony, product documentation, and monorepo conventions."

[[packs]]
pack = "core"

[[packs]]
pack = "repo-governance"

[[packs]]
pack = "product-documentation"

[[packs]]
pack = "monorepo-extras"
