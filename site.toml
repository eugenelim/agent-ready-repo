# Site recipe — controls docs-site sidebar grouping and pack ordering.
# All packs in packs/ that have a pack.toml appear regardless; this file
# controls order and groups only. Packs not mentioned go in an "Other"
# group at the end, alphabetical.

[[groups]]
label = "Foundation"
packs = ["core", "governance-extras"]

[[groups]]
label = "Agent workflows"
packs = [
  "desk-research", "architect", "product-engineering",
  "product-strategy", "release-engineering",
]

[[groups]]
label = "Engineering"
packs = [
  "frontend-engineering", "iac-terraform", "monorepo-extras",
  "contracts",
]

[[groups]]
label = "Integrations"
packs = [
  "atlassian", "figma", "github", "linear",
]

[[groups]]
label = "Content and design"
packs = ["experience-design", "product-documentation", "converters"]

[[groups]]
label = "Catalogue operations"
packs = ["catalogue-curation", "credential-brokers"]

# ---------------------------------------------------------------------------
# Guide sidebar groups.
#
# Deliberately separate from [[groups]] above: that table is routed through
# discover_packs(), which skips underscore-prefixed slugs and warns on any slug
# without a packs/<slug>/pack.toml — so it structurally cannot express _shared
# or _reference. This table maps a directory under guides/ to its group label.
#
# Table order is group order. An entry is required for every directory under
# guides/; an undeclared directory falls back to a title-cased group appended
# last. Labels here are curated editorial names that no path or pack.toml field
# derives ("The Build Loop (core)" where pack.toml says "Core").
#
# See docs/specs/guides-sidebar-generation/spec.md section Layer 2.
# ---------------------------------------------------------------------------

[[guide_groups]]
dir = "core"
label = "The Build Loop (core)"

[[guide_groups]]
