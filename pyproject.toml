[tool.pytest.ini_options]
# Both packages live in this worktree and need no install: these entries put
# them on sys.path for a bare `pytest`, which — unlike `python3 -m pytest` and
# unlike `make` (Makefile:7) — supplies neither the working directory nor a
# PYTHONPATH of its own. Entries are rootdir-relative and prepended in order.
#
# "." is load-bearing, not tidiness: eight modules under tools/ import repo code
# by package name (`from tools.repo import ...`), and without it a bare
# `pytest tools/` fails at COLLECTION with ModuleNotFoundError: No module
# named 'tools'.
#
# This affects in-process imports only. It does not set the PYTHONPATH
# environment variable, so no child process a test spawns is affected. The two
# packages/*/ suites are also unaffected: each has its own
# [tool.pytest.ini_options], which is the nearer configfile for its own run.
pythonpath = [".", "packages/agentbundle", "packages/credbroker"]

[tool.ruff]
line-length = 99
target-version = "py311"
preview = true
exclude = [
    ".agentbundle",   # projected build output; source lives in packs/
    ".agents",        # projected skill scripts; source lives in packs/ and .claude/
    ".claude",        # projected skill scripts; source lives in packs/
    "/build",         # repo-root build *output* only; must not match the
                      # shipped packages/agentbundle/agentbundle/build/ package
    "__pycache__",
    ".git",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PTH",     # flake8-use-pathlib
    "PLW1514", # open()/Path.open() without explicit encoding= (Windows cp1252 vs UTF-8)
]
# Excluded rules (documented rationale):
#   T20  — print() is the output mechanism in CLI scripts/tools; suppressed
#          per-area via per-file-ignores rather than noqa per line
#   ARG  — pytest fixture arguments are intentionally unused by caller;
#          test files excluded below; lambda _x: patterns are intentional
#   UP035 — deprecated typing imports may be version-guarded; unsafe-fix only
ignore = [
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
# credential-brokers is a protected pack (Engine-Change-RFC required for edits).
# PLW1514 suppressed here; Python source files are always UTF-8 (PEP 3120) so
# the missing encoding= on read_text() is benign and not worth a governance PR.
"packs/credential-brokers/**" = ["PLW1514"]
# CLI tools and lint scripts use print() as their output mechanism
"tools/**" = ["T201", "T203"]
"tools/*.py" = ["T201", "T203"]
# Skill scripts are CLI tools executed by agents
"**/.agents/skills/*/scripts/**" = ["T201", "T203"]
".agents/skills/*/scripts/*.py" = ["T201", "T203"]
"packs/*/scripts/**" = ["T201", "T203"]
"packs/**/.apm/skills/*/scripts/*.py" = ["T201", "T203"]
# Test files: pytest fixture args (tmp_path, monkeypatch, etc.) are
# legitimately unused when the fixture is invoked only for side effects.
# E501 is suppressed because STUB skip messages and complex assertion
# expressions intentionally span one line — splitting loses readability.
# PTH115 (`os.readlink` -> `Path.readlink`) is suppressed in tests: the raw
# link target is what these assertions compare, and `Path.readlink()`
# normalises it ("./AGENTS.md" -> "AGENTS.md"), silently weakening them.
"**/test_*.py" = ["ARG001", "ARG002", "ARG005", "E501", "PTH115"]
"**/*_test.py" = ["ARG001", "ARG002", "ARG005", "E501", "PTH115"]
"**/test-*.py" = ["ARG001", "ARG002", "ARG005", "E501", "PTH115"]
# Adapter-root-bins are CLI entry points
"**/adapter-root-bins/**" = ["T201", "T203"]
# Credbroker test file that tests CLI scripts
"packages/credbroker/tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false
exclude = ["packages/agentbundle/agentbundle/_data/catalogue-scaffold/tests/"]
# Scope: typed library packages only. Untyped scripts (tools/, skill scripts)
# are excluded — typing them is a separate initiative.
files = [
    "packages/agentbundle/agentbundle",
    "packages/credbroker/credbroker",
]
