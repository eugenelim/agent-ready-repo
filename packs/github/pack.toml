[pack]
name = "github"
version = "0.2.0"
description = "Read GitHub Issues or Milestones into repository intake, then review refresh deltas and confirm narrow coordination write-back."
readme = "README.md"
display_name = "GitHub"
license = "Apache-2.0 OR MIT"
categories = ["integrations", "project-management"]
keywords = ["github", "issue", "milestone", "intake", "work-intake"]

[pack.adapter-contract]
version = "0.8"

[pack.install]
default-scope = "user"
allowed-scopes = ["user", "repo"]
# `kiro-ide` is the current name for the Kiro harness (bare `kiro` deprecated). Append-only declared-order.
allowed-adapters = ["claude-code", "kiro-ide", "codex", "copilot", "cursor", "gemini"]

[pack.evals]
skills = ["github-brief-intake", "github-refresh"]

# Enriched pack manifest: catalogue-facing links
# + maintainer, including the `documentation` link to the per-pack guide home.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/github/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level B: mixed audience (developers + PMs); requires gh CLI installed + authenticated.
[pack.first-value]
audience-posture = "mixed"
surfaces         = ["claude-code"]
prerequisites    = ["Install `gh` CLI (https://cli.github.com); for private repos: `gh auth login`"]
verification     = "Ask to intake one GitHub Issue or Milestone and confirm the tracker remains unchanged while a content-based route is returned."
recovery         = "If the `gh` CLI is not installed, install it from https://cli.github.com and run `gh auth login` before retrying."
level-b          = true
starter-task     = "Start repository work from GitHub"
starter-prompt   = "Intake GitHub issue 123 as repository work. Start read-only."
expected-result  = "A bounded normalized record routed by content to the appropriate repository artifact and processor."
next-action      = "Review the selected route and answer any ambiguity or confidentiality question before repository materialization."
