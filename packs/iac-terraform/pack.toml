[pack]
name = "iac-terraform"
version = "0.1.7"
description = "Describe the infrastructure you want; get Terraform you would be willing to review. Cloud-agnostic, gated on a written decision, and it stops at the plan — applying is still yours."
readme = "README.md"
display_name = "IaC (Terraform)"
license = "Apache-2.0 OR MIT"
categories = ["infrastructure", "governance", "ci-cd"]
keywords = ["terraform", "opentofu", "iac", "policy-as-code", "oidc"]

[pack.adapter-contract]
version = "0.12"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]     # repo-scope: emits generated Terraform/pipeline outputs into
                              # the repo, references the repo's ADRs, and reuses the repo-scope
                              # `core` reviewers (same-scope resolution) — ships zero seeds itself

[[pack.dependencies.required]]
catalogue = "agent-ready-repo"
pack = "core"
version = "^2.0"

[[pack.dependencies.required]]
catalogue = "agent-ready-repo"
pack = "governance-extras"
# Requires the governance-index template, `new-adr` infrastructure mode, and
# extension-contract convention introduced in governance-extras 0.9; all three
# are unchanged in 0.10, which retired the `update-conventions` skill this pack
# never used (RFC-0091). Bumped so the range admits the minor actually shipped.
version = "^0.10"

[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/iac-terraform/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level A-only: technical audience (DevOps/platform engineers); no first-run prompting required.
[pack.first-value]
audience-posture = "technical"
surfaces         = ["claude-code"]
prerequisites    = ["core pack installed", "governance-extras pack installed", "terraform or opentofu CLI in PATH"]
verification     = "Run generate-iac on a simple resource description and confirm .tf files are generated."
recovery         = "Verify terraform is in PATH (run terraform version); confirm governance-extras is installed at repo scope."
