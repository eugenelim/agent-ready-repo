[pack]
name = "release-engineering"
version = "0.3.0"
description = "Ship it the way production will see it. Deploy to a throwaway environment, run the tests, read the telemetry, and go round again until it holds. Then it stops and asks, because the next step is the one you cannot undo."
readme = "README.md"
display_name = "Release Engineering"
license = "Apache-2.0 OR MIT"
categories = ["devops", "site-reliability-engineering"]
keywords = ["release", "deploy", "sre", "ephemeral-environments", "canary"]

# Contract metadata. release-loop is an agent definition + a loop skill
# (the same shape as product-engineering's discovery-loop), so it tracks the same
# contract revision.
[pack.adapter-contract]
version = "0.13"

# Release evidence and deployment procedures belong to the target repository.
[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]
allowed-adapters = ["claude-code", "kiro-ide", "codex", "copilot", "cursor", "gemini"]

# Installation still requires core; direct collection, admission and focused
# release review can run without a core workflow event or reviewer.
[[pack.dependencies.required]]
catalogue = "agent-ready-repo"
pack = "core"
version = "^5.0"

# Enriched pack manifest: catalogue-facing links + maintainer.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/release-engineering/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level A-only: technical audience (SRE/ops engineers); no first-run prompting required.
[pack.first-value]
audience-posture = "technical"
surfaces         = ["claude-code"]
prerequisites    = ["core pack installed", "GitHub CLI authenticated"]
verification     = "Run release-loop on the current branch and confirm a CHANGELOG entry is generated."
recovery         = "Check gh auth status shows the correct user; ensure CHANGELOG.md exists in the repo root."
