[pack]
name = "linear"
version = "0.3.2"
description = "Read Linear work into the shared content-based repository intake route, with a separate approved delta sync for existing briefs."
readme = "README.md"
display_name = "Linear"
license = "Apache-2.0 OR MIT"
categories = ["integrations", "project-management"]
keywords = ["linear", "brief", "intake", "sync"]

[pack.adapter-contract]
version = "0.8"

# Every credentialed skill in this pack resolves its credential through the
# broker layer, which this pack does not ship: the `credbroker` library, plus
# the `credential-setup` skill that populates it. `install.py` gates required
# dependencies before any write, so a missing broker is refused at install time
# with a named fix instead of failing at runtime with none.
[[pack.dependencies.required]]
catalogue = "agent-ready-repo"
pack = "credential-brokers"
version = "^0.3"

[pack.install]
default-scope = "user"
allowed-scopes = ["user", "repo"]
# Declared order also drives the
# greenfield fallback (claude-code matches DEFAULT_USER_SCOPE_ADAPTER).
# Admitted adapters match the atlassian/figma precedent for user-scope
# credentialed packs that declare `.agentbundle/` in `allowed-prefixes.user`.
# Append-only declared-order.
allowed-adapters = ["claude-code", "kiro-ide", "codex", "copilot", "cursor", "gemini"]

# Enriched pack manifest
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/linear/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level B: mixed audience (developers + PMs); requires Linear Personal API Key for first run.
[pack.first-value]
audience-posture = "mixed"
surfaces         = ["claude-code"]
prerequisites    = ["Linear Personal API Key — configure via the credential-brokers pack"]
verification     = "Run `linear check` to confirm your credentials are working and your workspace is accessible."
recovery         = "If authentication fails, reconfigure your Linear API key via the credential-brokers pack; verify the key has read access to the correct Linear workspace."
level-b          = true
starter-task     = "Start repository work from a Linear issue"
starter-prompt   = "Intake Linear issue LIN-123 as repository work. Start read-only."
expected-result  = "A bounded normalized record routed by content to the appropriate repository artifact and processor."
next-action      = "Review the selected route and answer any ambiguity or confidentiality question before repository materialization."

[pack.evals]
skills = ["linear", "linear-brief-intake", "linear-brief-sync"]
