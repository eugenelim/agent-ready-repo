[pack]
name = "product-documentation"
version = "0.1.1"
description = "Documentation that matches what actually shipped. Write, restructure, or audit READMEs, quickstarts, guides, and release notes for any library, CLI, API, app, or service, with the reader's journey showing which page is missing."
readme = "README.md"
display_name = "Product Documentation"
license = "Apache-2.0 OR MIT"
categories = ["documentation"]
keywords = ["documentation", "readme", "changelog", "api-docs", "cli-docs"]

[pack.adapter-contract]
version = "0.8"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo", "user"]

# pack-activation-evals: author-product-docs is a judgment/authoring skill
# (create, revise, retrofit, audit, verify — no deterministic artifact output),
# so it ships a Tier-A activation eval and a Tier-4 LLM-judge rubric.
[pack.evals]
skills = ["author-product-docs"]

# Enriched pack manifest: catalogue-facing links.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/product-documentation/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

[pack.first-value]
audience-posture = "non-technical"
surfaces         = ["claude-code"]
prerequisites    = []
verification     = "Ask 'Audit this project's docs and list the missing reader-journey stages' and confirm the agent names the surface it found and returns a row per stage."
recovery         = "If the skill does not activate, confirm product-documentation is installed and try: 'use author-product-docs to audit the docs in this repository'."
level-b          = true
writes-to-repo   = true
starter-task     = "Audit this project's documentation against the reader journey"
starter-prompt   = "Audit this project's docs and tell me which stages of the reader journey are missing."
expected-result  = "A journey gap report: one row per reader stage, marked covered, partial, missing, or not applicable with its file, plus the smallest next fix for each gap."
next-action      = "Ask the agent to write the most important missing page, for example 'Write a quickstart for this project'."
safety-gate      = "Audit mode only reads and reports; it edits nothing. In other modes the skill states the page kind and destination it chose and asks once when the location is unclear."
