# Machine facts the pack declares for each skill.
skills:
  - name: fieldkit-reference
    user-invocable: false
    purpose: Routes a request to one of the other skills.
  - name: field-interview-guide
    user-invocable: true
    purpose: Draft an interview guide for a site visit.
    stage: before
  - name: field-route-planner
    user-invocable: true
    purpose: Plan the order of site visits for a day.
    stage: before
  - name: field-safety-check
    user-invocable: true
    purpose: List hazards and checks before leaving for a site.
    stage: before
  - name: field-weather-brief
    user-invocable: true
    purpose: Summarize the forecast for a site and date.
    stage: before
  - name: field-sample-labels
    user-invocable: true
    purpose: Print label text for collected samples.
    stage: during
  - name: field-photo-captions
    user-invocable: true
    purpose: Write captions for site photos.
    stage: during
  - name: field-note-cleanup
    user-invocable: true
    purpose: Tidy raw field notes into clean entries.
    stage: after
  - name: field-site-report
    user-invocable: true
    purpose: Turn notes and photos into a site report.
    stage: after
