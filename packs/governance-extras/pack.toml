[pack]
name = "governance-extras"
version = "0.9.6"
description = "Keep decisions and proposals on the record. Author RFCs and ADRs, track their status, and update conventions, with templates and seed READMEs to start from."
readme = "README.md"
display_name = "Governance Extras"
license = "Apache-2.0 OR MIT"
categories = ["governance", "documentation"]
keywords = ["rfc", "adr", "conventions"]

# Opt into the catalogue seed lint:
# a
# first-party scaffold pack, so `lint.py (_PackRules._check_seeds)` enforces the
# placeholder contract here. Catalogue-internal — not projected.
lint-seeds = true

# v0.2 contract metadata. RFC/ADR ceremony is per-project, so
# the pack is declared repo-only.
[pack.adapter-contract]
version = "0.8"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]

# Enforced at install time against the
# union of both scopes' state files. Schema field already declared in
# the pack manifest schema; no new field is introduced.
[[pack.dependencies.required]]
catalogue = "agent-ready-repo"
pack = "core"
version = "^2.0"

# Pack activation evals: the Tier-A activation-eval
# coverage allowlist. Each listed skill ships evals/eval_queries.json and is
# measured by tools/run-pack-evals.py. All four governance-extras skills are
# user-triggered judgment/authoring skills, so all four are covered; new-adr,
# new-rfc, and update-conventions also ship Tier-4 LLM-judge rubrics
# (evals/evals.json, keyed by file presence, graded via --mode judge);
# rfc-status is read-only and ships eval_queries.json only. No skill is
# excluded — the pack has no reviewer-internal / non-prompt skill (unlike
# core's security-checklists).
[pack.evals]
skills = ["new-adr", "new-rfc", "update-conventions", "rfc-status"]

# Enriched pack manifest: catalogue-facing links
# + maintainer, including the `documentation` link to the per-pack guide home.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/governance-extras/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level B: mixed audience (teams making architectural decisions);
# "preview-confirm write" archetype — writes shared governance records.
[pack.first-value]
audience-posture = "mixed"
surfaces         = ["claude-code"]
prerequisites    = ["core pack installed at repo scope"]
verification     = "Run rfc-status and confirm it lists the RFC lifecycle states without error."
recovery         = "If rfc-status fails, confirm governance-extras is installed at repo scope; check that docs/rfc/ exists in your repo."
level-b          = true
writes-to-repo   = true
starter-task     = "Record an architectural decision your team has already made"
starter-prompt   = "Create an ADR for the decision to use TOML as the format for our workspace coordination file."
expected-result  = "A new ADR file in docs/adr/ that records the decision, its rationale, and the alternatives considered."
next-action      = "Share the ADR with your team and link to it from the relevant code or config file."
safety-gate      = "The new-adr skill shows you a preview of the ADR content and the target file path before writing anything. Confirm the preview before the file is created."
tutorial         = "guides/governance-extras/tutorials/governance-extras-first-session.md"

[[pack.integrations]]
id        = "promoted-research-evidence"
pack      = "desk-research"
kind      = "input"
role      = "Promoted research evidence"
consumers = ["skill:new-rfc"]
providers = ["skill:desk-research", "skill:desk-research-project-synthesize"]
when      = "A desk-research project has produced synthesized findings that inform the RFC being drafted."
purpose   = "Provide structured research evidence from a completed desk-research project as an input artifact to the RFC drafting workflow."
fallback  = "If desk-research is absent, new-rfc proceeds without promoted evidence and notes the missing input in the RFC context block."

[[pack.integrations]]
id        = "design-proposal-product-engineering"
pack      = "product-engineering"
kind      = "input"
role      = "Design proposal"
consumers = ["skill:new-rfc"]
providers = ["skill:frame-intent", "skill:de-risk-intent"]
when      = "A product-engineering shaping artifact (frame-intent or de-risk-intent output) is ready and informs the RFC under authorship."
purpose   = "Feed a product-engineering design proposal into the RFC drafting workflow as a typed input artifact."
fallback  = "If product-engineering is absent, new-rfc proceeds without the design proposal input and notes the gap."

[[pack.integrations]]
id        = "design-proposal-architect"
pack      = "architect"
kind      = "input"
role      = "Design proposal"
consumers = ["skill:new-rfc"]
providers = ["skill:architect-design", "skill:architect-review"]
when      = "An architect design or review artifact is available and shapes the technical decisions captured in the RFC."
purpose   = "Feed an architect design or review output into the RFC drafting workflow as a typed input artifact."
fallback  = "If architect is absent, new-rfc proceeds without the architecture design proposal and notes the gap."
