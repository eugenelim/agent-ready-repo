[pack]
name = "catalogue-curation"
version = "0.2.0"
description = "Catalogue-operator skills: assimilate external primitives, survey repos, and propose new packs — portable against any catalogue's own contracts."
readme = "README.md"
display_name = "Catalogue Curation"
license = "Apache-2.0 OR MIT"
categories = ["governance", "tooling"]
keywords = ["catalogue", "assimilate"]

# RFC-0059: a catalogue-operator pack — meta-tooling for growing the catalogue,
# one meta-level above governance-extras. Repo-only ceremony; ships instance
# content (not a placeholder scaffold), so lint-seeds stays off.
# 0.2.0: removed export-catalogue skill (superseded by agentbundle catalogue init
# --preset self-hosted); removed hard deps on core and governance-extras — skills
# now operate portably against the target catalogue's own contracts.

[pack.adapter-contract]
version = "0.8"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]

[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/catalogue-curation/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level A-only: technical audience (pack maintainers) building or managing their own skill catalogue.
[pack.first-value]
audience-posture = "technical"
surfaces         = ["claude-code"]
prerequisites    = ["agentbundle installed"]
verification     = "Run assimilate-primitive on a test skill and confirm it is added to your catalogue."
recovery         = "Check that the source pack path exists and is a valid pack.toml directory; re-run with --dry-run to preview changes before committing."
