[pack]
name = "repo-governance"
version = "2.0.0"
description = "Write the RFC, record the ADR, and navigate the decision corpus. Query and explore ADRs and RFCs with checked lineage, lifecycle facts, and offline HTML exports. Templates come with it, so nobody argues about format."
readme = "README.md"
display_name = "Repository Governance"
license = "Apache-2.0 OR MIT"
categories = ["governance", "documentation"]
keywords = ["rfc", "adr", "conventions"]

# Opt into the catalogue seed lint:
# a
# first-party scaffold pack, so `lint.py (_PackRules._check_seeds)` enforces the
# placeholder contract here. Catalogue-internal — not projected.
lint-seeds = true

# v0.2 contract metadata. RFC/ADR ceremony is per-project, so
# the pack is declared repo-only.
[pack.adapter-contract]
version = "0.8"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]

# Core is an optional companion: repo-governance installs and runs without it.
# When core is present, new-rfc hands off to its work-loop, work-intake,
# workspace-status and reviewer agents (see the integrations below); when absent,
# each hand-off names its own fallback.
[[pack.dependencies.recommended]]
catalogue = "agent-ready-repo"
pack = "core"
version = "^3.0"

# Consolidated pack layout: the repo-scope default for the [adr] section of an
# adopter-owned `agentbundle-layout.toml`. The install seeds it by append-if-exists
# and never creates the file. The value is the folder that holds the ADRs
# directly, not a base for per-effort folders. No `[pack.layout.user]`: ADRs are
# per-repo (see the skill's references/agentbundle-layout.md).
[pack.layout.repo]
section    = "adr"
output_dir = "docs/adr"

# Pack activation evals: the Tier-A activation-eval
# coverage allowlist. Each listed skill ships evals/eval_queries.json and is
# measured by `agentbundle pack evals run`. All three repo-governance skills are
# user-triggered judgment/authoring skills, so all three are covered; new-adr
# and new-rfc also ship Tier-4 LLM-judge rubrics
# (evals/evals.json, keyed by file presence, graded via --mode judge);
# navigate-decisions is read-only and ships eval_queries.json only. No skill is
# excluded — the pack has no reviewer-internal / non-prompt skill (unlike
# core's security-checklists).
[pack.evals]
skills = ["new-adr", "new-rfc", "navigate-decisions"]

# Enriched pack manifest: catalogue-facing links
# + maintainer, including the `documentation` link to the per-pack guide home.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/repo-governance/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level B: mixed audience (teams making architectural decisions);
# "preview-confirm write" archetype — writes shared governance records.
[pack.first-value]
audience-posture = "mixed"
surfaces         = ["claude-code"]
prerequisites    = ["a git repository"]
verification     = "Run navigate-decisions with operation summary and confirm it reports ADR and RFC counts without error."
recovery         = "If navigate-decisions fails, confirm repo-governance is installed at repo scope; check that docs/adr/ and docs/rfc/ exist in your repo."
level-b          = true
writes-to-repo   = true
starter-task     = "Record an architectural decision your team has already made"
starter-prompt   = "Create an ADR for the decision to use TOML as the format for our workspace coordination file."
expected-result  = "A new ADR file in the resolved decision-record destination that records the decision, its rationale, and the alternatives considered; docs/adr/ is only the fallback when selected or confirmed."
next-action      = "Share the ADR with your team and link to it from the relevant code or config file."
safety-gate      = "The new-adr skill shows you a preview of the ADR content and the target file path before writing anything. Confirm the preview before the file is created."
tutorial         = "guides/repo-governance/tutorials/repo-governance-first-session.md"

[[pack.integrations]]
id        = "promoted-research-evidence"
pack      = "desk-research"
kind      = "input"
role      = "Promoted research evidence"
consumers = ["skill:new-rfc"]
providers = ["skill:desk-research", "skill:desk-research-project-synthesize"]
when      = "A desk-research project has produced synthesized findings that inform the RFC being drafted."
purpose   = "Provide structured research evidence from a completed desk-research project as an input artifact to the RFC drafting workflow."
fallback  = "If desk-research is absent, new-rfc proceeds without promoted evidence and notes the missing input in the RFC context block."

[[pack.integrations]]
id        = "project-knowledge-authoring-handoff"
pack      = "core"
kind      = "handoff"
role      = "Stable authoring-gate knowledge capture"
consumers = ["skill:new-rfc", "skill:new-adr"]
providers = ["skill:project-knowledge"]
when      = "A selected governance authoring workflow reaches its exact stable semantic gate and has reusable supporting practice to capture."
purpose   = "Submit the published captured-observation request through core's public progressive skill and distil only receipts returned at that same terminal gate."
fallback  = "If project-knowledge is unavailable, emit the named skip and complete governance authoring without fallback persistence."

[[pack.integrations]]
id        = "design-proposal-product-engineering"
pack      = "product-engineering"
kind      = "input"
role      = "Design proposal"
consumers = ["skill:new-rfc"]
providers = ["skill:intent"]
when      = "A product-engineering shaping artifact (`intent` frame or de-risk output) is ready and informs the RFC under authorship."
purpose   = "Feed a product-engineering design proposal into the RFC drafting workflow as a typed input artifact."
fallback  = "If product-engineering is absent, new-rfc proceeds without the design proposal input and notes the gap."

[[pack.integrations]]
id        = "design-proposal-architect"
pack      = "architect"
kind      = "input"
role      = "Design proposal"
consumers = ["skill:new-rfc"]
providers = ["skill:architect-design", "skill:architect-review"]
when      = "An architect design or review artifact is available and shapes the technical decisions captured in the RFC."
purpose   = "Feed an architect design or review output into the RFC drafting workflow as a typed input artifact."
fallback  = "If architect is absent, new-rfc proceeds without the architecture design proposal and notes the gap."

[[pack.integrations]]
id        = "decision-weight-triggers"
pack      = "core"
kind      = "augment"
role      = "Decision-weight risk triggers"
consumers = ["skill:new-rfc"]
providers = ["skill:work-loop"]
when      = "core is installed and new-rfc classifies the decision weight of an RFC under authorship."
purpose   = "Reuse work-loop's risk triggers to choose between light, standard and heavy decision weight."
fallback  = "If core is absent, new-rfc uses the template's own light, standard and heavy definitions to choose the decision weight."

[[pack.integrations]]
id        = "follow-on-queue-registration"
pack      = "core"
kind      = "handoff"
role      = "Follow-on queue registration"
consumers = ["skill:new-rfc"]
providers = ["skill:work-intake", "skill:workspace-status"]
when      = "core is installed and an RFC names follow-on work that belongs in the work queue."
purpose   = "Register follow-on work through work-intake and surface it through workspace-status."
fallback  = "If core is absent, new-rfc lists the follow-ons in the completion receipt and registers nothing."

[[pack.integrations]]
id        = "rfc-review"
pack      = "core"
kind      = "review"
role      = "RFC review"
consumers = ["skill:new-rfc"]
providers = ["agent:adversarial-reviewer", "agent:security-reviewer"]
when      = "core is installed and an RFC draft reaches its pre-handoff review."
purpose   = "Review the RFC with core's adversarial and security reviewer agents."
fallback  = "If core is absent, new-rfc dispatches a fresh-context reviewer given only the RFC text and the same brief, or runs an inline adversarial and security pass recorded in the completion receipt as self-review when the host has no subagents."
