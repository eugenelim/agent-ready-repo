[pack]
name = "user-guide-diataxis"
version = "0.3.1"
description = "Deprecated. Install product-documentation instead; this exists so older installs keep working."
readme = "README.md"
display_name = "User Guide (Diátaxis) — Deprecated"
license = "Apache-2.0 OR MIT"
categories = ["documentation"]
keywords = ["diataxis", "guides", "documentation", "deprecated"]

[pack.adapter-contract]
version = "0.8"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]

# The new-guide shim has a focused output-quality eval. The depended-on
# author-product-docs skill keeps its separate authoring evals.

# This pack installs product-documentation as a required dependency.
# Installing user-guide-diataxis gives you product-documentation and its author-product-docs skill.
[[pack.dependencies.required]]
catalogue = "agent-ready-repo"
pack = "product-documentation"
version = "^0.1"

# Enriched pack manifest
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/product-documentation/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"
