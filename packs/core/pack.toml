[pack]
name = "core"
version = "2.5.4"
description = "Supervised coding, brief to merged PR. The agent writes a spec, works it, runs your gates, and hands the diff to reviewers that argue with it before you ever look."
readme = "README.md"
display_name = "Core"
license = "Apache-2.0 OR MIT"
categories = ["governance", "code-review", "testing"]
keywords = ["work-loop", "spec-driven", "reviewers", "agents"]

# Opt into the catalogue seed lint: this is a first-party scaffold pack whose
# seeds must stay placeholder-shaped, so `lint.py (_PackRules._check_seeds)`
# enforces the placeholder contract here. Catalogue-internal metadata — not
# projected to plugin.json / marketplace.json.
lint-seeds = true

# The v0.2 contract bump ships alongside this pack's metadata.
# The four shipped packs all declare the same shape so the catalogue's
# published packs and the CLI release land in lockstep. core is
# repo-only by content — it ships hooks (Rail B would refuse user
# scope) and AGENTS.md / CONVENTIONS seeds that reference this
# project's vocabulary by name (the falsifiable user-scope test fails).
# Copilot is a full-parity adapter: it projects core's 4 subagents
# (`.github/agents/`) + hook-wiring (`.github/hooks/`); only `command` stays
# dropped (copilot-cli#618/#1113). Contract 0.12 carries Copilot skills:
# core's skills project as first-class Copilot Agent Skills
# (`.github/skills/<name>/SKILL.md`).
[pack.adapter-contract]
version = "0.12"

[pack.install]
default-scope = "repo"
allowed-scopes = ["repo"]

# Pack activation evals: the Tier-A activation-eval
# coverage allowlist. Each listed skill ships evals/eval_queries.json and is
# measured by tools/run-pack-evals.py. Deliberately excluded:
#   - security-checklists — reviewer-internal, never self-discovered (no
#     user-prompt activation surface).
#   - operational-safety — reviewer-internal, never self-discovered (the
#     orchestrator inlines its modules into the quality-engineer brief; it has
#     no user-prompt activation surface — exactly as security-checklists).
#   - work-loop — loaded broadly by the plan→execute→review discipline, not by
#     a narrow user-prompt surface; a clean negative set isn't writable for it.
[pack.evals]
skills = ["new-spec", "bug-fix", "receive-brief", "init-project", "adapt-to-project", "workspace-status"]

# Enriched pack manifest: catalogue-facing links
# + maintainer, including the `documentation` link to the per-pack guide home.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/core/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level A-only: technical audience (software engineers using Claude Code); foundational pack with no first-run prompting required.
[pack.first-value]
audience-posture = "technical"
surfaces         = ["claude-code", "codex", "copilot", "kiro-ide", "kiro-cli", "cursor", "gemini"]
prerequisites    = ["Python 3.11+"]
verification     = "Run workspace-status and confirm your workspace.toml queue state is displayed."
recovery         = "If workspace-status does not activate, re-run adapt-to-project to refresh your repo's skill index."

[[pack.integrations]]
id        = "frontend-preflight-augment"
pack      = "frontend-engineering"
kind      = "augment"
role      = "Frontend pre-flight augmentation"
consumers = ["skill:work-loop"]
providers = ["skill:frontend-engineering"]
when      = "The target repository declares HTML/CSS/JS as a primary output and the frontend-engineering pack is installed."
purpose   = "Inline the frontend-engineering skill into the work-loop pre-EXECUTE gate when the build produces an HTML/CSS/JS primary artifact."
fallback  = "If frontend-engineering is absent, work-loop records a named skip (FE pre-flight: skipped) and continues without the FE gate."

[[pack.integrations]]
id        = "frontend-cold-reviewer"
pack      = "frontend-engineering"
kind      = "review"
role      = "Frontend cold reviewer"
consumers = ["skill:work-loop"]
providers = ["agent:frontend-reviewer"]
when      = "The diff's primary output is HTML/CSS/JS and the frontend-engineering pack is installed."
purpose   = "Run the frontend-reviewer agent during work-loop REVIEW for diffs whose primary output is HTML/CSS/JS."
fallback  = "If frontend-engineering is absent, the REVIEW phase skips the frontend-reviewer and records a named skip."
