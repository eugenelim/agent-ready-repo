[pack]
name = "credential-brokers"
version = "0.3.0"
description = "Your credentials stay out of the repo and out of the agent's context. credbroker resolves them in-process, sso-broker handles the browser cookie dance, and an LLM-cooperative credential-setup skill walks you through the first time."
readme = "README.md"
display_name = "Credential Brokers"
license = "Apache-2.0 OR MIT"
categories = ["credentials", "security"]
keywords = ["sso", "secrets", "broker", "auth"]

[pack.adapter-contract]
version = "0.7"

[pack.install]
default-scope = "user"
allowed-scopes = ["user", "repo"]
# Only three harnesses originally qualified, because only they declared
# `.agentbundle/` in `allowed-prefixes.user` — the precondition for writing the
# broker to `~/.agentbundle/bin/`. `copilot`, `cursor`, and `gemini` have since
# added `.agentbundle/` to their user prefixes, so all three are admitted: the
# broker delivery rail is adapter-agnostic, fenced only by that prefix.
# `kiro-ide` is the current name for the Kiro harness (bare `kiro`
# deprecated). Declared order is load-bearing: append-only.
allowed-adapters = ["claude-code", "kiro-ide", "codex", "copilot", "cursor", "gemini"]

# Enriched pack manifest: catalogue-facing links
# + maintainer, including the `documentation` link to the per-pack guide home.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/credential-brokers/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level A-only: technical audience (developers configuring credentialed skills); no first-run prompting required.
[pack.first-value]
audience-posture = "technical"
surfaces         = ["claude-code"]
prerequisites    = []
verification     = "Ask the agent to show your credential broker status and confirm it responds with tier and resolution info."
recovery         = "If the broker is missing, confirm credential-brokers is installed at user scope; run agentbundle install credential-brokers --scope user."
