name: docs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'LICENSE-MIT'
      - 'docs/**'
      - 'packages/**/AGENTS.md'
      - 'apps/**/AGENTS.md'
      - 'docs-site/AGENTS.md'
      - 'docs-site/**/AGENTS.md'
      - 'guides/AGENTS.md'
      - 'guides/**'
      - 'web/AGENTS.md'
      - 'web/**/AGENTS.md'
      - '.claude/**'
      - '.github/pull_request_template.md'
      - 'tools/lint-agents-md.py'
      - 'tools/lint-guides-no-repo-only-refs.py'
      - 'tools/lint-guide-titles.py'
      - 'tools/test_lint_guide_titles.py'
      - 'tools/validate_guides.py'
      - 'tools/test_validate_guides.py'
      - 'tools/build-site.py'
      - 'packages/agentbundle/agentbundle/catalogue_tooling/skill_spec_lint.py'
      - 'packages/agentbundle/tests/unit/test_catalogue_skill_spec_lint.py'
      - 'packs/**/.apm/skills/**'
      - '.claude/skills/work-loop/scripts/lint-knowledge.py'
      - 'packs/core/.apm/skills/work-loop/scripts/lint-knowledge.py'
      - 'tests/roster/test_work_loop_lint_knowledge.py'
      - '.claude/skills/work-loop/scripts/append-knowledge.py'
      - 'packs/core/.apm/skills/work-loop/scripts/append-knowledge.py'
      - 'packs/core/tests/skills/work-loop/test_append_knowledge.py'
      - 'profiles/**'
      - 'packs/**'
      - '.claude/skills/work-loop/scripts/loop-cohort.py'
      - '.claude/skills/work-loop/scripts/loop-engine.py'
      - '.claude/skills/work-loop/scripts/check-spec-status.py'
      # The state lock. `packs/**` below covers the pack copy; the `.claude/`
      # projection needs naming explicitly.
      - '.claude/skills/work-loop/scripts/_statelock.py'
      - 'packs/core/.apm/skills/work-loop/scripts/loop-cohort.py'
      - 'packs/core/.apm/skills/work-loop/scripts/loop-engine.py'
      - 'packs/core/.apm/skills/work-loop/scripts/check-spec-status.py'
      - 'packs/core/.apm/skills/work-loop/scripts/_statelock.py'
      - 'packs/core/tests/skills/work-loop/test_loop_cohort.py'
      - 'packs/core/tests/skills/work-loop/test_loop_engine.py'
      - 'packs/core/tests/skills/work-loop/test_statelock.py'
      - 'packs/core/tests/skills/work-loop/test_loop_concurrency.py'
      - 'packs/core/tests/skills/work-loop/test_loop_cohort_cli.py'
      - 'tests/roster/test_work_loop_root_validation.py'
      - 'packs/core/tests/skills/work-loop/test_fingerprint_width.py'
      - 'packs/core/.apm/skills/work-loop/scripts/lint-spec-status.py'
      - 'packs/core/.apm/skills/work-loop/scripts/lint-traceability.py'
      - 'tools/semgrep/**'
      - 'tools/test-semgrep-argv-boundary.py'
      - 'tools/hooks/**'
      - 'tools/test-all.py'
      - 'tools/lint-pack-test-boundary.py'
      - 'tools/test-lint-pack-test-boundary.py'
      # The boundary lint's checks are only as live as the declarations
      # they read, so a CLASSES edit alone must re-trigger the gate.
      - 'tools/pack_test_compatibility.py'
      - 'tools/test_pack_test_compatibility.py'
      - 'tools/test_pack_test_class_characterization.py'
      - 'tools/lint_git_ignore.py'
      - 'tools/test-lint-git-ignore.py'
      - 'tools/lint-no-direct-check-ignore.py'
      - 'tools/test-lint-no-direct-check-ignore.py'
      - 'tools/test-lint-boundary-golden.py'
      - 'tools/lint-boundary-golden.json'
      - 'tools/test-lint-boundary-structural.py'
      - 'tools/test-lint-agents-md-gitignore-probes.py'
      # The boundary lint reads these as runner call sites, so a change to
      # any of them has to re-trigger it — collapsing the Makefile's
      # pack-test lines is precisely the regression it exists to catch.
      - 'Makefile'
      - '.github/workflows/build-check.yml'
      - '.github/workflows/catalogue-tooling-ci-gates.yml'
      - 'packages/agentbundle/agentbundle/catalogue_tooling/self_host_windows.py'
      - 'tools/test-pre-pr.sh'
      - 'tools/seed_test_sandbox.py'
      - 'packs/core/tests/hooks/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]

jobs:
  lint-agents-md:
    name: AGENTS.md hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Run AGENTS.md linter
        run: python tools/lint-agents-md.py

  lint-guides-no-repo-only-refs:
    name: Shipped guides contain no repo-only governance references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Run shipped-guide governance-reference linter
        run: python3 tools/lint-guides-no-repo-only-refs.py

  lint-guide-titles:
    name: Guide frontmatter title matches body H1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # The linter parses frontmatter with yaml.safe_load — the same parser
      # build-site.py uses, so the gate and the generator agree on what a title
      # is. Without this install the job dies on ImportError, not a lint result.
      - name: Install tooling requirements
        run: pip install -r tools/requirements.txt
      - name: Run guide-title divergence linter
        run: python3 tools/lint-guide-titles.py
      - name: Run its tests
        run: python3 tools/test_lint_guide_titles.py

  validate-guides:
    name: Published guides carry complete metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # jsonschema + pyyaml: without them the validator silently degrades to a
      # field-by-field fallback, so the install is part of the assertion.
      - name: Install tooling requirements
        run: pip install -r tools/requirements.txt
      # Runs the CLI against the REAL tree. tools/test_validate_guides.py only
      # exercises tmp_path fixtures, so before this step the zero-warning state
      # spec/guide-metadata-completion established had no repeating guard: guide 126
      # could land with no frontmatter and every gate stayed green.
      - name: Validate published-guide metadata
        run: python3 tools/validate_guides.py
      - name: Fail on any warning, and assert the run had coverage
        # Two assertions, because the first alone is blind. The validator exits 0 for
        # warnings by design (they were advisory while the backfill was in flight), so
        # a warning now means a regression. But "0 errors, 0 warnings" is ALSO what an
        # empty or missing tree prints, so grepping only that asserts the absence of
        # complaints without asserting anything was examined. The floor is well under
        # the current 188 so ordinary additions do not trip it, and well above 0.
        run: |
          set -euo pipefail
          out="$(python3 tools/validate_guides.py 2>&1)"
          echo "$out"
          if ! grep -q '0 errors, 0 warnings' <<<"$out"; then
            echo "::error::published-guide metadata is incomplete — see the warnings above"
            exit 1
          fi
          # grep -o, not sed: `\+` is a GNU extension, so a sed pattern using it
          # cannot be verified on a BSD sed and would be untested until CI ran it.
          checked="$(grep -o '[0-9][0-9]* checked' <<<"$out" | head -1 | cut -d' ' -f1)"
          if [ -z "$checked" ] || [ "$checked" -lt 150 ]; then
            echo "::error::validator examined ${checked:-no} files — expected at least 150; the guides tree is missing or the invocation is wrong"
            exit 1
          fi

  lint-skill-spec:
    name: agentskills.io spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install agentbundle with lint extra
        run: python -m pip install -e 'packages/agentbundle/[lint]' pytest
      - name: Run skill-spec linter (projection + seeds)
        run: agentbundle catalogue lint --root . --deep
      - name: Self-test the linter (every failure mode + happy path)
        run: python -m pytest packages/agentbundle/tests/unit/test_catalogue_skill_spec_lint.py -v

  lint-knowledge:
    name: Knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run knowledge-base linter
        run: python .claude/skills/work-loop/scripts/lint-knowledge.py
      - name: Self-test the linter (validation rules + schema/guidance drift)
        run: python3 -m pytest tests/roster/test_work_loop_lint_knowledge.py -q
      - name: append-knowledge self-test
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_append_knowledge.py -q

  loop-cohort:
    name: Caps enforcer self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The golden baseline reads its capture subject from a pinned
          # commit; the default depth of 1 cannot resolve `git show <sha>:…`.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Self-test loop-cohort Phase-1 (schema, init pair, check verbs, review)
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_loop_cohort_cli.py -q --durations=10
      - name: Python test suite — loop-cohort
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_loop_cohort.py -q --durations=10
      - name: Python test suite — loop-engine FSM
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_loop_engine.py -q --durations=10
      - name: Python test suite — loop state lock
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_statelock.py -q --durations=10
      - name: Python test suite — loop concurrency
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_loop_concurrency.py -q --durations=10
      - name: Python test suite — base freshness
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_check_base_freshness.py -q --durations=10
      - name: Python test suite — CLI path-argument boundary validators
        run: python3 -m pytest tests/roster/test_work_loop_root_validation.py -q
      - name: Python test suite — review-fingerprint algorithm + width contract
        run: python3 -m pytest packs/core/tests/skills/work-loop/test_fingerprint_width.py -q
      - name: Pack runtime boundary (no pack's .apm/ carries tests; projection is clean)
        run: python3 tools/lint-pack-test-boundary.py
      - name: Pack runtime boundary — self-test (falsified in both directions)
        # The lint above is the only thing standing between a new pack and a
        # regression, so its own falsification cases need a runner of their own.
        # `tools/test-all.py` is executed by no workflow; this step is the gate.
        run: python3 tools/test-lint-pack-test-boundary.py
      - name: Pack runtime boundary — behaviour contract (golden baseline)
        # Reads its capture subject from a pinned commit, so this job needs full
        # history; `actions/checkout` defaults to depth 1, where
        # `git show <sha>:<path>` cannot resolve. The harness refuses to stage an
        # empty subject rather than passing vacuously, so a shallow checkout
        # fails loudly — but it should not have to.
        run: python3 tools/test-lint-boundary-golden.py
      - name: Pack runtime boundary — structural properties
        # What the captured triple cannot observe: process counts, inventory
        # build counts, and filesystem side effects.
        run: python3 tools/test-lint-boundary-structural.py
      - name: Batched git-ignore resolver — self-test
        run: python3 tools/test-lint-git-ignore.py
      - name: No direct git check-ignore outside the approved helper
        run: python3 tools/lint-no-direct-check-ignore.py
      - name: No direct git check-ignore — self-test
        run: python3 tools/test-lint-no-direct-check-ignore.py
      - name: agents-md session-scratch gitignore probes
        run: python3 tools/test-lint-agents-md-gitignore-probes.py

  # Aggregator end-to-end. Duplicates the per-layer linter jobs by design —
  # those each surface with their own check name in PR UI; this one catches
  # regressions in the catalogue gate's composition (a layer dropped, a reorder
  # breaking a dependency, exit-code propagation). Runs agentbundle catalogue
  # verify (portable) then the repo-specific catalogue checks + shipped pre-pr.py.
  hooks:
    name: Lifecycle hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install tools dependencies
        run: pip install -r tools/requirements.txt
      - name: Seed a healthy state.json so the aggregator exercises loop-cohort check
        run: |
          mkdir -p docs/specs/_ci-smoke
          python3 -c "
          import json, pathlib, uuid
          d = json.loads(pathlib.Path('.claude/skills/work-loop/assets/state.json').read_text())
          d['run_id'] = str(uuid.uuid4())
          d['plan_review_status'] = 'approved'
          d['implementation_retry_count'] = 0
          d['review_retry_count'] = 0
          pathlib.Path('docs/specs/_ci-smoke/state.json').write_text(json.dumps(d, indent=2))
          "
      - name: Run pre-pr aggregator (mirrors local enforcement triplet)
        run: PYTHONPATH=packages/agentbundle python tools/catalogue/pre_pr_catalogue.py
      - name: Self-test the aggregator (each layer corruption surfaces)
        run: bash tools/test-pre-pr.sh
      - name: Self-test session-start (scope filter + malformed warning)
        run: bash packs/core/tests/hooks/test_session_start_projection.sh

  check-adr-immutability:
    name: ADRs are immutable
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect edits to existing accepted ADRs
        run: |
          # ADRs are immutable once accepted (status edits are allowed; body edits are not).
          # This is a heuristic: warn if any line outside the frontmatter changed
          # in a file that already had status `Accepted` on main.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" -- 'docs/adr/*.md' || true)
          for f in $changed; do
            # skip new files
            if ! git cat-file -e "$base:$f" 2>/dev/null; then continue; fi
            # was it Accepted on base?
            if git show "$base:$f" | grep -q '^- \*\*Status:\*\* Accepted'; then
              # diff body lines (skip frontmatter changes — first 10 lines)
              body_diff=$(git diff "$base" "$head" -- "$f" | tail -n +12 | grep -E '^[+-]' | grep -vE '^\+\+\+|^---|Status:' || true)
              if [[ -n "$body_diff" ]]; then
                echo "::warning file=$f::This ADR was Accepted on base. Body edits are not allowed; supersede it with a new ADR instead. (Status-only edits are fine.)"
              fi
            fi
          done
          # Non-blocking: warns but always exits 0 — reviewers make the call.
