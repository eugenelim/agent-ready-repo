name: build-check

# Self-hosting gate (Phase 1): runs `make build-check` against every PR
# targeting main. Refuses to merge if any Phase-1 *Projected* path on
# disk drifted from what the build pipeline emits. See
# docs/specs/self-hosting/spec.md § Phased rollout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AC12: contents: read is sufficient — every step reviewed: no token use, no
# artifact upload/download, no PR comment, no push.
permissions:
  contents: read

# AC12: keyed so NON-PR events never share a group. `cancel-in-progress` gating
# alone is insufficient — GitHub permits one running plus one PENDING run per
# group regardless of that flag, so a third queued run cancels the pending one.
# With push-to-main in scope that would cancel an intermediate commit's SAST run,
# which is the belt-and-braces the head-commit self-certification residual relies
# on. github.run_id gives every non-PR event its own group. Do NOT use
# github.head_ref: it is fork-supplied, so two fork PRs on the same branch name
# would share a group and either could cancel the other's required check.
concurrency:
  group: build-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Local reproduction, per job (spec/ci-gate-parallelization AC16) ───────────
# Parity with the local gate is ONE-TO-MANY after this split: `make build-check`
# covers gate-main ∪ gate-sast, but no single local command equals any single CI
# job. Addressability is the replacement invariant, so each job's anchor step has a
# named local command:
#
#   gate-main              make build-check SAST_DELEGATED=1
#                          ^ CI-EQUIVALENCE ONLY — *not* the pre-push command. It
#                            skips the SAST/SCA leg by design. Its other ~50 steps
#                            map to `make test` / `lint-ruff` / `lint-mypy` / `pre-pr`.
#   gate-sast              make sast
#   gate-export-boundary   make test runs the same suite — but WITHOUT the -rs skip
#                          check or the tree probe, so a green `make test` is
#                          compatible with a red job.
#   gate-credbroker        make test runs `pytest packages/credbroker/ -q` among ~30
#                          other suites — so no local command equals this job, and
#                          `make test` covers it many-to-one. It also runs WITHOUT
#                          this job's [crypto] import probe and -rs skip check, so
#                          the same green-locally/red-in-CI gap as above applies.
#   aggregator             make build-check runs the posture test via
#                          build_gate_chain.py; the needs.*.result guard has no
#                          local counterpart in any target.
#
#   all five               make ci   ← the only job-level "local green implies CI
#                                      green" claim. Use this before pushing.
jobs:
  gate-main:
    name: gate-main
    runs-on: ubuntu-latest
    # 25 minutes: this job runs the drift/lint chain plus ~50 pytest and lint
    # steps. The RFC-0082 sdist budget that used to justify this number travels
    # with gate-export-boundary, which now hosts that gate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history: the chain gates below fail OPEN without it — lint-catalogue-curation-guard's path-gate, lint-build's top-level audit, and lint-spec-status's base-ref resolution each exit 0 when the base ref is unreachable (AC12).
          fetch-depth: 0
          # AC12: the token must not persist into .git/config. zizmor's
          # `artipacked` audit ranks below this repo's --min-severity high,
          # so AC13's posture test is the only thing asserting it.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install tools dependencies
        # `make build-check` chains `tools/hooks/pre-pr.py` and
        # `tools/catalogue/pre_pr_catalogue.py`. Install tools/requirements.txt
        # before invoking make so the projected-artifact lint surface is reachable in CI.
        run: pip install -r tools/requirements.txt
      - name: Install agentbundle (editable) + pytest
        run: python -m pip install -e packages/agentbundle/ pytest
      - name: Install bandit unconditionally (lint-nosec-form's ID registry)
        # Unconditional, and deliberately not the whole of requirements-sast.txt.
        #
        # `make build-check` chains tools/lint-nosec-form.py on every run. One of
        # its checks — a well-formed but nonexistent test id, which bandit
        # resolves to nothing and so treats as a blanket suppression — needs
        # bandit's own registry and silently no-ops without it. See
        # docs/specs/bandit-nosec-form-lint/spec.md AC4b.
        #
        # Post-split (ADR-0086) this step is MORE load-bearing, not less: `make sast`
        # never runs in this job at all — it is gate-sast's — so nothing else here
        # would provision bandit and the lint would be inert on EVERY PR. The rest
        # of requirements-sast.txt belongs to gate-sast, which installs it
        # unconditionally. spec/ci-gate-parallelization AC14(1); the posture test
        # asserts this step's presence in this job.
        #
        # The pin is READ, not restated — a second copy of the version range can
        # drift from the canonical one in requirements-sast.txt; deriving it
        # cannot.
        #
        # LAST step before `make build-check`, and it asserts its own success.
        # Both matter, because a provisioning step that quietly does nothing
        # would leave the required check green with the gate it enables inert —
        # the exact shape this whole step exists to remove. Three routes, all
        # measured rather than assumed:
        #   (a) a grep that matches nothing yields `pip install ""`, which exits
        #       0 with no output; `set -e` on the assignment is what stops it.
        #   (b) a bandit whose registry import raises — an API move inside the
        #       >=1.9,<2 range, a broken plugin entry point — leaves
        #       id_checker() returning None, and lint-nosec-form then degrades
        #       to a caveat and exit 0. The python assertion below reaches for
        #       the same API and both directions of its answer.
        #   (c) a later pip resolution replacing a shared transitive dep of
        #       bandit; running last leaves nothing between here and the gate.
        #
        # The registry probe raises rather than asserting: a bare `assert` is
        # compiled out under PYTHONOPTIMIZE, which would restore the silent pass
        # this probe exists to remove.
        #
        # tools/test_build_gate_chain.py pins this step's existence, its lack of
        # an `if:`, and its position — extracting this very body and running it
        # against two mutated inputs. Nothing else does: lint-ci-parity's roster
        # only demands a disposition for steps that exist, so deleting this step
        # and its row would leave both gates green.
        run: |
          set -euo pipefail
          pin="$(grep -E '^bandit([^A-Za-z0-9._-]|$)' tools/requirements-sast.txt)"
          echo "installing pinned: $pin"
          pip install "$pin"
          python - <<'PROBE'
          from bandit.core import extension_loader as loader
          if not loader.MANAGER.check_id("B307") or loader.MANAGER.check_id("B999"):
              raise SystemExit(
                  "bandit's registry did not resolve as lint-nosec-form's "
                  "id_checker() expects; its unknown-id check would silently "
                  "no-op behind a green gate"
              )
          PROBE
      - name: Run make build-check
        # SAST_DELEGATED is passed as a make ARGUMENT, not an env prefix:
        # $(origin SAST_DELEGATED) must be `command line` for the Makefile to
        # treat the delegation as deliberate (ADR-0086). As a prefix the origin
        # is `environment`, the recipe would run the SAST leg here as well as in
        # gate-sast, and the scan would silently run twice.
        run: make build-check PACKS_DIR=packs SAST_DELEGATED=1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ruff + mypy
        run: pip install ruff mypy
      - name: ruff lint (style, imports, common bugs)
        # tools/lint-ruff.py delegates to `python -m ruff check .` with the
        # project config from pyproject.toml. Fails the build on any violation.
        run: python3 tools/lint-ruff.py
      - name: mypy type-check (typed packages only)
        # tools/lint-mypy.py scopes mypy to packages/agentbundle/agentbundle and
        # packages/credbroker/credbroker; tests/build_pipeline/ is a test tree, not library code.
        run: python3 tools/lint-mypy.py

      # version-drift guard: CLI_VERSION (agentbundle/version.py) must equal
      # [project].version (pyproject.toml). make build-check runs no pytest, so
      # wire this path explicitly or the guard is dead. A stale CLI_VERSION
      # makes `agentbundle --version` lie (it was stuck at 0.1.0 across several
      # releases); the release workflow only asserts the tag matches pyproject.
      - name: pytest version constants (CLI_VERSION ↔ pyproject drift guard)
        working-directory: packages/agentbundle
        run: python -m pytest tests/unit/test_version.py

      # adapter resolver (RFC-0011/0012 six-step lookup) + ADR-0004
      # single-constant rebrand: the default-fallback assertions reference
      # DEFAULT_ADAPTER so a downstream rebrand that flips the constant stays
      # green. make build-check runs no pytest, so wire these paths explicitly
      # or the resolver coverage never gates.
      - name: pytest adapter resolver (RFC-0011/0012, ADR-0004 rebrand)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/unit/test_resolve_user_scope_target_adapter.py
          tests/unit/test_resolve_target_adapter_user_config.py
          tests/unit/test_install_argparse_adapter_flag.py
      - name: pytest converters install/uninstall (AC6a)
        working-directory: packages/agentbundle
        run: python -m pytest tests/integration/test_install_converters_user_scope.py

      # pack-profiles (RFC-0034): the profile reader/schema, batch-aware dep
      # gate, CLI surface (mutex + list-profiles), and the install orchestrator.
      # make build-check runs no pytest, so wire these paths explicitly.
      - name: pytest pack-profiles (RFC-0034)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/unit/test_profile_reader.py
          tests/unit/test_dependencies_batch.py
          tests/unit/test_cli_profile_surface.py
          tests/integration/test_install_profile.py
          tests/integration/test_install_profile_live.py

      # convenient-install-defaults (RFC-0046): the four-layer source resolver,
      # the `source` config key, the optional-catalogue CLI surface, and the
      # keystone editable-detection test (a real `pip install -e` in a throwaway
      # venv). make build-check runs no pytest, so wire these paths explicitly.
      - name: pytest convenient-install-defaults (RFC-0046)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/unit/test_source_defaults.py
          tests/unit/test_user_config_source.py
          tests/unit/test_cli_catalogue_optional.py
          tests/unit/test_config_cmd.py
          tests/integration/test_install_default_source.py
          tests/integration/test_editable_source_detection.py

      # credbroker-user-scope T1: consumer bootstraps append the vendored
      # ~/.agentbundle/lib floor at LOWEST sys.path precedence. The
      # no-insert-0 source guard enforces the spec's "never prepend"
      # Never-do across all six consumer scripts; the precedence proof is
      # platform-agnostic, so the Linux job gates it (make build-check runs
      # no pytest). Deps-free — the behavioral check uses a planted fake
      # credbroker, not httpx.
      - name: pytest credbroker floor precedence (credbroker-user-scope T1)
        working-directory: packages/agentbundle
        run: python -m pytest ../../tests/roster/test_credential_broker_floor_precedence.py

      # credbroker T9: RFC-0023 retired the shared-libs → consumer-scripts
      # projection (and its build-check drift gate). The standing net that
      # no shim copy reappears under a consumer scripts/ — and that the
      # companion-rail source is retained — is this test; wire it into CI
      # explicitly (make build-check runs no pytest).
      - name: pytest shared-libs projection retirement (credbroker T9)
        working-directory: packages/agentbundle
        run: python -m pytest tests/build_pipeline/test_shared_libs_projection.py

      # self_host derives SELF_HOST_PACKS / SELF_HOST_ADAPTERS from the recipe;
      # make build-check runs no pytest, so wire this unit test explicitly.
      - name: pytest self-host recipe config (externalize-self-host-config)
        working-directory: packages/agentbundle
        run: python -m pytest tests/build_pipeline/test_self_host_recipe_config.py

      # The fixture-overwrite guard now lives in cmd_self (not the Makefile);
      # wire its test explicitly since make build-check runs no pytest.
      - name: pytest self-host fixture guard (windows-build-self-entry)
        working-directory: packages/agentbundle
        run: python -m pytest tests/build_pipeline/test_self_host_fixture_guard.py

      # The make-free build-self / build-check chaining script (repo-native
      # tools/, not the agentbundle package); wire its test explicitly since
      # make build-check runs no pytest.
      - name: pytest make-free gate chains (windows-build-gate-chain)
        run: python -m pytest tools/test_build_gate_chain.py

      - name: pytest journey editorial decisions
        run: python -m pytest tools/test_journey_editorial_decisions.py

      # The generated guides sidebar: sidebar-config.json is gitignored, so
      # these set-equality, label-parity and determinism guards are the only
      # thing standing between a generator regression and a broken published
      # navigation. make build-check runs no pytest — wire them explicitly.
      - name: pytest guides sidebar generation
        run: python -m pytest tools/test_build_site_inventory.py tools/test_build_site_projection.py tools/test_build_site_sidebar.py
      - name: Install credbroker (editable, with crypto extra)
        # Required by four LATER steps in this job that import credbroker and its
        # crypto extras: the credential-setup skill suite (which probes
        # `import credbroker, cryptography, argon2` directly), the jira and
        # confluence-crawler SSO suites, and the user-libs vendored-floor purity
        # test.
        #
        # It no longer backs the stdlib-purity gate: that lives in
        # packages/credbroker/tests/unit/ and travelled to gate-credbroker with the
        # suite (spec/ci-gate-credbroker). Do not delete this step on the strength
        # of the purity gate having moved — the four consumers above are the reason
        # it stays.
        run: python -m pip install -e './packages/credbroker[crypto]'

      - name: pytest guides + catalogue navigation
        run: >-
          python -m pytest
          tools/test_validate_guides.py
          tools/test_check_guide_index.py
          tools/test_catalogue_navigation.py
          tools/test_documentation_entry_links.py

      # test_check_rendered_site_links.py appears in pages.yml as a `paths:`
      # trigger and never as a run step — easy to miscount as covered.
      - name: pytest site build + link rewriting
        run: >-
          python -m pytest
          tools/test_build_site_link_rewrites.py
          tools/test_check_rendered_site_links.py
          tools/test_build_site_routing.py
          tools/test_browser_gate_subset.py
      # spec/site-ci-contract-closure AC4. The docs palette's WCAG floor becomes a
      # required gate here rather than in docs.yml or pages.yml: neither is a
      # required context, so a gate placed there could not block a merge. Both
      # commands run — the checker is what fails on a regressed pair, and its suite
      # is what proves the checker still detects one (the checker exits 0 both when
      # the palette is clean and when it has been broken into a no-op).
      #
      # Dependency-free by contract: stdlib only, no npm, nothing added to any
      # manifest. Its step name is registered in tools/lint-ci-parity.py; renaming
      # it without updating that roster fails the parity gate in both directions.
      - name: docs palette contrast gate
        run: |
          python3 tools/check-docs-contrast.py
          python -m pytest tools/test_check_docs_contrast.py -q
      # spec/docs-site-build-contract-hardening AC7. Posture of the DEPLOY workflow,
      # asserted from a required context — pages.yml is not itself required, so
      # without this a deploy-gate deletion would only surface after merge. Invoked
      # as a script, not via pytest: it defines no `test_` function, so a pytest
      # collection would silently run nothing.
      - name: pages.yml deploy-gate posture
        run: python3 tools/test-pages-workflow.py
      # Pages is not a required context, so its concurrency isolation must be
      # asserted from this required job. The script's self-test mutates both the
      # group and cancellation scope on every invocation.
      - name: pages.yml concurrency posture
        run: python3 tools/test-pages-concurrency.py
      # The credential-setup skill's own suite (RFC-0023 T8 + the
      # missing-credbroker guard) lives under packs/credential-brokers/tests/skills/credential-setup/ (ADR-0071), which
      # neither `make build-check` nor any package pytest discovers. Wire it
      # explicitly or it never gates. Placed after the credbroker[crypto]
      # install above so the in-process import + crypto-extra cases resolve.
      - name: pytest credential-setup skill (RFC-0023 T8 + missing-credbroker guard)
        working-directory: packs/credential-brokers/tests/skills/credential-setup
        # `requires_crypto` gates on find_spec("cryptography") and ("argon2"), so a
        # missing extra skips the no-token-to-stdout and reserved-namespace cases
        # while the step still exits 0. Probe them. Deliberately NOT httpx: this
        # suite never imports it and CI installs it below this step.
        # test_credential_setup_skill.py is named explicitly — it moved here from
        # the engine's tree, where it gated only by residence.
        run: |
          python -c "import credbroker, cryptography, argon2"
          python -m pytest test_setup.py test_credential_setup_skill.py

      # atlassian-sso-cookie (RFC-0035): the jira + confluence-crawler cookie-path
      # security suites (mock-transport — cookie confinement, no-Authorization,
      # write refusal, off-domain-302 leak prevention, 401 remediation; the config
      # loader/selector; the setup helper) live under packs/atlassian/tests/skills/<skill>/ (ADR-0071), which
      # neither `make build-check` nor any package pytest discovers. Wire them
      # explicitly or the client-side security contract never gates. credbroker is
      # installed editable above; httpx is the only extra runtime dep.
      - name: pip install httpx for the atlassian SSO suites (RFC-0035)
        run: pip install 'httpx>=0.27'
      # Both trios `pytest.importorskip("credbroker")` at module scope, so a
      # missing dependency exits 0 with the whole file skipped and the cookie
      # confinement / fail-closed-config assertions silently stop running. The
      # in-step import is what survives a future reordering of the installs above.
      - name: pytest jira SSO suites (atlassian-sso-cookie)
        working-directory: packs/atlassian/tests/skills/jira
        # test_check_sso_login.py covers the `check` auto-recovery flow —
        # jira-check-sso-auto-login AC11–AC20, AC30–AC32.
        run: |
          python -c "import credbroker, httpx"
          python -m pytest test_sso_config.py test_sso_client.py test_setup_sso.py \
            test_check_sso_login.py
      - name: pytest confluence-crawler SSO suites (atlassian-sso-cookie)
        working-directory: packs/atlassian/tests/skills/confluence-crawler
        run: |
          python -c "import credbroker, httpx"
          python -m pytest test_sso_config.py test_sso_client.py test_setup_sso.py
      - name: pytest catalogue-test carve-out destinations (RFC-0082)
        run: |
          python tools/lint-conformance-portability.py --root .
          python -m pytest tests/ -q
          python -m pytest packs/architect/tests/pack/ -q
          python -m pytest packs/architect/tests/skills/architect-assess/ -q
          python -m pytest packs/core/tests/pack/ -q
          python -m pytest packs/core/tests/skills/workspace-status/ -q
          python -m pytest packs/credential-brokers/tests/pack/ -q
          python -m pytest packs/atlassian/tests/skills/flow-metrics/ -q
          python -m pytest packs/product-engineering/tests/pack/ -q
          python -c "import httpx"
          python -m pytest packs/linear/tests/skills/linear/ -q
          python -m pytest tools/test_lint_agents_md_diataxis_block.py \
            tools/test_lint_agents_md_legacy_block.py \
            tools/test_lint_agents_md_risk_block.py \
            tools/test_lint_agents_md_frontmatter_scope.py \
            tools/test_catalogue_curation_guard.py \
            tools/test_contract_parity.py \
            tools/test_marketplace_envelope_parity.py \
            tools/test_guide_authoring_standard.py \
            tools/test_release_check.py \
            tools/test_check_release_impact.py \
            tools/test_scaffold_projection.py \
            tools/test_conformance_portability.py \
            tools/test_lint_guides_no_repo_only_refs.py \
            tools/test_okf_pre_pr.py \
            tools/test_pack_test_compatibility.py \
            tools/test_pack_test_class_characterization.py -q

      # credbroker-user-scope T3: the build pipeline vendors credbroker to the
      # per-scope lib floor (.agentbundle/lib/) + the catalogue pack copy,
      # drift-gated. `make build-check` exercises the live drift gate, but the
      # projection / purity / no-op-absent / two-target-topology / contract /
      # pack-invariant tests run only here (make build-check runs no pytest).
      # Placed AFTER the [crypto] install so the floor-purity subprocess proves
      # the base import stays third-party-free under the STRONGER condition —
      # cryptography/argon2 importable but unreached (mirrors credbroker AC4).
      - name: pytest user-libs vendored floor (credbroker-user-scope T3)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/build_pipeline/test_user_libs_projection.py
          tests/build_pipeline/test_contract.py
          tests/integration/test_build_check_drift_gates.py
          tests/integration/test_credential_brokers_pack_install.py

      # cursor-full-parity (RFC-0026): the cursor adapter's unit suite lives in
      # the tests/build_pipeline root, which `make build-check` does not run. Wire it in
      # explicitly or it never gates (CI does not auto-discover package pytest).
      - name: pytest cursor adapter (cursor-full-parity)
        working-directory: packages/agentbundle
        run: python -m pytest tests/build_pipeline/test_adapter_cursor.py

      # gemini-full-parity (RFC-0027): the gemini adapter's unit suite lives in
      # the tests/build_pipeline root, which `make build-check` does not run. Wire it in
      # explicitly or it never gates (CI does not auto-discover package pytest).
      - name: pytest gemini adapter (gemini-full-parity)
        working-directory: packages/agentbundle
        run: python -m pytest tests/build_pipeline/test_adapter_gemini.py

      # architect-design-reviewer (RFC-0032): the design-reviewer subagent's
      # cross-adapter projection check (AC10's "fails if a future adapter change
      # drops it") and its rubric-parity guard (the verdict / severity /
      # mechanical-judgment vocabulary must stay identical across the agent and
      # architect-review) live in the tests/build_pipeline root, which `make build-check`
      # does not run. Wire them in explicitly or they never gate (CI does not
      # auto-discover package pytest).
      - name: pytest architect design-reviewer guards (RFC-0032)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          ../../tests/roster/test_architect_design_reviewer_projection.py
          ../../packs/architect/tests/pack/test_design_reviewer_rubric_parity.py

      # enriched-pack-manifest (RFC-0031): the manifest layer's contract +
      # construction tests live in the tests/{build_pipeline,unit,integration}
      # roots, which `make build-check` does not run. Wire them in explicitly or
      # they never gate (CI does not auto-discover package pytest) — the
      # projector mapping, the ≤5 cap, the soft-categories rail, the all-packs
      # enriched floor, and the @catalogue/pack identity invariant would
      # otherwise rot silently.
      - name: pytest enriched-pack-manifest (RFC-0031)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/build_pipeline/test_projectable_subset.py
          tests/build_pipeline/test_pack_schema.py
          tests/build_pipeline/test_plugin_manifest_schema.py
          tests/unit/test_validate_categories.py
          ../../tests/roster/test_enriched_pack_metadata.py
          tests/integration/test_list_packs_cmd.py

      # catalogue-wave4-semantic-contracts-index: live catalogue, public/bundled
      # schema parity, and shipped-guide projection are repository-owned claims.
      # They cannot live in the engine sdist, and CI does not auto-discover
      # roster tests, so keep their relocated acceptance suite explicit here.
      - name: pytest catalogue Wave 4 live contracts (roster-owned)
        run: python -m pytest tests/roster/test_catalogue_wave4_live_contracts.py

      # consolidated-pack-layout (RFC-0040): the installer _append_layout_section
      # construction tests (never-create / never-overwrite / injection-safe emit
      # incl. the table header / re-emit type-validation / per-scope write-jail /
      # symlink-fails-closed) live in tests/unit, which `make build-check` does not
      # run. Wire it in explicitly or it never gates (CI does not auto-discover
      # package pytest). The [pack.layout] schema + contract-version 0.16 assertions
      # for this change ride the test_pack_schema.py / test_contract.py steps above.
      - name: pytest consolidated-pack-layout installer append (RFC-0040)
        working-directory: packages/agentbundle
        run: python -m pytest tests/unit/test_append_layout_section.py

      # core work-loop activation hook (work-loop-activation-hook spec): the
      # kiro-ide-hook validate rail + real-pack projection + hook-body invocation
      # gate only here — make build-check / lint-packs / the make validate target
      # never run the rail against core, and CI does not auto-discover pytest.
      # The two drop-warning modules pin core's hook-wiring → kiro drop contract,
      # which this spec changed (work-loop-check.toml joins session-start.toml as
      # a dropped-for-kiro wiring); they were CI-ungated, so wire them too.
      - name: pytest kiro drop-warning contract
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/unit/test_install_event_dropped_wirings.py
          tests/unit/test_validate_hook_wiring_per_file_compatibility.py
      - name: pytest core work-loop activation hook (roster-owned)
        run: python -m pytest tests/roster/test_core_work_loop_hook.py

      # CLI-hygiene sweep (agentbundle-cli-hygiene spec): the shared confirm
      # helper, uninstall --dry-run/--yes/confirm, install --force confirm +
      # the install→upgrade offer, and the dropped --scope flags. The CLI
      # command suites are not otherwise CI-wired (CI does not auto-discover
      # package pytest), so the new preview/confirm behaviour would never gate
      # without this step.
      - name: pytest CLI-hygiene sweep (agentbundle-cli-hygiene)
        working-directory: packages/agentbundle
        run: >-
          python -m pytest
          tests/unit/test_confirm_helper.py
          tests/integration/test_uninstall_cmd.py
          tests/integration/test_install_upgrade_offer.py
          tests/unit/test_install_inband_detection.py
          tests/unit/test_cli_scope_flags.py
          tests/integration/test_reconcile.py
          tests/unit/test_list_targets_cmd.py
      - name: converters source-attribution scrub (AC2)
        run: |
          # rg exits 0 with hits, 1 with no matches, ≥2 on error
          # (invalid pattern, missing path, IO error). Explicitly
          # distinguish so an error-class exit fails CI rather than
          # silently passing as a no-match.
          [ -d packs/converters ] || { echo "::error::packs/converters/ missing"; exit 1; }
          rc=0
          out=$(rg -i --hidden '\bdropkit\b' packs/converters/) || rc=$?
          case "$rc" in
            0)
              first=$(printf '%s\n' "$out" | head -n1)
              echo "::error::source-catalogue attribution leak in packs/converters/: ${first}"
              exit 1 ;;
            1) ;;
            *)
              echo "::error::rg failed in scrub step (exit $rc)"
              exit 1 ;;
          esac
      - name: converters Rail-C marker scrub (AC3)
        run: |
          [ -d packs/converters ] || { echo "::error::packs/converters/ missing"; exit 1; }
          rc=0
          out=$(rg --hidden '<adapt:[A-Z_][A-Z0-9_]*>|<adapt:[a-z][a-z0-9-]*>' packs/converters/) || rc=$?
          case "$rc" in
            0)
              first=$(printf '%s\n' "$out" | head -n1)
              echo "::error::<adapt:...> marker found in packs/converters/ (user-scope packs forbid markers): ${first}"
              exit 1 ;;
            1) ;;
            *)
              echo "::error::rg failed in Rail-C step (exit $rc)"
              exit 1 ;;
          esac
      - name: converters evals.json carry-over disposition (AC4 + AC4a)
        run: |
          # Pin the spec's skill disposition mechanically:
          # file-to-markdown, markdown-to-html, and the three Markdown→Office
          # skills (markdown-to-docx/-pptx/-xlsx, RFC-0036) ship evals.json;
          # msg-to-markdown must NOT (converters spec § Never do: "No
          # synthesised evals/evals.json for msg-to-markdown"). Enumerated
          # rather than glob-iterated so a future skill addition can't
          # silently change the contract.
          for skill in file-to-markdown markdown-to-html markdown-to-docx markdown-to-pptx markdown-to-xlsx; do
            f="packs/converters/.apm/skills/${skill}/evals/evals.json"
            if [ ! -f "$f" ]; then
              echo "::error::AC4: ${f} missing (carry-over disposition)"
              exit 1
            fi
            python3 -c "import json, sys; p = sys.argv[1]; d = json.load(open(p)); assert 'skill_name' in d and 'evals' in d, f'{p} missing canonical keys'" "$f"
          done
          if [ -e packs/converters/.apm/skills/msg-to-markdown/evals ]; then
            echo "::error::AC4: msg-to-markdown/evals/ exists; spec forbids synthesised evals for this skill"
            exit 1
          fi

      # skill-script-exit-2-collision: keep the converter entry-point contract
      # suites explicit because pack skill tests are not auto-discovered.
      # Separate invocations here are the default boundary lint-pack-test-boundary.py
      # enforces: a suite runs alone unless it is named in a declared
      # compatibility class (tools/pack_test_compatibility.py, ADR-0098). These
      # two converter suites ARE in one such class, and `make test` groups them —
      # but each needs its own working-directory for the installed entry-point
      # contract, so this leg keeps them apart. A class permits grouping; it does
      # not oblige every runner to group.
      - name: pytest markdown-to-html installed entry-point contract
        working-directory: packs/converters/tests/skills/markdown-to-html
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider -q
      - name: pytest mermaid-renderer installed entry-point contract
        working-directory: packs/converters/tests/skills/mermaid-renderer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider -q

      # markdown-to-office-publishing (RFC-0036): the three Markdown→Office
      # render skills carry TDD suites under packs/converters/tests/skills/<skill>/ (ADR-0071), which neither
      # `make build-check` nor any package pytest discovers. Wire each in
      # explicitly or its renderer (manifest enumeration, content mapping,
      # --check probe, output-path confinement, autoescape, chart survival, the
      # per-format end-to-end render) never gates. Each Tier-1 render library is
      # pip-installed first (these libraries are user-installed at runtime, not
      # bundled), mirroring the atlassian httpx install above.
      # Pinned to exact known-good versions so the gated artifact is
      # reproducible (docxtpl's get_undeclared_template_variables() has had
      # version-specific breakage — see plan § Risks). The SKILL.md prereqs
      # keep the `>=floor` guidance for users; CI pins what it actually tested.
      - name: pip install the Markdown→Office render libraries (RFC-0036)
        run: pip install 'python-pptx==1.0.2' 'docxtpl==0.20.2' 'openpyxl==3.1.5' 'python-docx==1.2.0'
      - name: pytest markdown-to-pptx renderer (markdown-to-office-publishing)
        working-directory: packs/converters/tests/skills/markdown-to-pptx
        run: python -m pytest test_render.py
      - name: pytest markdown-to-docx renderer (markdown-to-office-publishing)
        working-directory: packs/converters/tests/skills/markdown-to-docx
        run: python -m pytest test_render.py
      - name: pytest markdown-to-xlsx renderer (markdown-to-office-publishing)
        working-directory: packs/converters/tests/skills/markdown-to-xlsx
        run: python -m pytest test_render.py

      # file-to-markdown skill scripts (extraction-tier0-and-output-contract):
      # the shared output-contract builder, the defensive-parsing helpers, the
      # tiered dispatch + Tier-0 extractors, and the image-branch reconciler.
      # CI does not auto-discover skill-script pytest, so wire them explicitly
      # or the contract / no-ML-floor / defensive-parsing behaviour never gates.
      # pypdf is the Tier-0 PDF library (pip-on-demand at runtime, pinned here);
      # the Office libraries installed above cover the docx/xlsx/pptx lib paths.
      - name: pip install the Tier-0 PDF library (extraction-tier0)
        run: pip install 'pypdf==5.1.0'
      - name: pytest file-to-markdown extraction (extraction-tier0-and-output-contract)
        working-directory: packs/converters/tests/skills/file-to-markdown
        # test_convert.py importorskips the Office libraries in-function; they come
        # from the RFC-0036 install above, not from this step's own pip line. Probe
        # them here so a future step reorder fails loudly instead of skipping green.
        run: |
          python -c "import docx, openpyxl, pptx, PIL.Image"
          python -m pytest test_contract.py test_safe_io.py test_convert.py test_reconcile.py

      # msg-to-markdown skill scripts (extraction-msg-to-markdown-python-contract):
      # the vendored-builder drift guard, the .msg (olefile + hand-rolled MAPI)
      # and .eml converters, the untrusted-input security wrap, and the parity
      # cross-check. olefile is the Tier-0 .msg reader (pip-on-demand at runtime,
      # pinned here — ADR-0046). CI does not auto-discover skill-script pytest.
      - name: pip install the Tier-0 .msg reader (extraction-msg olefile, ADR-0046)
        # Exact pin for CI reproducibility; the runtime hint floor is olefile>=0.47.
        run: pip install 'olefile==0.47'
      - name: pytest msg-to-markdown extraction (extraction-msg-to-markdown-python-contract)
        working-directory: packs/converters/tests/skills/msg-to-markdown
        run: python -m pytest test_drift.py test_convert.py test_security.py test_parity.py
      - name: catalogue-curation guard lint + self-test (RFC-0059 D6)
        # RFC-0059: the catalogue-curation skills must never change this repo's
        # agentbundle engine behaviour or credential-brokers. Two honest layers:
        # a presence lint (every skill carries its scoped refusal clause) and a
        # path-gate (a changeset touching packages/agentbundle/** behavioural code
        # or packs/credential-brokers/** fails without the 'Engine-Change-RFC:'
        # exemption trailer; build/recipes/** is carved out as config). The
        # self-test proves the pure logic; the lint scans the tree + diff. Python,
        # invoked directly (not via bash), so the same step works on Windows.
        run: |
          python3 tools/test-lint-catalogue-curation-guard.py
          python3 tools/lint-catalogue-curation-guard.py --root . --base origin/main
      - name: catalogue-curation skill-script tests (RFC-0059 security ACs)
        # The deterministic helpers behind the catalogue-curation skills:
        # SSRF allowlist + write-jail (assimilate-primitive), the resumable
        # ledger (assimilate-repo). Pure-stdlib pytest; run from each test dir so
        # the conftest puts the skill's scripts/ on sys.path (agentbundle is on
        # the path for write_jail).
        #
        # These invocations are directory-scoped with no filenames, so a suite
        # that fails to land reduces the collected count and the step still exits
        # 0 — assert a floor. PYTHONDONTWRITEBYTECODE + -p no:cacheprovider are
        # retained with a new reason: the tests no longer sit under .apm/, so the
        # self-host drift gate is no longer what they protect. They keep a CI
        # runner from leaving caches in the checkout at all — belt to the braces
        # of agentbundle 0.29.5, which prunes them from the archive walk.
        # export-catalogue removed in 0.2.0 (superseded by agentbundle catalogue
        # init --preset self-hosted).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Subshell body, so `cd` is scoped to the call and the caller's cwd is
          # untouched. `|| n=0` rather than `... || true` inside the substitution:
          # grep exits 1 on no match, and the A && B || C form would also swallow
          # a failed `cd`, leaving `n` empty and the comparison broken.
          run_with_floor() (
            dir=$1; floor=$2
            cd "$dir" || exit 1
            n=$(python -m pytest -q -p no:cacheprovider --collect-only | grep -c '::') || n=0
            if [ "$n" -lt "$floor" ]; then
              echo "::error::$dir collected $n tests, expected at least $floor — did a suite fail to land?"
              exit 1
            fi
            python -m pytest -q -p no:cacheprovider
          )
          run_with_floor packs/catalogue-curation/tests/skills/assimilate-primitive 30
          run_with_floor packs/catalogue-curation/tests/skills/assimilate-repo 7
      - name: experience framework-agnosticism lint + self-test (design-craft-pack AC8)
        # RFC-0033: the experience pack (renamed from design-craft, ADR-0038)
        # ships portable design method, never a stack or a values table. The
        # self-test proves the linter catches a planted stack token /
        # values-table shape; the lint then scans the shipped pack and fails the
        # build on any real leak. Python, invoked directly (not via bash), so
        # the same step works on the Windows runner. The (design-craft-pack AC8)
        # tag stays pinned — it cites the frozen design-craft-pack spec's AC8
        # that mandated this lint; there is no `experience` spec equivalent.
        run: |
          python3 tools/test-lint-experience-agnostic.py
          python3 tools/lint-experience-agnostic.py
      - name: pack description drift backstop + self-test
        # A pack's `[pack].description` is display copy — what a person reads in
        # a listing while deciding whether to install. The quality bar is
        # catalogue-authoring-standards.md § 2; this lint is only a runaway-drift
        # backstop (a long description is not necessarily a bad one, and a short
        # one is not necessarily good). Deliberately separate from the
        # per-target `description-max-length` in contracts/target-vocab.toml,
        # which caps skill/agent frontmatter: that text is read by the model to
        # decide activation, and shortening it degrades activation. The lint
        # lives in tools/ rather than in the agentbundle package because both
        # pack.schema.json and lint_packs run against *adopter* catalogues, and
        # a house-style rule there would become a third party's build break.
        # Python, invoked directly (not via bash), so the same step works on
        # the Windows runner.
        run: |
          python3 tools/test-lint-pack-descriptions.py
          python3 tools/lint-pack-descriptions.py
          python3 tools/test-lint-pack-maintainer-emails.py
          python3 tools/lint-pack-maintainer-emails.py

  gate-sast:
    name: gate-sast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history so the relevance diff below reaches the PR's merge-base.
          fetch-depth: 0
          # AC12: the token must not persist into .git/config. zizmor's
          # `artipacked` audit ranks below this repo's --min-severity high,
          # so AC13's posture test is the only thing asserting it.
          persist-credentials: false
      - name: Set up Python (gate-sast)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install SAST/SCA tools
        # `make build-check` chains `make sast` (ADR-0017), which needs Bandit,
        # pip-audit, and Semgrep on PATH. Install before invoking make so the
        # dogfooded SAST gate is reachable. The shipped packages stay
        # dependency-free; these are CI-only dev tools.
        #
        # UNCONDITIONAL, deliberately (AC4). It used to be gated on the relevance
        # predicate, but a cross-job `steps.*` reference evaluates EMPTY rather than
        # erroring — so `'' != 'true'` is true and a conditional install in a job
        # that no longer hosts the detect step would silently provision nothing.
        # Installing always leaves the predicate exactly ONE consumer: the
        # `Run make sast` step below. The posture test asserts this step carries no
        # `if:`, and ~11s of install on a job that always runs is the price.
        run: pip install -r tools/requirements-sast.txt
      - name: Detect whether SAST-relevant files changed
        id: changes
        if: github.event_name == 'pull_request'
        env:
          # Never do: no ${{ }} inside a run: body this change writes or moves.
          # Passed as env so the values are data, not spliced command text.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          dirs=$(make -s print-sast-dirs) || {
            echo "::warning::Could not read SAST_DIRS from Makefile — running SAST (fail-closed)."
            echo "skip_sast=false" >> "$GITHUB_OUTPUT"; exit 0; }
          cfg=$(make -s print-sast-config) || {
            echo "::warning::Could not read SAST_CONFIG from Makefile — running SAST (fail-closed)."
            echo "skip_sast=false" >> "$GITHUB_OUTPUT"; exit 0; }
          changed=$(git diff --name-only "$base"..."$head") || {
            echo "::warning::Could not compute changed files — running SAST (fail-closed)."
            echo "skip_sast=false" >> "$GITHUB_OUTPUT"; exit 0; }
          dir_pat="^($(echo "$dirs" | tr ' ' '|'))/"
          run=false
          # Any file under a scanned dir → SAST is relevant.
          if printf '%s\n' "$changed" | grep -qE "$dir_pat"; then run=true; fi
          # Any edit to the gate's config/CI surface → SAST must run so the
          # change is validated by the gate it changes. Whole-line fixed-string
          # match (paths contain regex metachars like '.').
          for c in $cfg; do
            if printf '%s\n' "$changed" | grep -qxF "$c"; then run=true; fi
          done
          if [ "$run" = true ]; then
            echo "skip_sast=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sast=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No SAST-relevant files changed (dirs: [$dirs]; config: [$cfg]) — skipping SAST/SCA gate."
          fi
      - name: Run make sast
        # AC4: the predicate has exactly ONE consumer — this step. The scanner
        # install above is unconditional, because a cross-job `steps.*` reference
        # evaluates EMPTY rather than erroring, so `'' != 'true'` is true and a
        # conditional install in another job would silently provision nothing.
        if: steps.changes.outputs.skip_sast != 'true'
        run: make sast

  gate-export-boundary:
    name: gate-export-boundary
    runs-on: ubuntu-latest
    # RFC-0082: the real sdist gate permits 120 seconds for collection plus 900
    # for execution, and must report its own fail-closed timeout before Actions
    # terminates the surrounding job. This comment travels with the gate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history for parity with the other jobs; and NO sparse-checkout — the suite's three real-artifact tests skipif on packages/agentbundle being a directory, so a narrowed checkout makes this 150s gate exit 0 having verified nothing (AC14(2)).
          fetch-depth: 0
          # AC12: the token must not persist into .git/config. zizmor's
          # `artipacked` audit ranks below this repo's --min-severity high,
          # so AC13's posture test is the only thing asserting it.
          persist-credentials: false
      - name: Set up Python (gate-export-boundary)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install tools dependencies (gate-export-boundary)
        # `make build-check` chains `tools/hooks/pre-pr.py` and
        # `tools/catalogue/pre_pr_catalogue.py`. Install tools/requirements.txt
        # before invoking make so the projected-artifact lint surface is reachable in CI.
        run: pip install -r tools/requirements.txt
      - name: Install agentbundle (editable) + pytest (gate-export-boundary)
        # Bare pytest, not the editable agentbundle: the suite imports no
        # agentbundle and _DEPENDENCY_IMPORTS does not list it — it BUILDS the package
        # via subprocess, which needs the source tree (present), not an install. If
        # CI proves otherwise, add it back AND to AC1's manifest with that reason.
        run: python -m pip install pytest
      - name: Install credbroker (editable, with crypto extra) (gate-export-boundary)
        # Installing the [crypto] extra verifies it resolves (spec credbroker AC1)
        # AND runs the stdlib-purity gate under the *stronger* condition — with
        # cryptography/argon2 present, the subprocess still proves the base
        # import never reaches them (credbroker AC4). The vault tests that need
        # the extra arrive with task T4.
        run: python -m pip install -e './packages/credbroker[crypto]'

      # RFC-0082's export-boundary gate runs in release-agentbundle.yml, so
      # nothing here would catch it regressing to always-exit-0. make
      # build-check runs no pytest — wire its tests explicitly. This follows
      # the credbroker install because the extracted sdist suite preflights it.
      - name: pytest export-boundary gate
        # AC14(2). tools/check-artifact-contents.py declares
        # _DEPENDENCY_IMPORTS = ("pytest", "yaml", "jsonschema", "credbroker") and
        # RAISES on a miss, so the module direction is already fail-closed. What is
        # NOT is the tree shape: all three real-artifact tests skipif on
        # packages/agentbundle being a directory, with reason "engine package not
        # present" — which matches no dependency-token pattern. So assert the tree
        # and assert ZERO skips, reason-agnostically.
        run: |
          set -euo pipefail
          test -d packages/agentbundle
          python -m pytest tools/test_check_artifact_contents.py -q -rs 2>&1 | tee "$RUNNER_TEMP/out.txt"
          ! grep -Eq "^SKIPPED" "$RUNNER_TEMP/out.txt"

  gate-credbroker:
    name: gate-credbroker
    runs-on: ubuntu-latest
    # 10 minutes: one checkout, one interpreter, one editable install, and a 27s
    # suite. Generous by a wide margin and deliberately not tuned to the timing
    # measurement — if a cold runner ever exceeds it the job fails closed, which
    # the aggregator reports.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # NO fetch-depth: 0, unlike the other three work jobs. packages/credbroker
          # invokes git nowhere, so full history buys nothing and costs clone time
          # against this job's budget. Same carve-out the aggregator carries below,
          # and for the same reason. PINNED_CHECKOUT_WITH compares this mapping by
          # SET EQUALITY, so re-adding fetch-depth here fails the posture test —
          # which is the point: it is decided once, here (spec AC1a).
          persist-credentials: false
      - name: Set up Python (gate-credbroker)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install credbroker (editable, with crypto extra) + pytest (gate-credbroker)
        # The whole provisioning need for this job: the suite imports only stdlib,
        # pytest, credbroker, and cryptography/argon2 from the [crypto] extra. No
        # tools/requirements.txt, no editable agentbundle, no httpx.
        run: python -m pip install -e './packages/credbroker[crypto]' pytest

      - name: pytest credbroker (RFC-0023 Phase 1)
        working-directory: packages/credbroker
        # TWO controls, because they fail on different things (spec AC4).
        #
        # The probe names the precondition and diagnoses fast: `pip install -e
        # '.[typo]'` WARNS and exits 0, so a renamed or dropped extra would
        # otherwise turn 21 test_vault.py tests (module-scope importorskip) plus 11
        # @requires_crypto cases into silent skips behind a green job — the
        # encryption-at-rest and master-derivation surface. It deliberately omits
        # `credbroker`: under this working-directory the package resolves from the
        # source tree whether or not the install ran, so that term could not fail.
        #
        # The `^SKIPPED` assertion is reason-agnostic and catches a shrunken
        # collection whose cause nobody anticipated. Same pair as the
        # export-boundary gate below. TWO KNOWN NON-CRYPTO TRIGGERS, so a
        # cross-domain red is self-diagnosing rather than inviting the edit the
        # spec's Never-do forbids:
        #   1. .agentbundle/bin/sso-broker.py stops being tracked — it is a
        #      projected artifact under the self-host drift gate, so gate-main
        #      reddens too;
        #   2. a new module-scope importorskip lands in the suite.
        # Do NOT narrow this grep to specific skip reasons, and do not remove
        # either control: nothing else enforces them (see spec § Never do).
        #
        # Tee target is job-distinct (credbroker-out.txt) so this step shares no
        # literal with the fixture mutations that rewrite the first occurrence of
        # the export-boundary pair.
        run: |
          set -euo pipefail
          python -c "import cryptography, argon2"
          python -m pytest -rs 2>&1 | tee "$RUNNER_TEMP/credbroker-out.txt"
          ! grep -Eq "^SKIPPED" "$RUNNER_TEMP/credbroker-out.txt"

  build-check:
    name: make build-check
    # AC3: the aggregator. It follows the shape already running in
    # build-check-windows.yml — one env var per dependency, one inline
    # `!= "success"` test each — with two strengthenings that precedent lacks:
    # the guard runs HERE (not only via build_gate_chain.py inside gate-main,
    # which is the far side of the edge it protects), and each comparison
    # carries its consequent on the same statement.
    #
    # It is NOT the only thing gating this workflow: branch protection requires
    # gate-main, gate-sast and gate-export-boundary by name (AC2, applied
    # post-merge), so an unwired or deleted job blocks the PR regardless of what
    # this job reports.
    needs:
      - gate-main
      - gate-sast
      - gate-export-boundary
      - gate-credbroker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # AC12 exempts this job from fetch-depth: 0 — it runs one stdlib script
          # that parses one workflow file and touches no history.
          persist-credentials: false
      - name: Set up Python (aggregator)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Two steps, not one, so each can carry an HONEST lint-ci-parity disposition:
      # the posture test IS covered locally (build_gate_chain.py runs it under
      # `make build-check`), while consulting needs.*.result has no local
      # counterpart in any target — the residual AC16 names. One merged step would
      # have forced a disposition that was half false either way.
      - name: Run the build-check.yml posture test
        run: |
          set -euo pipefail
          python3 tools/test-build-check-workflow.py
      - name: Require every gate
        env:
          GATE_MAIN_RESULT: ${{ needs.gate-main.result }}
          GATE_SAST_RESULT: ${{ needs.gate-sast.result }}
          GATE_EXPORT_BOUNDARY_RESULT: ${{ needs.gate-export-boundary.result }}
          GATE_CREDBROKER_RESULT: ${{ needs.gate-credbroker.result }}
        run: |
          set -euo pipefail
          [ "$GATE_MAIN_RESULT" != "success" ] && echo "::error::gate-main reported $GATE_MAIN_RESULT" && exit 1
          [ "$GATE_SAST_RESULT" != "success" ] && echo "::error::gate-sast reported $GATE_SAST_RESULT" && exit 1
          [ "$GATE_EXPORT_BOUNDARY_RESULT" != "success" ] && echo "::error::gate-export-boundary reported $GATE_EXPORT_BOUNDARY_RESULT" && exit 1
          [ "$GATE_CREDBROKER_RESULT" != "success" ] && echo "::error::gate-credbroker reported $GATE_CREDBROKER_RESULT" && exit 1
          echo "every gate passed"
