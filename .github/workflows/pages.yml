name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs-site/**'
      - 'guides/**'
      - 'docs/product/changelog.md'
      - 'CONTRIBUTING.md'
      - 'packs/**/README.md'
      - 'tools/build-site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs-site/**'
      - 'guides/**'
      - 'docs/product/changelog.md'
      - 'CONTRIBUTING.md'
      - 'packs/**/README.md'
      - 'tools/build-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment; cancel in-flight runs on new push.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision-date plugin

      # ── Astro marketing site FIRST (RFC-0061) ───────────────────────────
      # `astro build` cleans its outDir (build/) on every run, so it must run
      # BEFORE the `docs-site/` Starlight build writes into build/docs/.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Sync pack journeys
        run: python tools/build-site.py --journeys-only

      - name: Build Astro marketing site
        run: npm run build --prefix web  # writes build/ at repo root
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      # ── Starlight reference docs SECOND — writes into build/docs/ ──────────
      # Build order is load-bearing: web/ Astro build (above) cleans build/
      # on every run, so it MUST run before docs-site/ writes into build/docs/.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: npm ci --prefix docs-site

      - name: Aggregate content
        run: python tools/build-site.py

      - name: Build docs site
        run: npm run build --prefix docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
