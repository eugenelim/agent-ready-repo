name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs-site/**'
      - 'guides/**'
      - 'site.toml'
      - 'guide-nav-baseline.toml'
      - 'docs/product/changelog.md'
      - 'CONTRIBUTING.md'
      - 'packs/**/README.md'
      # Scope changes flip whether a pack may advertise the Claude-plugin
      # route, so the site must rebuild and re-assert on them too.
      - 'packs/**/pack.toml'
      - 'tools/build-site.py'
      # The offer assertion and the scope mirror it reads. Without these an
      # edit that disables the check triggers no run at all.
      - 'tools/check-site-plugin-offers.py'
      - 'tools/check-rendered-site-links.py'
      - 'tools/test_check_rendered_site_links.py'
      - 'tools/pack_scope.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs-site/**'
      - 'guides/**'
      - 'site.toml'
      - 'guide-nav-baseline.toml'
      - 'docs/product/changelog.md'
      - 'CONTRIBUTING.md'
      - 'packs/**/README.md'
      # Scope changes flip whether a pack may advertise the Claude-plugin
      # route, so the site must rebuild and re-assert on them too.
      - 'packs/**/pack.toml'
      - 'tools/build-site.py'
      # The offer assertion and the scope mirror it reads. Without these an
      # edit that disables the check triggers no run at all.
      - 'tools/check-site-plugin-offers.py'
      - 'tools/check-rendered-site-links.py'
      - 'tools/test_check_rendered_site_links.py'
      - 'tools/pack_scope.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment; cancel in-flight runs on new push.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # full history for git-revision-date plugin

      # ── Astro marketing site FIRST (RFC-0061) ───────────────────────────
      # `astro build` cleans its outDir (build/) on every run, so it must run
      # BEFORE the `docs-site/` Starlight build writes into build/docs/.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      # Projects BOTH marketing-renderer inputs, despite the flag's name: the
      # pack journeys under web/src/content/journeys/ and the released-highlight
      # payload web/src/lib/now-highlights.generated.json that /now/ renders.
      # Ordering is load-bearing — this must precede the Astro build below, and
      # the full `build-site.py` pass runs only after it.
      - name: Project marketing renderer inputs (journeys + released highlights)
        run: python tools/build-site.py --journeys-only

      - name: Build Astro marketing site
        run: npm run build --prefix web  # writes build/ at repo root
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      # Built-output half of the Claude-plugin route gate. The consistency half
      # (site frontmatter vs pack.toml) runs in the required `make build-check`
      # job; this half needs an Astro build, and putting Node in that job would
      # make every PR in the repo wait on `npm ci` — see
      # docs/specs/claude-plugin-route-scope AC8 for the decision and its
      # accepted residual (this check is non-blocking).
      - name: Assert the plugin route is offered only where it applies
        run: python3 tools/check-site-plugin-offers.py --build-dir build

      # ── Starlight reference docs SECOND — writes into build/docs/ ──────────
      # Build order is load-bearing: web/ Astro build (above) cleans build/
      # on every run, so it MUST run before docs-site/ writes into build/docs/.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: npm ci --prefix docs-site

      # spec/docs-site-build-contract-hardening AC7. The rehype plugin's focused
      # suite, after the docs deps install (it imports the plugin's declared runtime
      # dependency) and before the artifact upload, so a failure blocks the deploy.
      # Node's built-in runner under the engines floor docs-site/package.json
      # declares — no test dependency is added. pages.yml is not a required MERGE
      # context, so this gates deployment, not merge; the required workflow carries
      # no Node and must carry no paths: filter, so the suite cannot live there.
      - name: Plugin unit tests
        run: npm run test:plugins --prefix docs-site

      - name: Aggregate content
        run: python tools/build-site.py

      - name: Build docs site
        run: npm run build --prefix docs-site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Check rendered internal links
        run: python3 tools/check-rendered-site-links.py --build-dir build

      # Rendered-output assertions (single <h1> per page, summary reaches the
      # page as meta description + deck, every table in a focusable scroll
      # region, one primary hero CTA, labelled footer columns). They read
      # build/, so this is the only job in the repo where they can run — and
      # without them the tech-site-polish-batch defects regress silently.
      - name: Assert rendered-output invariants
        run: npm test --prefix web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: ./build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
