name: build-check-windows

# Native-Windows parity job for the Phase-3 bash→Python port (PR #71).
# Split out of build-check.yml so it can skip doc-only changes that don't
# exercise Python-script portability — the whole reason this job exists.
#
# Why a separate file rather than a job-level filter: GitHub `paths`/
# `paths-ignore` filters are workflow-level, not per-job. Adding the
# filter to build-check.yml would also gate its Linux `make build-check`
# job, which is the required status check on main — a doc-only PR would
# then block forever on a required check that never reports.
#
# What `paths-ignore: docs/**` skips: the per-instance governance docs
# (RFCs, specs/plans, ADRs, guides) and the projected doc copies
# (CHARTER/CONVENTIONS/product/architecture). None of those change how
# the Python build/lint/test scripts behave on Windows. Source edits to
# skills, agents, and seeds live under `packs/` — not `docs/` — so they
# still trigger this job. And the Linux `make build-check` job remains
# unfiltered and authoritative, so any projected-doc drift is still
# caught there.

# The Windows compat suite is driven by a single command:
#
#   agentbundle catalogue self-host --check --windows --root .
#
# That command encapsulates the bundler build, the self-host drift gates,
# and the AgentBundle/pack path-sensitive and encoding-sensitive pytest suite
# that this job exists to verify. The canonical test list lives in
# agentbundle/catalogue_tooling/self_host_windows.py — edit it there,
# not here — so adding a new Windows-specific test requires only a Python
# change, not a YAML edit.
#
# CredBroker's package suite runs in its own parallel Windows job below. Keep it
# separate so a slow package suite cannot consume the AgentBundle compatibility
# job's wall-clock budget, and so failures name their owning package directly.
#
# Core agentbundle verify tasks (the full pytest suite in build-check.yml)
# remain Linux-only and are not duplicated here.
# Paths-ignore note: `.github/**` is intentionally NOT listed so an edit to
# any workflow (including this one) still triggers the job that validates it.
# The Linux build-check.yml job remains unfiltered — it is the required status
# check on main and must never be gated.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Makefile"
      - "*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Makefile"
      - "*.md"

jobs:
  agentbundle-windows:
    name: AgentBundle compatibility (windows)
    runs-on: windows-latest
    # Dependency setup plus the remaining 15 sequential portability stages can
    # exceed the old 10-minute ceiling on a cold runner. CredBroker's package
    # suite is split below, so 15 minutes remains a bounded compatibility budget.
    timeout-minutes: 15
    env:
      # Force UTF-8 for stdio. Windows Python defaults to cp1252,
      # which can't encode the `✓`/`✖` glyphs the lint and pre-pr
      # scripts emit, nor decode their stderr when pytest reads it
      # via subprocess. PYTHONUTF8=1 enables Python 3.7+'s UTF-8
      # mode (text I/O default is UTF-8 regardless of locale);
      # PYTHONIOENCODING is a belt-and-braces for any path that
      # bypasses the UTF-8-mode default.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            tools/requirements.txt
            packages/agentbundle/pyproject.toml
            packages/credbroker/pyproject.toml

      - name: Install dependencies
        # agentbundle is installed editable so `agentbundle catalogue self-host
        # --check --windows` resolves. credbroker + httpx are required by the
        # atlassian SSO suites that the Windows compat suite drives.
        run: |
          python -m pip install -e packages/agentbundle/ pytest -r tools/requirements.txt
          python -m pip install -e ./packages/credbroker "httpx>=0.27"

      - name: Windows compat build-check
        # Drives agentbundle/catalogue_tooling/self_host_windows.py:
        # catalogue build → self-host drift check → path-sensitive pytest suite
        # → experience lint → pre-pr aggregator. Stops on first failure.
        run: agentbundle catalogue self-host --check --windows --root .

  credbroker-tests-windows:
    name: pytest credbroker (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: packages/credbroker/pyproject.toml

      - name: Install CredBroker test dependencies
        run: python -m pip install -e packages/credbroker pytest

      - name: Run CredBroker suite
        working-directory: packages/credbroker
        run: python -m pytest

  build-check-windows:
    name: make build-check (windows)
    if: ${{ always() }}
    needs:
      - agentbundle-windows
      - credbroker-tests-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Windows suites
        env:
          AGENTBUNDLE_RESULT: ${{ needs.agentbundle-windows.result }}
          CREDBROKER_RESULT: ${{ needs.credbroker-tests-windows.result }}
        run: |
          if [ "$AGENTBUNDLE_RESULT" != "success" ] || [ "$CREDBROKER_RESULT" != "success" ]; then
            echo "Windows suites failed: agentbundle=$AGENTBUNDLE_RESULT credbroker=$CREDBROKER_RESULT" >&2
            exit 1
          fi
          echo "Windows suites passed"
