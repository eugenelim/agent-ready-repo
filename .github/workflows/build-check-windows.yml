name: build-check-windows

# Native-Windows parity job for the Phase-3 bash→Python port (PR #71).
# Split out of build-check.yml so it can skip doc-only changes that don't
# exercise Python-script portability — the whole reason this job exists.
#
# Why a separate file rather than a job-level filter: GitHub `paths`/
# `paths-ignore` filters are workflow-level, not per-job. Adding the
# filter to build-check.yml would also gate its Linux `make build-check`
# job, which is the required status check on main — a doc-only PR would
# then block forever on a required check that never reports.
#
# What `paths-ignore: docs/**` skips: the per-instance governance docs
# (RFCs, specs/plans, ADRs, guides) and the projected doc copies
# (CHARTER/docs-map/product/architecture). None of those change how
# the Python build/lint/test scripts behave on Windows. Source edits to
# skills, agents, and seeds live under `packs/` — not `docs/` — so they
# still trigger this job. And the Linux `make build-check` job remains
# unfiltered and authoritative, so any projected-doc drift is still
# caught there.

# The Windows compat suite is driven by a single command:
#
#   agentbundle catalogue self-host --check --windows --root .
#
# That command encapsulates the bundler build, the self-host drift gates,
# and the AgentBundle/pack path-sensitive and encoding-sensitive pytest suite
# that this job exists to verify. The canonical test list lives in
# agentbundle/catalogue_tooling/self_host_windows.py. Pack-owned portability
# tests remain explicit workflow steps so they do not widen the shipped CLI.
#
# CredBroker's package suite runs in its own parallel Windows job below. Keep it
# separate so a slow package suite cannot consume the AgentBundle compatibility
# job's wall-clock budget, and so failures name their owning package directly.
#
# Core agentbundle verify tasks (the full pytest suite in build-check.yml)
# remain Linux-only and are not duplicated here.
# Paths-ignore note: `.github/**` is intentionally NOT listed so an edit to
# any workflow (including this one) still triggers the job that validates it.
# The Linux build-check.yml job remains unfiltered — it is the required status
# check on main and must never be gated.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Makefile"
      - "*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Makefile"
      - "*.md"

# Every job only checks out source and runs tests. setup-python's cache uses the
# Actions runtime token, not this repository token; no artifact, check, PR, or
# repository write is performed.
permissions:
  contents: read

jobs:
  agentbundle-windows:
    name: AgentBundle compatibility (windows)
    runs-on: windows-latest
    # Dependency setup plus the remaining 16 sequential portability stages can
    # exceed the old 10-minute ceiling on a cold runner. CredBroker's package
    # suite is split below, so 15 minutes remains a bounded compatibility budget.
    timeout-minutes: 15
    env:
      # Force UTF-8 for stdio. Windows Python defaults to cp1252,
      # which can't encode the `✓`/`✖` glyphs the lint and pre-pr
      # scripts emit, nor decode their stderr when pytest reads it
      # via subprocess. PYTHONUTF8=1 enables Python 3.7+'s UTF-8
      # mode (text I/O default is UTF-8 regardless of locale);
      # PYTHONIOENCODING is a belt-and-braces for any path that
      # bypasses the UTF-8-mode default.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            tools/requirements.txt
            packages/agentbundle/pyproject.toml
            packages/credbroker/pyproject.toml

      - name: Install dependencies
        # agentbundle is installed editable so `agentbundle catalogue self-host
        # --check --windows` resolves. credbroker + httpx are required by the
        # atlassian SSO suites that the Windows compat suite drives.
        run: |
          python -m pip install -e ./packages/credbroker -e packages/agentbundle/ pytest -r tools/requirements.txt
          python -m pip install -e ./packages/credbroker "httpx>=0.27"

      - name: Windows compat build-check
        # Drives agentbundle/catalogue_tooling/self_host_windows.py:
        # catalogue build → self-host drift check → path-sensitive pytest suite
        # → experience lint → pre-pr aggregator → okf compiler checks. Stops on
        # first failure.
        run: agentbundle catalogue self-host --check --windows --root .

      - name: pytest installed-skill supervisor run (Windows)
        # The synthetic full code run through the installed work-loop skill, under
        # `python -I -S` with an import fence: it must reach readiness on Windows
        # with only the standard library and the skill's scripts directory.
        run: python -m pytest tests/roster/test_supervisor_installed_skill_run.py -q --durations=10

      - name: pytest repository-grounding locator reader (Windows placement)
        # Verifies that the locator reader's placement rules, drive-letter URI
        # handling, and reparse-point refusal execute correctly on Windows.
        # The whole suite is run by make test; this step covers test_read_locator.py
        # on pull requests so Windows-specific paths are not CI-only.
        run: python -m pytest packs/core/tests/skills/repository-grounding/test_read_locator.py -q

      - name: pytest safe-process Job Object launch (Windows)
        # The Windows launch path: suspended creation, a breakaway-denied
        # kill-on-close Job Object, a standard-streams-only handle list, and
        # job termination on timeout.
        run: python -m pytest packs/core/tests/skills/work-loop/test_process_safety_windows.py -q -rs --durations=10

      - name: pytest confined writes on a real Windows host (path-checked mode)
        # Gating: the module runs unpatched on NTFS with real junctions and hard
        # links. New directories need short names for the alias case, so the
        # volume holding the runner temp directory has 8.3 name creation turned
        # on first. The module skips itself off Windows, so the report is checked:
        # a skipped case, or zero tests, fails the step.
        shell: pwsh
        run: |
          $drive = (Get-Item $env:RUNNER_TEMP).PSDrive.Name + ":"
          fsutil 8dot3name set $drive 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = Join-Path $env:RUNNER_TEMP "confined-write"
          python -m pytest packs/core/tests/skills/work-loop/test_confined_mutation_windows.py -q -rs --basetemp="$base" --junitxml="$env:RUNNER_TEMP\confined-write-junit.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/require-junit-ran-without-skips.py "$env:RUNNER_TEMP\confined-write-junit.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pytest supervisor config fingerprint (zero skips)
        # Gating: the fingerprint is a pure function of config bytes, and its
        # `git config --file` cases run against Git for Windows. The report is
        # checked, so a skipped case or zero tests fails the step.
        shell: pwsh
        run: |
          python -m pytest packs/core/tests/skills/work-loop/test_supervisor_config_fingerprint.py -q -rs --junitxml="$env:RUNNER_TEMP\config-fingerprint-junit.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/require-junit-ran-without-skips.py "$env:RUNNER_TEMP\config-fingerprint-junit.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pytest safe-process POSIX suite on Windows (evidence only)
        # Not a gate: this suite was written for POSIX hosts. Its Windows
        # result is recorded as evidence for the Job Object launch path, and a
        # hang is bounded here so it cannot cancel the gating job.
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pytest packs/core/tests/skills/work-loop/test_process_safety.py -q -rs

  credbroker-tests-windows:
    name: pytest credbroker (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: packages/credbroker/pyproject.toml

      - name: Install CredBroker test dependencies
        run: python -m pip install -e packages/credbroker pytest

      - name: Run CredBroker suite
        working-directory: packages/credbroker
        run: python -m pytest

  lock-semantics-windows:
    name: byte-range lock semantics (windows)
    # This job gates the aggregate because the coordination lease depends on this
    # platform behaviour: `msvcrt.locking` locks one byte at the CURRENT FILE
    # POSITION, while `flock` covers the whole open file description. An invisible
    # lock makes every liveness probe read NOT_LIVE, so a live peer's claim is
    # reclaimed and `clean --apply` deletes under a live mutator. The synthetic
    # fixture measures Windows itself; the lease suite proves the publisher and
    # prober use the measured-safe protocol: one agreed offset, past the payload.
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Measure byte-range lock semantics
        # `-s` so the MEASURED line reaches the log: the measurement is the point,
        # and a pass alone would not tell us which way the platform answered.
        run: python -m pytest tools/test_windows_lock_semantics.py -q -s

      - name: Run coordination lease publisher and prober
        run: python -m pytest tools/test_coordination_lease.py -q

  supervisor-windows:
    name: "pytest supervisor product ref, attempt check, and pinning (windows, ${{ matrix.suite }} ${{ matrix.shard }})"
    # The product ref's two-ref transaction, ref lock files, and direct ref reads on a
    # Windows file system, with the attempt check and the pin check that share its
    # control state. Windows runs these suites several times slower than Linux, so each
    # part is its own matrix leg: the product ref suite in three, pinning in two, and
    # attempt in one. A leg keeps every `i`-th collected test (WORK_SUPERVISOR_SHARD
    # is `i/n`, see the work-loop tests' conftest), so the parts are disjoint and cover
    # the suite. Every pytest path is a literal in a step; a step runs for its own suite.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: product-ref
            shard: "0/3"
          - suite: product-ref
            shard: "1/3"
          - suite: product-ref
            shard: "2/3"
          - suite: attempt
            shard: "0/1"
          - suite: pinning
            shard: "0/2"
          - suite: pinning
            shard: "1/2"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      WORK_SUPERVISOR_INTEGRATION: "1"
      WORK_SUPERVISOR_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e packages/credbroker -e packages/agentbundle pytest

      - name: Run the product ref suite
        if: matrix.suite == 'product-ref'
        run: python -m pytest packs/core/tests/skills/work-loop/test_supervisor_product_ref.py -q --durations=10

      - name: Run the attempt check suite
        if: matrix.suite == 'attempt'
        run: python -m pytest packs/core/tests/skills/work-loop/test_supervisor_attempt.py -q --durations=10

      - name: Run the pinning suite
        if: matrix.suite == 'pinning'
        run: python -m pytest packs/core/tests/skills/work-loop/test_supervisor_pinning.py -q --durations=10

  build-check-windows:
    name: make build-check (windows)
    if: ${{ always() }}
    needs:
      - agentbundle-windows
      - credbroker-tests-windows
      - lock-semantics-windows
      - supervisor-windows
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require all Windows suites
        env:
          AGENTBUNDLE_RESULT: ${{ needs.agentbundle-windows.result }}
          CREDBROKER_RESULT: ${{ needs.credbroker-tests-windows.result }}
          LOCK_SEMANTICS_RESULT: ${{ needs.lock-semantics-windows.result }}
          SUPERVISOR_RESULT: ${{ needs.supervisor-windows.result }}
        run: |
          if [ "$AGENTBUNDLE_RESULT" != "success" ] || [ "$CREDBROKER_RESULT" != "success" ] || [ "$LOCK_SEMANTICS_RESULT" != "success" ] || [ "$SUPERVISOR_RESULT" != "success" ]; then
            echo "Windows suites failed: agentbundle=$AGENTBUNDLE_RESULT credbroker=$CREDBROKER_RESULT lock-semantics=$LOCK_SEMANTICS_RESULT supervisor=$SUPERVISOR_RESULT" >&2
            exit 1
          fi
          echo "Windows suites passed"
