name: release-agentbundle

on:
  push:
    tags:
      - 'agentbundle-v*'
  pull_request:
    paths:
      - 'packages/agentbundle/**'
      - '.github/workflows/release-agentbundle.yml'
      # Both are load-bearing for the export-boundary gate below (RFC-0082):
      # without these, a PR changing only the gate never runs the gate.
      - 'tools/check-artifact-contents.py'
      - 'tools/test_check_artifact_contents.py'
      - 'tools/build_zipapp.py'

permissions:
  contents: read

concurrency:
  group: release-agentbundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Assert tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          m = re.fullmatch(r"agentbundle-v(\d+\.\d+\.\d+)", tag)
          if not m:
              print(f"::error::tag {tag!r} does not match agentbundle-vX.Y.Z (pre-release / build-metadata suffixes refused by this spec)", file=sys.stderr)
              sys.exit(1)
          tag_ver = m.group(1)
          with open("packages/agentbundle/pyproject.toml", "rb") as f:
              pp_ver = tomllib.load(f)["project"]["version"]
          if tag_ver != pp_ver:
              print(f"::error::tag {tag} declares version {tag_ver} but pyproject.toml has {pp_ver}", file=sys.stderr)
              sys.exit(1)
          # CLI_VERSION (what `agentbundle --version` reports) is independent of
          # pyproject and has shipped stale before (stuck at 0.1.0). Refuse a
          # mismatched release at tag time, not just in unit tests. Read it from
          # source text: the package isn't installed at this step, and importing
          # version.py would pull in the adapter.toml read. This step is
          # tag-only; PR-time drift coverage is delegated to build-check.yml's
          # `test_version.py` step (test_cli_version_matches_pyproject) — keep
          # that step if these triggers are ever narrowed, or this gap reopens.
          src = open("packages/agentbundle/agentbundle/version.py", encoding="utf-8").read()
          cm = re.search(r'^CLI_VERSION\s*=\s*"([^"]+)"', src, re.MULTILINE)
          if not cm:
              print("::error::could not find CLI_VERSION literal in agentbundle/version.py", file=sys.stderr)
              sys.exit(1)
          if cm.group(1) != pp_ver:
              print(f"::error::CLI_VERSION is {cm.group(1)} but pyproject.toml has {pp_ver}; `agentbundle --version` would lie. Bump CLI_VERSION in agentbundle/version.py.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Assert tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          # Use `git branch -r --contains` rather than `merge-base --is-ancestor`:
          # the ancestor check silently returns 0 for diverged histories with no
          # common ancestor, bypassing the guard. The branch-contains query is
          # direct: it asks which remote refs include this exact commit.
          if ! git branch -r --contains "$GITHUB_SHA" 2>/dev/null | grep -qE '(^|\s)origin/main($|\s)'; then
            echo "::error::tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on origin/main; refusing to publish. Tag only from a commit that is on main." >&2
            exit 1
          fi

      - name: Install build, release, and engine-test dependencies
        run: >-
          python3 -m pip install --upgrade build twine pytest jsonschema pyyaml
          -e packages/credbroker

      - name: Build wheel + sdist
        working-directory: packages/agentbundle
        run: python3 -m build

      # RFC-0082 export boundary. The zipapp is built into a scratch dir, NOT
      # into packages/agentbundle/dist/ — `twine check` validates that directory
      # and publish-pypi uploads it, so a stray .pyz there would redden the
      # check and contaminate the release.
      - name: Build zipapp (scratch — not a release artifact)
        run: python3 tools/build_zipapp.py /tmp/zipapp-gate

      - name: Artifact test boundaries — wheel/zipapp absent, sdist executable
        run: |
          python3 tools/check-artifact-contents.py \
            packages/agentbundle/dist/*.whl \
            /tmp/zipapp-gate/agentbundle.pyz \
            packages/agentbundle/dist/*.tar.gz

      - name: twine check
        run: python3 -m twine check packages/agentbundle/dist/*

      - name: Smoke — install wheel into fresh venv and import the CLI entrypoint
        run: |
          python3 -m venv /tmp/smokevenv
          /tmp/smokevenv/bin/pip install --quiet packages/agentbundle/dist/*.whl
          /tmp/smokevenv/bin/python -c "from agentbundle.cli import main"

      - name: Smoke — agentbundle console script on PATH
        run: PATH="/tmp/smokevenv/bin:$PATH" agentbundle --help

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: packages/agentbundle/dist/
          if-no-files-found: error

  # Gate H — pre-release checks (ini-005 Wave 5c):
  # Requires full test suite + install-defaults staleness check before PyPI
  # publication.  Runs on tags only; wired as a dependency of publish-pypi.
  pre-release-gates:
    name: "Gate H — pre-release gates (Python ${{ matrix.python }})"
    needs: [build-and-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install agentbundle (editable) + optional extras + pytest
        # `tools/requirements.txt` is the canonical dev-dependency list and is
        # what build-check.yml installs. Gate H previously installed only the
        # `[lint]` extra (pyyaml), so `jsonschema` was absent and three modules
        # that import it at module scope failed collection — `agentbundle
        # 0.38.1` could not publish. Gate H is `if: ref_type == 'tag'`, so it
        # never runs on a PR and nothing could observe the gap until a real
        # release was attempted. Install from the shared file rather than
        # re-listing deps here, so this cannot drift out of sync again.
        run: python -m pip install -r tools/requirements.txt -e 'packages/agentbundle[lint]' -e packages/credbroker pytest

      - name: Full agentbundle test suite (Gate H pre-publish)
        working-directory: packages/agentbundle
        run: python -m pytest tests/ -q

      - name: install-defaults staleness check
        # Fail if install-defaults.toml has drifted from catalogue.toml —
        # a stale defaults file means the released wheel would install the
        # wrong packs by default.
        run: agentbundle catalogue sync-defaults --root . --check

      - name: "Enterprise smoke — write example.test catalogue.toml"
        run: |
          mkdir -p /tmp/gate-h-enterprise-cat
          cat > /tmp/gate-h-enterprise-cat/catalogue.toml <<'TOML'
          schema = 1

          [catalogue]
          name                        = "test-catalogue"
          display-name                = "Test Catalogue"
          description                 = "Enterprise distribution smoke test — example.test values only."
          minimum-agentbundle-version = "0.21.0"

          [catalogue.paths]
          packs        = "packs"
          profiles     = "profiles"
          contracts    = "contracts"
          marketplace  = ".claude-plugin/marketplace.json"
          build-output = "dist"

          [catalogue.build]
          recipes                 = ["default"]
          self-host               = false
          claude-plugin-branch    = "main"
          marketplace-description = "Enterprise distribution smoke test."

          [catalogue.package]
          include = []

          [distribution.agentbundle]
          install-defaults-output = "install-defaults.toml"
          preferred-adapter        = "claude-code"
          default-source           = "git+https://artifactory.example.test/agentbundle-catalogues/engineering"

          [distribution.agentbundle.artifactory]
          enabled    = true
          base-url   = "https://artifactory.example.test/artifactory"
          repository = "agentbundle-generic-local"
          bundle     = "engineering"
          channel    = "stable"
          TOML

      - name: "Enterprise smoke — sync-defaults --write"
        run: agentbundle catalogue sync-defaults --root /tmp/gate-h-enterprise-cat --write

      - name: "Enterprise smoke — sync-defaults --check"
        run: agentbundle catalogue sync-defaults --root /tmp/gate-h-enterprise-cat --check

      - name: "Enterprise smoke — assert channel = stable in install-defaults.toml"
        run: grep 'channel = "stable"' /tmp/gate-h-enterprise-cat/install-defaults.toml

      - name: "Enterprise smoke — inject enterprise defaults into package source"
        # Simulates the enterprise fork workflow: after sync-defaults --write generates
        # the enterprise install-defaults.toml, the org copies it into their agentbundle
        # fork's _data/ before building their private wheel.
        run: |
          cp /tmp/gate-h-enterprise-cat/install-defaults.toml \
             packages/agentbundle/agentbundle/_data/install-defaults.toml

      - name: "Enterprise smoke — build wheel"
        run: |
          pip install --upgrade build
          python -m build packages/agentbundle --outdir /tmp/gate-h-dist

      - name: "Enterprise smoke — assert channel = stable in packaged wheel"
        run: |
          python3 -c "
          import zipfile, sys
          from pathlib import Path
          whl = next(Path('/tmp/gate-h-dist').glob('*.whl'))
          with zipfile.ZipFile(whl) as z:
              data = z.read('agentbundle/_data/install-defaults.toml').decode()
          if 'channel = \"stable\"' not in data:
              print('FAIL: channel not found in packaged install-defaults.toml')
              print(data)
              sys.exit(1)
          "

      - name: "Enterprise smoke — restore public install-defaults.toml"
        run: git checkout -- packages/agentbundle/agentbundle/_data/install-defaults.toml

      - name: "Package-config test — create two-pack catalogue"
        run: |
          mkdir -p /tmp/gate-h-pkg/packs/pack-a /tmp/gate-h-pkg/packs/pack-b
          mkdir -p /tmp/gate-h-pkg/profiles /tmp/gate-h-pkg/contracts
          cat > /tmp/gate-h-pkg/packs/pack-a/pack.toml <<'TOML'
          [pack]
          name = "pack-a"
          version = "0.1.0"
          description = "Gate H test pack A."
          TOML
          cat > /tmp/gate-h-pkg/packs/pack-b/pack.toml <<'TOML'
          [pack]
          name = "pack-b"
          version = "0.1.0"
          description = "Gate H test pack B."
          TOML
          touch /tmp/gate-h-pkg/LICENSE-APACHE /tmp/gate-h-pkg/LICENSE-MIT /tmp/gate-h-pkg/AGENTS.md
          mkdir -p /tmp/gate-h-pkg/.claude-plugin
          echo '{"name":"gate-h","description":"test","owner":{"name":"ci"},"plugins":[]}' \
            > /tmp/gate-h-pkg/.claude-plugin/marketplace.json
          cat > /tmp/gate-h-pkg/catalogue.toml <<'TOML'
          schema = 1
          [catalogue]
          name        = "gate-h-pkg"
          display-name = "Gate H Package Test"
          description = "Package-config gate."
          minimum-agentbundle-version = "0.21.0"
          [catalogue.paths]
          packs       = "packs"
          profiles    = "profiles"
          contracts   = "contracts"
          marketplace = ".claude-plugin/marketplace.json"
          build-output = "dist"
          [catalogue.build]
          recipes = ["default"]
          self-host = false
          claude-plugin-branch = "main"
          marketplace-description = "test"
          [catalogue.package]
          include = ["packs/pack-a"]
          [distribution.agentbundle]
          preferred-adapter = "claude-code"
          [distribution.agentbundle.artifactory]
          enabled = false
          TOML

      - name: "Package-config test — run catalogue package"
        run: |
          agentbundle catalogue package \
            --root /tmp/gate-h-pkg \
            --bundle gate-h \
            --release 0.1.0 \
            --channel stable \
            --output /tmp/gate-h-pkg-out

      - name: "Package-config test — assert pack-a present, pack-b absent"
        run: |
          python3 -c "
          import tarfile, sys
          from pathlib import Path
          arc = Path('/tmp/gate-h-pkg-out/catalogues/gate-h/releases/0.1.0/catalogue-0.1.0.tar.gz')
          with tarfile.open(arc, 'r:gz') as tf:
              names = [m.name for m in tf.getmembers()]
          has_a = any('pack-a' in n for n in names)
          has_b = any('pack-b' in n for n in names)
          if not has_a:
              print('FAIL: pack-a missing from archive'); sys.exit(1)
          if has_b:
              print('FAIL: pack-b present despite being excluded'); sys.exit(1)
          "

      - name: "Archive round-trip — verify (source)"
        run: agentbundle catalogue verify --root .

      - name: "Archive round-trip — package"
        run: |
          agentbundle catalogue package \
            --root . \
            --bundle reference \
            --release 0.0.0-gate-h \
            --channel stable \
            --output /tmp/gate-h-roundtrip

      - name: "Archive round-trip — verify (archive)"
        run: |
          agentbundle catalogue verify \
            --archive /tmp/gate-h-roundtrip/catalogues/reference/releases/0.0.0-gate-h/catalogue-0.0.0-gate-h.tar.gz \
            --sha256-file /tmp/gate-h-roundtrip/catalogues/reference/releases/0.0.0-gate-h/catalogue-0.0.0-gate-h.tar.gz.sha256

      - name: "Schema copy sync — assert contracts/ and _data/ are identical"
        run: |
          diff contracts/catalogue.schema.json \
              packages/agentbundle/agentbundle/_data/catalogue.schema.json

  publish-pypi:
    needs: [build-and-smoke, pre-release-gates]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/

  publish-artifactory:
    needs: [build-and-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - id: guard
        name: Check Artifactory secret presence
        env:
          ART_URL: ${{ secrets.ARTIFACTORY_URL }}
          ART_USER: ${{ secrets.ARTIFACTORY_USER }}
          ART_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          if [ -n "$ART_TOKEN" ] && [ -n "$ART_URL" ] && [ -n "$ART_USER" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ART_TOKEN" ] || [ -n "$ART_URL" ] || [ -n "$ART_USER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Artifactory secrets partially configured (one of ARTIFACTORY_URL/USER/TOKEN is empty); refusing to publish to avoid sending credentials to a default endpoint."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Artifactory secrets not set; skipping Artifactory publish."
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - if: steps.guard.outputs.configured == 'true'
        name: Install twine
        run: python3 -m pip install --upgrade twine

      - if: steps.guard.outputs.configured == 'true'
        name: Upload to Artifactory
        env:
          TWINE_REPOSITORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USER }}
          TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: python3 -m twine upload dist/*
