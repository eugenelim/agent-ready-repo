name: release-jsonl-otlp-exporter

on:
  push:
    tags:
      - 'jsonl-otlp-exporter-v*'
  pull_request:
    paths:
      - 'packages/jsonl-otlp-exporter/**'
      - '.github/workflows/release-jsonl-otlp-exporter.yml'

permissions:
  contents: read

concurrency:
  group: release-jsonl-otlp-exporter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Assert tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          m = re.fullmatch(r"jsonl-otlp-exporter-v(\d+\.\d+\.\d+)", tag)
          if not m:
              print(f"::error::tag {tag!r} does not match jsonl-otlp-exporter-vX.Y.Z", file=sys.stderr)
              sys.exit(1)
          tag_ver = m.group(1)
          with open("packages/jsonl-otlp-exporter/pyproject.toml", "rb") as f:
              pp_ver = tomllib.load(f)["project"]["version"]
          if tag_ver != pp_ver:
              print(f"::error::tag {tag} declares version {tag_ver} but pyproject.toml has {pp_ver}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Assert tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA} which is not an ancestor of origin/main; refusing to publish (publish only from main)" >&2
            exit 1
          fi

      - name: Install build + twine
        run: python3 -m pip install --upgrade build twine

      - name: Build wheel + sdist
        working-directory: packages/jsonl-otlp-exporter
        run: python3 -m build

      - name: twine check
        run: python3 -m twine check packages/jsonl-otlp-exporter/dist/*

      - name: Assert the wheel bundles no profile
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("packages/jsonl-otlp-exporter/dist/*.whl"))[-1]
          shipped = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".toml")]
          if shipped:
              print(f"::error::the distribution must bundle no profile; found {shipped}", file=sys.stderr)
              sys.exit(1)
          print("no profile bundled")
          PY

      - name: Smoke — install the wheel into a fresh venv and run the console script
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet packages/jsonl-otlp-exporter/dist/*.whl
          /tmp/smoke/bin/jsonl-otlp-export --version
          # Off-by-default, proven on the installed artifact rather than in a
          # unit test: with no endpoint configured this must say so and exit 0.
          mkdir -p /tmp/smoke-run && cd /tmp/smoke-run
          printf '{"at":"2026-01-01T00:00:00Z","result":"success","run_id":"r","seq":1}\n' > events.jsonl
          printf 'timestamp_field = "at"\ntimestamp_format = "rfc3339"\nseverity_field = "result"\nidentity = ["run_id", "seq"]\nallowlist = []\n[severity_map]\nsuccess = 9\n' > smoke.toml
          env -u OTEL_EXPORTER_OTLP_ENDPOINT -u OTEL_EXPORTER_OTLP_LOGS_ENDPOINT \
            /tmp/smoke/bin/jsonl-otlp-export --input events.jsonl --root . --profile smoke.toml
          echo "off-by-default smoke OK (exit $?)"

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: packages/jsonl-otlp-exporter/dist/
          if-no-files-found: error

  # Gated: runs only on a version tag push, which is a deliberate maintainer
  # action, never on merge or pull_request. Publishing claims the PyPI name, and
  # a name cannot be reclaimed -- so the first publish is the maintainer's call.
  publish-pypi:
    needs: [build-and-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted publishing: the job mints a short-lived token from this
      # identity at run time. No long-lived API token exists to leak, and no
      # PyPI credential is stored in the repository at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
