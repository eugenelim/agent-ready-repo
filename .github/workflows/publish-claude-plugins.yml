name: Publish Claude plugin packages

# Builds the per-pack claude-plugins output, validates the generated manifests
# with a hermetic schema check, and publishes to the `claude-plugins-dist` branch
# so adopters can install any *user-scope* pack with:
#
#   claude plugin marketplace add eugenelim/agent-ready-repo
#   claude plugin install <pack>@agent-ready-repo
#
# Only packs whose `[pack.install] allowed-scopes` admits "user" are published:
# the route installs at user scope, so a repo-only pack would be offered an
# install its own declaration forbids. See
# docs/specs/claude-plugin-route-scope.
#
# Excludes `catalogue-curation/` (operator-only pack) but includes
# `marketplace.json` at the branch root for machine-readable discovery.
#
# The push filter below is an ALLOWLIST of everything this job consumes: the
# sixteen published pack sources (their manifests are inside them), plus the
# builder, the Makefile, the publish script and the root marketplace it refuses
# against, and the publication-control gate with the three files it reads. The
# route is per-pack (agentbundle's `per-pack-claude-plugin.toml` recipe), so a
# push that touches none of these cannot change a published plugin.
#
# A repo-only pack is deliberately absent, manifests included: its version
# bump, which rides with most changes, cannot change what is published, and each
# run costs a deployment approval. A pack that gains or loses user scope cannot
# slip past that. The roster lint fails until `PUBLISHED` is edited, and it also
# fails until this list is edited to match, so the commit that changes a pack's
# publication status edits this file, which is itself a push path below.
#
# An allowlist rather than `paths-ignore` because this job is gated on the
# `claude-plugin-publish` environment: a push that cannot change the output
# still opens a deployment approval, and the repo's own history is the argument
# -- replayed over the 200 most recent first-parent commits on `main` (taken
# 2026-11-12), a filter that also matched every pack's scope manifests ran on
# 128; this allowlist runs on 68. The shape that does not work is an ignore-list
# of the repo-only pack directories: a pack change here rides with a changelog
# entry and the self-hosted `.claude/` and `.agents/` projections, so it skips
# almost nothing.
#
# An allowlist fails unsafe by nature: a pack missing from it stops publishing
# with nothing red. tools/lint-plugin-roster.py closes that -- it holds the
# literal `PUBLISHED` roster, already refuses an unrostered pack, and fails when
# this list and that roster disagree in either direction. Keep the two in one
# commit. A brand-new pack is caught a step earlier: tools/lint-plugin-membership.py
# fails while it is publishable from source but absent from the root
# marketplace, and entering that marketplace is what makes the roster refuse it.
#
# Accepted limitation: GitHub evaluates a path filter over at most the first 300
# changed files, so a larger push could match nothing here and skip a publish it
# owed. Left as is rather than backstopped -- the 200 most recent merges to
# `main` top out at 92 changed files. `workflow_dispatch` above recovers a missed
# trigger by hand: dispatch this workflow on `main`, approve the deployment, then
# check the published tree and `marketplace.json`.
#
# This comment is the operative statement of the trigger's reach. AC1 of
# docs/specs/claude-plugins-publish-and-discover is frozen at the unfiltered
# shape it verified, and a frozen body is not patched -- see rule 4 of
# `packs/core/.apm/skills/new-spec/references/spec-and-plan-contract.md`
# section "Superseding a frozen document".
#
# Skips committing when content is byte-for-byte identical to the
# previous publish; cancels in-flight runs when a newer push lands.
#
# Validation note: the `claude` CLI binary is not available in standard CI.
# This workflow uses hermetic Python schema checks as the build-time gate:
# plugin-manifest.derived.schema.json for each plugin.json, and
# marketplace-entry.schema.json for every marketplace entry. A green build here
# is NECESSARY BUT NOT SUFFICIENT — the schemas mirror an upstream contract we
# do not own, so only the real client can detect upstream drift (ADR-0072). Real-client validation (`claude plugin validate`) must be
# run locally before merging PRs that touch the plugin build pipeline.
# Client version used for local validation: Claude Code 2.1.228
# (2026-08-12; accepted event set identical to 2.1.226 — see AC18).

on:
  push:
    branches: [main]
    paths:
      # The published packs. Mirrors `PUBLISHED` in tools/lint-plugin-roster.py.
      - 'packs/agent-skill-engineering/**'
      - 'packs/architect/**'
      - 'packs/atlassian/**'
      - 'packs/contracts/**'
      - 'packs/converters/**'
      - 'packs/credential-brokers/**'
      - 'packs/desk-research/**'
      - 'packs/experience-design/**'
      - 'packs/figma/**'
      - 'packs/frontend-engineering/**'
      - 'packs/github/**'
      - 'packs/linear/**'
      - 'packs/product-documentation/**'
      - 'packs/product-engineering/**'
      - 'packs/product-strategy/**'
      - 'packs/code-intelligence/**'
      # What turns those sources into the published tree, and what gates it.
      - 'packages/agentbundle/**'
      - 'Makefile'
      - 'tools/catalogue/**'
      - 'tools/pack_scope.py'
      - 'tools/lint-claude-plugin-publish-control.py'
      - '.github/claude-plugin-publish-control.json'
      - 'tools/capture-publish-control-evidence.py'
      - 'docs/specs/claude-plugin-hook-parity/publish-control-evidence.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/publish-claude-plugins.yml'
  workflow_dispatch:

concurrency:
  group: publish-claude-plugins
  cancel-in-progress: true

# Publisher identity is SEQUENCED, not free-form — see spec AC36. The dedicated
# publisher App of ADR-0079 is provisioned, so the App-token shape below is the
# only legal one: `docs/specs/claude-plugin-hook-parity/publish-control-evidence.json`
# exists, and while it does, reverting to a `contents: write` GITHUB_TOKEN
# publisher fails tools/test-publish-claude-plugins.py. If the App is ever
# decommissioned, delete the evidence file in the same commit that changes this
# workflow — the two must move together.
# Rollout runbook: docs/guides/how-to/publisher-app-rollout.md

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: claude-plugin-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # full history so worktree can reach the target branch
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install agentbundle (dev editable)
        run: python -m pip install -e packages/credbroker -e packages/agentbundle

      - name: Build claude-plugin artifacts
        run: make build

      - name: Validate generated plugin manifests (agentbundle catalogue verify step 13)
        run: |
          PYTHONPATH=packages/agentbundle python -m agentbundle catalogue verify --root .

      - name: Configure git identity
        run: |
          git config user.name "claude-plugin-publisher[bot]"
          git config user.email "claude-plugin-publisher[bot]@users.noreply.github.com"

      - name: Mint repository-scoped publisher token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.CLAUDE_PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish to claude-plugins-dist branch
        run: python3 tools/catalogue/publish_claude_plugins.py
        env:
          CLAUDE_PLUGIN_PUBLISH_TOKEN: ${{ steps.publisher-token.outputs.token }}
