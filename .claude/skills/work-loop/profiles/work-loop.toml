# Work-loop event mapping for `jsonl-otlp-exporter`.
#
# This is data, not code. The profile is supplied to the sender as a file through
# its `--profile` flag; the sender registers no profile of its own and does not
# know which consumer supplied this one.
#
# It maps the event line the work-loop supervisor appends to `.loop-run/events.jsonl`
# for every step it commits.

timestamp_field = "at"
timestamp_format = "rfc3339"

severity_field = "result"

# 9 is INFO and 17 is ERROR in OpenTelemetry's severity numbering. The supervisor's
# step lines carry no `result`, so each is sent with no severity rather than being
# dropped -- a step is a routing fact, neither a pass nor a failure. The map stays
# so a consumer that adds a result sees the same two values.
# Inline on purpose: a `[severity_map]` table header would capture `identity`
# and `allowlist` below it into that table instead of leaving them top-level.
severity_map = { success = 9, failure = 17 }

# `run_id` with `seq` is what a consumer deduplicates on.
identity = ["run_id", "seq"]

# Exactly the emitted keys, less the three routed above (`at`, `run_id`, `seq`).
# Derived from a line the supervisor actually emitted, not hand-listed: the test
# re-derives it the same way, so a field added to the envelope fails that test
# rather than being dropped from the payload in silence.
allowlist = [
    "awaiting_input",
    "event",
    "from",
    "schema",
    "spec",
    "step_id",
    "to",
]
