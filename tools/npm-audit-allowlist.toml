# Advisory allowlist for the npm SCA leg of `make sast` (ADR-0083).
#
# Read by `tools/audit-npm.py`. An advisory listed here is reported on every run
# but does not block the gate.
#
# THIS FILE SHOULD NORMALLY BE EMPTY. It exists because `npm audit` has no
# per-advisory ignore: without it, the only way past one unfixable transitive
# advisory is downgrading `--audit-level`, which stops gating an entire severity
# band for the whole repo (the gate blocks at `moderate` and above). The sibling
# `pip-audit` leg in `make sast` has its own allowlist file for the same reason —
# `tools/pip-audit-allowlist.toml`, read by `tools/run-pip-audit-gate.py`
# (ADR-0131). That leg carried bare `--ignore-vuln` flags when this comment was
# written; it no longer does, and the two legs now share a shape.
#
# Add an entry ONLY when there is no available fix. If `npm audit fix
# --package-lock-only` resolves it, take the fix instead — a real remediation
# also satisfies the org's Snyk Open Source scan, which no entry here can reach.
#
# Every entry needs all three fields. A missing or blank `reason` /
# `unblocked_when` is a tool error (exit 2), not a silent pass: an allowlist
# that decays into an undocumented mute list is worse than no allowlist.
#
#   id             — the GHSA-… or CVE-… identifier as it appears in the
#                    advisory URL, or `npm:<source>` for an advisory with no
#                    GitHub URL. Exactly as `audit-npm.py` prints it.
#   reason         — why this is accepted: the reachability argument, in a
#                    sentence a reviewer can check.
#   unblocked_when — the concrete condition that retires this entry. "When
#                    upstream ships X" — not "when convenient".
#
# Example (do not uncomment; kept as the shape, not as an active suppression):
#
#   [[allow]]
#   id = "GHSA-0000-1111-2222"
#   reason = """
#   Build-time-only dependency of docs-site; the vulnerable code path parses
#   attacker-supplied YAML, and this repo only parses its own committed files.
#   """
#   unblocked_when = "example-pkg ships >=2.4.1, which repins the vulnerable transitive dep"

[[allow]]
id = "GHSA-ch52-4w7c-c8xp"
reason = """
Transitive dependency of astro in docs-site and web. Both sites build to static
files with no server adapter, so no shared HTTP cache serves one user's cached
response to another; the max-stale flaw needs that shared cache to disclose
anything. No patched http-cache-semantics release exists (affected: <= 4.2.0).
"""
unblocked_when = "http-cache-semantics publishes a release that patches GHSA-ch52-4w7c-c8xp"

[[allow]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = """
Transitive dependency of stylelint (via micromatch) in web, used only at lint
time. The only patterns it expands are the repository's own committed globs,
such as src/**/*.{css,astro}, so no untrusted, deeply nested pattern reaches
it. No patched braces release exists (affected: <= 3.0.3).
"""
unblocked_when = "braces publishes a release that patches GHSA-vfj7-8cjw-p6xm"

[[allow]]
id = "GHSA-rj75-hqrm-r3gf"
reason = """
Transitive dependency of @astrojs/starlight in docs-site, reached at build time
through @expressive-code/core -> postcss-nested -> postcss-selector-parser
6.1.4. The flaw is quadratic complexity when parsing a flat CSS selector, so
exhausting CPU needs an attacker-supplied selector; the only selectors parsed
are the repository's own committed CSS and the Markdown docs-site builds from
it, both authored in-tree. docs-site emits static files with no server adapter,
so the parser never runs against anything a site visitor supplies.

There is no forward fix. npm reports the fix as @astrojs/starlight 0.21.5,
which is a semver-major DOWNGRADE from the 0.42.4 this repository pins and
would undo the bump taken in #1493; `npm audit fix --package-lock-only` leaves
it in place for that reason. Taking npm's suggestion would trade a build-time
CPU bound for a 21-minor regression of the docs toolchain.
"""
unblocked_when = "@expressive-code/core or @astrojs/starlight ships a release repinning postcss-selector-parser to a version patching GHSA-rj75-hqrm-r3gf, so `npm audit fix --package-lock-only` clears it without a major downgrade"
