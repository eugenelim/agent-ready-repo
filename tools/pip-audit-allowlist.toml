# Advisory allowlist for the Python SCA leg of `make sast` (ADR-0131).
#
# Read by `tools/run-pip-audit-gate.py`. An advisory listed here is reported on
# every run but does not block the gate.
#
# THIS FILE SHOULD NORMALLY BE EMPTY. It is not, and as of 2026-09-30 it is not
# empty for TWO different reasons — do not read the first one as covering every
# entry.
#
# Twelve entries exist because Semgrep declares `pyjwt[crypto]~=2.13.0`, which
# excludes the PyJWT releases that fix them. Nothing in this repository can
# reach 2.14.0 while that pin stands: a direct pin or a constraints entry
# produces an unsatisfiable resolve, not a remediation. Semgrep 1.178.0 — the
# latest release as of 2026-09-29 — still declares it.
#
# The thirteenth, CVE-2026-103001, is NOT a pin problem. No PyJWT release fixes
# it in any version, so no Semgrep bump can clear it. It carries
# `fixed_in = "none"` under ADR-0133 and retires on a different trigger.
#
# Add an entry ONLY when there is no available fix. A real remediation also
# satisfies the org's Snyk Open Source scan, which no entry here can reach.
#
# Every entry needs all five fields. A missing or blank one is a tool error
# (exit 2), not a silent pass: an allowlist that decays into an undocumented
# mute list is worse than no allowlist.
#
#   id             — the advisory identifier as pip-audit reports it in `id`.
#                    Aliases are NOT a match path: matching is on the primary id
#                    only, so an entry cannot silently inherit a future advisory
#                    that merely lists this one among its aliases.
#   package        — the dependency the risk was accepted for, compared PEP 503
#                    canonicalised against the report. An id alone does not say
#                    which dependency was accepted.
#   fixed_in       — the release that fixes it. Cross-checked against the
#                    advisory's own reported `fix_versions` while the advisory
#                    is still visible, so the copy cannot drift and an
#                    unreachable value cannot permanently disable retirement.
#                    The one non-release value is `none` (ADR-0133), declaring
#                    that upstream has published NO fix. It is opt-in: an empty
#                    `fix_versions` is never read as implying it. It does not
#                    switch retirement off, it inverts the trigger — such an
#                    entry fails the moment the feed publishes any fix version
#                    for that id. Do not reach for it to quiet an advisory that
#                    merely has an awkward version; it is only for advisories
#                    no release remediates.
#   reason         — this advisory's trigger, and why this invocation cannot
#                    reach it. Per advisory, not per group.
#   unblocked_when — the concrete condition that retires this entry.
#
# HOW THIS RETIRES. Each entry names its own `unblocked_when`, and as of
# 2026-09-30 the batch no longer shares ONE condition: eleven entries retire when
# a Semgrep release permits PyJWT>=2.14.0, CVE-2026-101918 needs >=2.15.0, and
# CVE-2026-103001 does not retire on a Semgrep bump at all — it is unfixed
# upstream, so it clears only when PyJWT first ships a fix for it.
# Whichever release arrives, pip-audit stops reporting the ids it fixes, the gate
# exits 2 naming each newly-retired entry, and those entries are removed. That
# much is mechanical — it does not depend on anyone remembering. What is NOT
# mechanical is the count: this file gained two entries on 2026-09-30, after the
# original ten, because the feed kept publishing. Read `unblocked_when` per entry
# rather than assuming a single version clears the file.
#
# WHAT IS NOT MECHANICAL. The reachability argument in every `reason` below is a
# human finding, verified on 2026-09-29 and recorded in ADR-0131 with the call
# paths, the distributions, the versions and the command that reproduces it.
# Nothing in this repository re-checks it. If you are adding or amending an
# entry, re-verify it and update that record.

# The vehicle's bound. An entry naming a package outside this list is a tool
# error. Widening it is therefore a visible edit, reviewed on its own terms —
# this repository has no CODEOWNERS file, so this is the available control.
allowed_packages = ["pyjwt"]

# The reachability premise every entry below relies on, stated once so each
# `reason` can say which part of it carries that advisory. Two distributions in
# the audited closure import PyJWT:
#
#   semgrep/mcp/utilities/token_verifier.py      jwt.PyJWKClient(...), jwt.decode(...)
#   mcp/client/auth/extensions/client_credentials.py   jwt.encode(...)
#
# The semgrep call sites are constructed only by `make_token_verifier`, called
# only from `setup_mcp_server` in semgrep/commands/mcp.py — the `semgrep mcp`
# subcommand. The mcp call site runs only during private-key-JWT client
# authentication against an OAuth token endpoint. `make sast` invokes
# `run-semgrep-gate.py` with `--config` flags and source paths; it starts no MCP
# server and performs no OAuth client authentication, so neither site executes.

[[allow]]
id       = "CVE-2026-102268"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
CRITICAL (CVSS v3.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N) and the most serious of
the ten, so it is argued on its own rather than folded into a list.
`is_pem_format` in jwt/utils.py does not recognise every PEM representation the
cryptography loader accepts, so a whitespace- or line-ending-mutated public-key
PEM passed as a raw key slips past the HS/asymmetric confusion guard and
`HMACAlgorithm.prepare_key` treats it as an HMAC secret. An attacker who knows
the public key can then forge authenticated tokens.
The trigger needs an application that mixes HMAC and asymmetric algorithms and
accepts externally-influenced raw key bytes. Both PyJWT call sites in the
audited closure fail that precondition, and for different reasons. semgrep's
`jwt.decode` runs only inside the `semgrep mcp` OAuth server, which `make sast`
never starts. mcp's `jwt.encode` does reach `prepare_key`, but its key is
`self.signing_key`, the client's own configured private key, with the algorithm
fixed by configuration — there is no attacker-supplied key to mutate — and it
runs only during private-key-JWT client authentication, which a static-analysis
scan does not perform.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102266"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
`HMACAlgorithm.from_jwk` uses the decoded key without applying `prepare_key`
validation, so an `oct` JWK whose `k` is empty lets an attacker sign with the
same zero-length key and carry arbitrary authenticated claims. The trigger is
parsing any such JWK through `from_jwk` — via a JWK Set, or via a single
`jwt.PyJWK`, or a direct call; the containing structure is not what matters.
`make sast` parses no JWK in any form: semgrep's key-handling path belongs to
the `semgrep mcp` server, and mcp's call site signs with a configured private
key and reads no JWK at all.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102271"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
`HMACAlgorithm.prepare_key`'s asymmetric-key guard relies on textual PEM markers
that DER encoding does not carry, so a DER public key supplied as the shared
verification key is used as an HMAC secret and tokens can be forged by anyone
holding the public key.
Same precondition as CVE-2026-102268 and the same two answers: semgrep's
verification path runs only under `semgrep mcp`, and mcp's `jwt.encode` passes
its own configured signing key rather than an externally-supplied one.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102272"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
The raw-JWK detector in `HMACAlgorithm.prepare_key` does not normalise a UTF-8
byte-order mark before testing for JSON, so a BOM-prefixed public JWK bypasses
asymmetric-key detection and becomes the HMAC secret in a mixed-algorithm
verification path.
Requires a caller passing externally-influenced raw key bytes into a mixed
HS/asymmetric verification. Neither call site does: semgrep's is behind
`semgrep mcp`, and mcp's is a signing call with a configured key.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102273"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
The HMAC key guard recognises only top-level public JWK forms and misses
container representations, so a public JWK container passed as the raw key is
accepted as the HMAC secret and a token can be forged with arbitrary
authenticated claims.
Third variant of the same mixed-algorithm precondition, and unreachable for the
same two reasons: no verification path executes outside `semgrep mcp`, and the
one signing path uses a configured private key.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102267"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
This one needs no JWT at all, so the usual premise does not carry it. It fires
on a JWKS *fetch*: `PyJWKClient` does not revalidate redirect destinations
against the JWKS trust boundary, so an attacker-influenced redirect from a
configured endpoint can substitute verification keys or disclose forwarded
credentials.
The narrower premise that does carry it: no `PyJWKClient` is ever constructed on
this path. The only construction in the audited closure is
`self._jwks_client = jwt.PyJWKClient(jwks_uri)` in
semgrep/mcp/utilities/token_verifier.py, inside `IntrospectionTokenVerifier`,
built only by `make_token_verifier`, called only from `setup_mcp_server`. mcp's
call site constructs no client. `make sast` starts no MCP server, so no client
exists and no JWKS URL is fetched or redirected.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-101917"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
Also needs no JWT. `get_signing_key_from_jwt` force-refreshes the JWKS on an
unknown `kid` with no negative cache and no minimum refresh interval, so
unauthenticated traffic using unknown or varying `kid` values amplifies outbound
requests to the configured JWKS endpoint.
Carried by the same narrower premise as CVE-2026-102267: no `PyJWKClient` is
constructed on this path, so there is no client to refresh and no configured
JWKS endpoint to amplify against. The amplification target would be an operator's
own endpoint, which this invocation never configures.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102269"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
Signature-segment decoding accepts characters outside canonical Base64URL, so
`base64url_decode` yields identical signature bytes for different serialisations
and a raw-token revocation check can fail to recognise an equivalent modified
token.
Two independent reasons it cannot fire here. It requires decoding a compact JWS,
which only semgrep's `jwt.decode` does and only under `semgrep mcp`. It also
requires a raw-token revocation list for the mismatch to matter, and neither
semgrep nor mcp maintains one — the consequence has no mechanism in this
closure even if the decode ran.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102265"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
`PyJWS._load` in jwt/api_jws.py catches `ValueError` but not `RecursionError`,
so a deeply nested token header reaching `json.loads` escapes the documented
PyJWT error hierarchy and an unauthenticated malformed token becomes a
request-level failure.
Requires an attacker-supplied token reaching `jwt.decode`. `make sast` receives
source paths and `--config` flags; it parses no token. The only decode in the
closure is behind `semgrep mcp`, and its consequence — an HTTP 500 — presupposes
a running server.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102274"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
`PyJWKSet` does not catch the plain `ValueError` that `RSAAlgorithm.from_jwk`
raises for malformed RSA components, so one malformed member aborts construction
of the entire set and an application can see authentication failures or a
request-level denial of service.
Requires constructing a `PyJWKSet` from a JWK Set. This invocation receives
source paths and no JWK set, and no `PyJWKSet` is constructed on it: semgrep's
is reached only through `PyJWKClient` under `semgrep mcp`, and mcp's signing path
builds none.
This is the advisory the previous bare `--ignore-vuln CVE-2026-102274` flag
suppressed; its reasoning is preserved here rather than in a Makefile comment.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-102270"
package  = "pyjwt"
fixed_in = "2.14.0"
reason   = """
Re-DoS in `is_pem_format`: the lazy `.+?` quantifier rescans the whole input for
each `-----BEGIN ...-----` line when no matching `----- END` line follows, so
input built only of BEGIN lines costs O(N^2) CPU. Denial of service only; it
forges nothing and discloses nothing.
Same function and same two call sites as CVE-2026-102268, and the same
precondition fails. A Re-DoS needs attacker-influenced PEM bytes to reach
`is_pem_format`: semgrep's `jwt.decode` runs only inside the `semgrep mcp`
OAuth server, which `make sast` never starts, and mcp's `jwt.encode` passes
`self.signing_key` — the client's own configured private key — so no
externally-supplied key material is scanned.
ADDED 2026-09-30, after the other ten. This id was not visible in the feed when
they were written on 2026-09-29; the batch runs 102265-102274 and this was the
one gap. Its reachability argument is INHERITED from the 2026-09-29 finding for
CVE-2026-102268 rather than independently re-verified: the call sites and the
failing precondition are identical, and only the consequence differs. If that
finding is ever revised, this entry is revised with it.
"""
unblocked_when = "Semgrep permits PyJWT>=2.14.0"

[[allow]]
id       = "CVE-2026-101918"
package  = "pyjwt"
fixed_in = "2.15.0"
reason   = """
`PyJWKClient.get_signing_key_from_jwt` must decode a token's payload before it
can check the signature, and `PyJWT._decode_payload` catches only `ValueError`.
A payload that is valid JSON but nested ~20,000 levels deep makes `json.loads`
raise `RecursionError`, which escapes as an undocumented exception type rather
than `DecodeError` or any `PyJWTError`. Availability and error-contract only; it
forges nothing and discloses nothing.
Reached only through `PyJWKClient`, which is the same entry point
CVE-2026-102274's entry already dispositions: it is constructed only under
`semgrep mcp`, which `make sast` never starts, and mcp's signing path builds
none.
ADDED 2026-09-30, after the other eleven, and it is the SECOND advisory to
arrive during a single session's work — which is why the header above no longer
claims one retirement version for the file. Its reachability argument is
INHERITED from the 2026-09-29 finding, not independently re-verified here; if
that finding is revised, this entry is revised with it.
NOTE the different fixed_in. Every other entry clears at 2.14.0; this one needs
2.15.0, so a Semgrep release that permits 2.14.0 retires eleven entries and
leaves this one standing. A retirement sweep that assumes otherwise will remove
it while it is still live.
"""
unblocked_when = "Semgrep permits PyJWT>=2.15.0"

[[allow]]
id       = "CVE-2026-103001"
package  = "pyjwt"
fixed_in = "none"
reason   = """
`PyJWT._merge_options` mutates the caller's `options` dict in place when
`verify_signature` is falsy, writing `verify_exp`/`verify_nbf`/`verify_iat`/
`verify_aud`/`verify_iss`/`verify_sub`/`verify_jti` onto that object. An
application that REUSES one dict across calls can then have a later
`verify_signature=True` call silently inherit `verify_exp=False` and accept an
expired, wrong-audience, wrong-issuer or wrong-subject token. Unlike the twelve
entries above this is a claims-check bypass, not an availability or
error-contract defect -- so it is accepted on reachability alone, and the
argument is verified here rather than inherited.
THREE INDEPENDENT REASONS this invocation cannot reach it, each checked against
the installed distributions on 2026-09-30:
1. The only `jwt.decode` call in Semgrep is
   `semgrep/mcp/utilities/token_verifier.py:57`. Verified by grep for
   `jwt.decode|decode_complete|PyJWKClient` across the installed `semgrep`
   package: that file is the single importer of `jwt`.
2. That call passes `options={"verify_aud": False}` as a FRESH dict literal at
   the call site. The defect requires reusing one object across calls; a literal
   constructed per call carries nothing forward, so the bypass cannot occur even
   if the branch ran.
3. The branch does not run. `_merge_options` guards the mutation with
   `if not options.get("verify_signature", True)`. The call sets no
   `verify_signature` key, so the lookup returns the `True` default and the
   mutating branch is skipped entirely. Confirmed by reading
   `jwt/api_jwt.py::PyJWT._merge_options` in the installed PyJWT 2.13.0.
Reason 3 alone is decisive; 1 and 2 bound the surface independently of it.
The module is also under `semgrep mcp`, which `make sast` never starts -- the
same containment the entries above rely on, noted last here because this entry
does not need it.
WHY fixed_in IS `none`: the advisory publishes an empty `fix_versions`, so no
PyJWT release remediates it and the usual cross-check has nothing to compare.
It is a regression of a 2021 defect fixed in 2022 (PR #743) and silently
reintroduced by PR #1045 in 2025, so it is present in every release since.
This entry therefore retires on a DIFFERENT trigger from the twelve above: not
a Semgrep version bump, but the first PyJWT release that fixes it. The gate
enforces that direction -- the moment the feed publishes any fix version for
this id, the `none` sentinel becomes wrong and the gate exits 2.
"""
unblocked_when = "PyJWT publishes any release fixing CVE-2026-103001"
