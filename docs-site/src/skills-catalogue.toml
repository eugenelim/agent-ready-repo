# Input for tools/skills_catalogue.py. One table per user-invocable skill.
# Tables run in page order within each job. `want` is the goal, `ask` a request to
# paste, `gets` the result. Pack and link come from the skill's directory.
# `sequence` names a lifecycle sequence. Its rows stay together in lifecycle order
# ahead of the rest of the job, which runs A to Z by skill name.

[skills.adapt-to-project]
job = "Set up a repository"
want = "Fit the packs to my repository"
ask = "Check how well my repository's agent guidance fits, and improve it."
gets = "A diagnosis of your agent guidance and the changes to make it fit."

[skills.align-value-stream]
