[pack]
name = "architect"
version = "0.15.0"
description = "Understand the architecture you have, decide what to do next, design the future, diagram it, and review the evidence."
readme = "README.md"
display_name = "Architect"
license = "Apache-2.0 OR MIT"
categories = ["architecture", "documentation"]
keywords = ["architecture-assessment", "modernization", "design-docs", "diagrams", "critique"]

# Contract level v0.10 — portable skills and one standard-library helper,
# multi-adapter.
# Bumped from v0.6 so listing `copilot` is honest: copilot's skill
# primitive gained its user-scope target (`~/.copilot/instructions/`) at
# v0.10, and architect is user-scope-default. Mirrors `desk-research`/`core`.
[pack.adapter-contract]
version = "0.10"

[pack.install]
default-scope = "user"
allowed-scopes = ["user", "repo"]
# No adapter-specific primitives: Markdown Skills and the optional Python
# evidence profiler travel with every shipped adapter that projects skills.
# Current adapter names: `kiro` split into `kiro-ide`/`kiro-cli` (the bare
# `kiro` alias is deprecated); `copilot` is user-scope-capable; `cursor` and
# `gemini` reached full parity and project skills via existing modes — no
# `[pack.adapter-contract]` bump. Declared order is load-bearing:
# `kiro-ide` precedes `kiro-cli` so a Kiro user's `~/.kiro/` auto-probe resolves
# to the IDE; `cursor` then `gemini` appended last (append-only).
allowed-adapters = ["claude-code", "codex", "copilot", "kiro-ide", "kiro-cli", "cursor", "gemini"]

# Consolidated pack layout: the scope-keyed default for the
# [architecture] section of an adopter-owned `agentbundle-layout.toml`. Each design
# effort lands in its own per-effort folder <output_dir>/<topic-slug>/ under the base.
# No `[pack.layout.user]`: architect's output is per-repo (design docs belong in
# the repository they describe) and there is no sensible *absolute* user base, so
# the user-scope install append is a no-op (adopters write an [architecture] section
# by hand; see the skill's references/agentbundle-layout.md).
[pack.layout.repo]
output_dir = "docs/design"

# Pack activation evals: each user-facing workflow ships evals/eval_queries.json
# and is measured by tools/run-pack-evals.py. The generated
# architecture-lenses-reference router is intentionally excluded because it is
# selected by the workflows rather than by user-prompt activation.
[pack.evals]
skills = ["architect-assess", "architect-design", "architect-diagram", "architect-review"]

[pack.metadata.okf]
profile = "agentbundle-okf/v1"

[[pack.metadata.okf.bundles]]
id = "architecture-lenses"
path = "okf/architecture-lenses"
"router-skill" = "architecture-lenses-reference"

# Enriched pack manifest: catalogue-facing links
# + maintainer, including the `documentation` link to the per-pack guide home.
[pack.links]
homepage = "https://github.com/eugenelim/agent-ready-repo"
repository = "https://github.com/eugenelim/agent-ready-repo"
documentation = "https://github.com/eugenelim/agent-ready-repo/tree/main/guides/architect/"

[[pack.maintainers]]
name = "eugenelim"
email = "eugenelim@users.noreply.github.com"

# Level B: non-technical/mixed audience (product managers, non-engineer leads) needing plain-language architecture guidance.
[pack.first-value]
audience-posture = "non-technical"
surfaces         = ["claude-code"]
prerequisites    = []
verification     = "Ask 'Assess this repository's architecture' and confirm a bounded current-state map, evidence coverage, attention map, and drill-downs."
recovery         = "If evidence is sparse, narrow the repository boundary or supply the missing architecture/operations context; the survey must show the limitation rather than guessing."
level-b          = true
starter-task     = "Get a plain-language, evidence-backed map of the architecture and where to investigate next"
starter-prompt   = "Assess the architecture of this repository in survey mode. Show me the current-state model, evidence coverage, attention heat map, and proposed drill-downs; do not write files yet."
expected-result  = "A chat-only survey with a correctable conceptual model, evidence ledger, attention heat map, and bounded next investigations."
next-action      = "Correct the map or say 'continue', choose a hotspot, and create a reference snapshot only when you want one."
tutorial         = "guides/architect/tutorials/architect-first-session.md"

[[pack.integrations]]
id        = "project-knowledge-review-enquiry"
pack      = "core"
kind      = "handoff"
role      = "Bounded architecture-review knowledge enquiry"
consumers = ["skill:architect-review"]
providers = ["skill:project-knowledge"]
when      = "An optional consequential CQ-REVIEW question is declared after the artifact, scope, mode, and rubric are fixed and before the rubric walk."
purpose   = "Supply untrusted candidate checks through core's public read-only enquiry seam without changing architecture-review authority."
fallback  = "If the provider is absent, emit project-knowledge unavailable and complete the independently grounded review without fallback persistence."
