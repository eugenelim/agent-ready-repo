# Spec directories this repository refuses to prune.
#
# Two sources feed this list, and a construction test re-derives the first one
# rather than trusting what is written here:
#   1. every spec directory a roster test names by a literal repository path;
#   2. directories holding a byte-pinned file, plus the delivery contracts of the
#      prune capability itself.
#
# Its reach stops at literal paths. A path a test assembles at runtime from
# parametrised segments is not statically discoverable and is NOT covered here.
# This list is defense in depth; it is not what makes a deletion safe.

