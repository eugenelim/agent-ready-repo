# catalogue.toml — ini-005 Bucket 3 configuration layer for this repository.
# Defines the portable catalogue engine's view of this repo's catalogue.
# Schema: https://github.com/eugenelim/agent-ready-repo/docs/contracts/catalogue.schema.json
schema = 1

[catalogue]
name                         = "agent-ready-repo"
display-name                 = "Agent-Ready Repo"
description                  = "Reference catalogue for the agent-ready-repo adapter contract."
minimum-agentbundle-version  = "0.13.0"

[catalogue.paths]
packs       = "packs"
profiles    = "profiles"
contracts   = "contracts"
marketplace = ".claude-plugin/marketplace.json"
build-output = "dist"

[catalogue.build]
recipes                  = ["default"]
self-host                = false
# ADR-0072 pins the advertised `source.ref` to this branch and rests its accepted
# mutable-ref residual on that branch's protection ruleset, so this value is not free
# to differ from `build/main.py`'s `_DIST_BRANCH`, from the publisher's push target,
# or from `.github/claude-plugin-publish-control.json`'s `branch.target`. It said
# "main" until 2026-08-18, which no build published from — `main` carries the packs
# under `packs/`, not at the top level the emitted `source.path` expects.
# `tools/test_marketplace_envelope_parity.py` is what keeps all five in agreement.
claude-plugin-branch     = "claude-plugins-dist"
marketplace-description  = "Agent skills, subagents, and hooks for Claude Code and other coding agents."

[catalogue.package]
# Packs to include in a packaged archive; 'core' is always required.
include  = ["packs/core"]
required = ["packs/core"]

[distribution.agentbundle]
install-defaults-output = "packages/agentbundle/agentbundle/_data/install-defaults.toml"
preferred-adapter        = "claude-code"
default-source           = "git+https://github.com/eugenelim/agent-ready-repo"

[distribution.agentbundle.artifactory]
# Disabled by default — private forks configure this to point to their registry.
enabled = false
