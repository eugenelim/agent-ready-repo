<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" width="760" height="468" role="img" aria-labelledby="ot od">
<title id="ot">From idea to production in four stages</title>
<desc id="od">Four stages, left to right. Decide what to build is optional and ends when you pick the outcome. Shape it ends when you commit to build. Build it ends when you merge. Ship it ends when you ship it to production.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a33"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.045"/></pattern><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/></filter><filter id="soft" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7083a3"/></marker><linearGradient id="g-decide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="col-decide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/><stop offset="0.35" stop-color="#7c3aed" stop-opacity="0.08"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0.04"/></linearGradient><radialGradient id="glow-decide"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><marker id="arrow-decide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/></marker><linearGradient id="g-shape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="col-shape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0.30"/><stop offset="0.35" stop-color="#2563eb" stop-opacity="0.08"/><stop offset="1" stop-color="#2563eb" stop-opacity="0.04"/></linearGradient><radialGradient id="glow-shape"><stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient><marker id="arrow-shape" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker><linearGradient id="g-build" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="col-build" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#059669" stop-opacity="0.30"/><stop offset="0.35" stop-color="#059669" stop-opacity="0.08"/><stop offset="1" stop-color="#059669" stop-opacity="0.04"/></linearGradient><radialGradient id="glow-build"><stop offset="0" stop-color="#059669" stop-opacity="0.35"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient><marker id="arrow-build" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6ee7b7"/></marker><linearGradient id="g-ship" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#e11d48"/></linearGradient><linearGradient id="col-ship" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e11d48" stop-opacity="0.30"/><stop offset="0.35" stop-color="#e11d48" stop-opacity="0.08"/><stop offset="1" stop-color="#e11d48" stop-opacity="0.04"/></linearGradient><radialGradient id="glow-ship"><stop offset="0" stop-color="#e11d48" stop-opacity="0.35"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></radialGradient><marker id="arrow-ship" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fda4af"/></marker></defs>
