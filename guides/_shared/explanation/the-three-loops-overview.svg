<text x="28.0" y="44.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="750" fill="#f1f5f9" text-anchor="start">From idea to production in four stages</text>
<text x="28.0" y="68.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Start at the stage your work is in. The gold, pointed tags are where you decide.</text>
