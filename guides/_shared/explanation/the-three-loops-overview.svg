<text x="223.5" y="320.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7dd3fc" text-anchor="start">experience-design</text>
<text x="223.5" y="336.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7dd3fc" text-anchor="start">architect</text>
<text x="223.5" y="352.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7dd3fc" text-anchor="start">contracts</text>
