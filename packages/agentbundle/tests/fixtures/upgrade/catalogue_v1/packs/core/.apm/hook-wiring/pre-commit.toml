# Test fixture for SHA-tracking across upgrade versions. The
# command names the fixture's real body so the same pack remains valid when
# the dist-tree test path also compiles its Claude-plugin route. These fixtures
# do not exercise live hook firing.
[[hooks.PostToolUse]]
matcher = "Bash"
hooks = [
  { type = "command", command = "sh tools/hooks/pre-commit.sh" },
]
