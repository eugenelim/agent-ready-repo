# Default recipe: project each user-capable pack as a Claude Code plugin into
# dist/claude-plugins/<pack>/. A plugin's code lands in the adopter's global
# cache, so a pack whose allowed-scopes omits `user` is skipped on this route.

[recipe]
name = "per-pack-claude-plugin"
type = "per-pack"
route = "claude-plugins"
adapter = "claude-code"
output-subdir = "claude-plugins"
