[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbundle"
version = "0.47.3"
description = "npm for your coding agent. Install packs of skills, subagents, and hooks into any repo, for every major agent."
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "eugenelim", email = "eugenelim@users.noreply.github.com" }]
license = "Apache-2.0 OR MIT"
readme = "README-pypi.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
lint = ["pyyaml>=6.0"]

[project.urls]
Homepage           = "https://github.com/eugenelim/agent-ready-repo"
Source             = "https://github.com/eugenelim/agent-ready-repo"
Documentation      = "https://eugenelim.github.io/agent-ready-repo/docs/"
"Catalogue Format" = "https://eugenelim.github.io/agent-ready-repo/docs/reference/catalogue-format"
Changelog          = "https://eugenelim.github.io/agent-ready-repo/docs/changelog"

[project.scripts]
agentbundle = "agentbundle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentbundle*"]

[tool.setuptools.package-data]
agentbundle = [
    "_data/*",
    "_data/vendor/**/*",
    "_data/catalogue-scaffold/**/*",
    "_data/catalogue-scaffold/packs/_example/.apm/**/*",
    "_data/catalogue-scaffold/packs/_example/.claude-plugin/*",
    "build/recipes/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# This table SHADOWS the root pyproject's [tool.pytest.ini_options] rather than
# merging with it, so the root's `pythonpath` does not reach a run invoked as
# `pytest packages/agentbundle/tests/` -- pytest picks the nearest configfile
# and stops. Unlike the sibling packages, this suite already resolved the
# worktree copy without this line, but only by accident: `tests/__init__.py`
# makes `tests` a package, so prepend import-mode inserts this directory as the
# basedir. Deleting that file, or moving the suite to
# `--import-mode=importlib`, would silently redirect every `import agentbundle`
# to whatever is in site-packages -- and an editable install here is global to
# the interpreter and routinely points at another worktree
# (`tools/repo/editable_install_guard.py`). This line states the resolution the
# suite depends on instead of inheriting it from a layout detail.
pythonpath = ["."]
