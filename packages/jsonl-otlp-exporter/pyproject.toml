[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-otlp-exporter"
version = "0.2.0"
description = "Send JSONL records to an OpenTelemetry Collector as OTLP logs, with the field mapping supplied as a declarative profile."
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "eugenelim", email = "eugenelim@users.noreply.github.com" }]
license = { text = "Apache-2.0 OR MIT" }
readme = "README-pypi.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
]

# The standard library is the only runtime dependency, and there is no extra
# that changes that. OTLP/HTTP JSON is a documented wire format reachable with
# `urllib.request` and `json`; taking the OpenTelemetry SDK would add a
# dependency tree to a tool whose whole job is one POST.

[project.scripts]
jsonl-otlp-export = "jsonl_otlp_exporter.cli:main"

[project.urls]
Homepage = "https://github.com/eugenelim/agent-ready-repo"
Source = "https://github.com/eugenelim/agent-ready-repo"

[tool.setuptools.packages.find]
where = ["."]
include = ["jsonl_otlp_exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# This table SHADOWS the root pyproject's [tool.pytest.ini_options] rather than
# merging with it, so the root's `pythonpath` does not reach a run invoked as
# `pytest packages/jsonl-otlp-exporter/` -- pytest picks the nearest configfile
# and stops. Without this line the whole suite fails collection with
# `No module named 'jsonl_otlp_exporter'` unless the distribution happens to be
# installed. Both sibling packages had the identical omission and now carry the
# identical line; `tests/roster/test_package_pytest_pythonpath.py` is what keeps
# a fourth package from reopening it.
pythonpath = ["."]
